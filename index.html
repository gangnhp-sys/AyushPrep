function useMediaEditor(q,title,html){
  var opener=document.activeElement;
  openModal('<div class="mhead"><h3 id="questionMediaTitle">'+title+'</h3><button type="button" class="mini" data-act="close-modal" aria-label="बंद करें">✕</button></div>'
    +'<div class="mbody qm-editor"><p class="qm-question">'+esc(q.question)+'</p>'+html
    +'<p class="qm-status" data-qm="status" role="status" aria-live="polite"></p>'
    +'<p class="qm-privacy">यह attachment इसी browser में offline save होगा। कहीं upload नहीं होता।</p></div>'
    +'<div class="mfoot"><button class="btn ghost" data-act="close-modal">बंद करें</button></div>',true);
  var root=modalRoot.querySelector('.modal');
  root.setAttribute('role','dialog');root.setAttribute('aria-modal','true');root.setAttribute('aria-labelledby','questionMediaTitle');
  var state={closed:false,cleanup:null,url:'',blob:null};
  state.node=function(role){return root.querySelector('[data-qm="'+role+'"]');};
  state.status=function(text,kind){
    if(state.closed)return;
    var label=state.node('status');label.textContent=text;
    label.classList.toggle('err',kind==='error');label.classList.toggle('rec',kind==='record');
  };
  state.preview=function(blob){
    var player=state.node('preview');
    if(state.blob===blob)return;
    if(player.tagName==='AUDIO'&&player.hasAttribute('src'))player.pause();
    revokeMediaURL(state.url);state.url='';state.blob=blob;
    if(blob){state.url=URL.createObjectURL(blob);player.src=state.url;}
    else player.removeAttribute('src');
  };
  activeModalCleanup=function(){
    state.closed=true;
    var player=state.node('preview');
    if(player&&player.tagName==='AUDIO'&&player.hasAttribute('src'))player.pause();
    if(state.cleanup)state.cleanup();
    revokeMediaURL(state.url);state.url='';state.blob=null;
    if(opener instanceof HTMLElement)requestAnimationFrame(function(){
      if(!opener.isConnected||modalRoot.firstElementChild)return;
      var voiceTools=opener.closest('.qmedia-voice-tools');
      var focus=opener.hidden&&voiceTools?voiceTools.querySelector('[data-act="qmedia-voice"]'):opener;
      focus.focus({preventScroll:true});
    });
  };
  root.addEventListener('keydown',function(e){
    if(e.key!=='Tab')return;
    var items=Array.from(root.querySelectorAll('button:not(:disabled), input:not(:disabled), audio[controls]')).filter(function(el){return el.offsetParent!==null;});
    if(!items.length)return;
    var first=items[0], last=items[items.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  });
  root.querySelector('[data-act="close-modal"]').focus({preventScroll:true});
  return state;
}
function writeMediaError(editor,error){
  var name=error&&error.name||'';
  if(name==='QuotaExceededError')editor.status('Browser storage भर गया। पहले backup लें या पुराने attachments हटाएँ। आपका पिछला attachment नहीं बदला।','error');
  else editor.status('Attachment save नहीं हुआ। Browser storage check करके फिर कोशिश करें। पिछला attachment नहीं बदला।','error');
}
function showSavedMediaText(value,key){
  return value&&value[key]?(key==='voice'?'Voice note'+(value.seconds?' · '+voiceTime(value.seconds):'')+' इस browser में saved है।':'Image इस browser में saved है।'):
    (key==='voice'?'अभी voice note नहीं है। Record दबाकर शुरू करें।':'अभी image नहीं है। नीचे से एक image चुनें।');
}
function voiceTime(total){
  total=Math.max(0,Math.floor(total));
  return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}
function stopMic(stream){if(stream)stream.getTracks().forEach(function(track){track.stop();});}
function micProblem(error){
  if(error&&error.name==='NotAllowedError')return 'Mic की permission नहीं मिली। इस file को सीधे Chrome/Edge में खोलें और microphone के लिए Allow चुनें।';
  if(error&&(error.name==='NotFoundError'||error.name==='DevicesNotFoundError'))return 'Microphone नहीं मिला। Mic connect करके फिर Record दबाएँ।';
  if(error&&error.name==='NotReadableError')return 'Mic अभी उपलब्ध नहीं है। Mic इस्तेमाल करने वाला दूसरा app बंद करके फिर कोशिश करें।';
  return 'Microphone से record नहीं हो पाया। Chrome/Edge में microphone settings जाँचें।';
}
function makeRecorder(stream){
  var options=['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4'];
  var chosen=typeof MediaRecorder.isTypeSupported==='function'?options.find(function(type){return MediaRecorder.isTypeSupported(type);}):'';
  try{return new MediaRecorder(stream,chosen?{mimeType:chosen,audioBitsPerSecond:40000}:{audioBitsPerSecond:40000});}
  catch(error){return new MediaRecorder(stream);}
}
function openVoiceNote(q,editing){
  var editor=useMediaEditor(q,editing?'Edit voice note':'Voice note',
    '<audio data-qm="preview" controls preload="metadata" hidden></audio>'
    +'<div class="qm-controls">'+mediaButton('start','● Record','primary',true)
    +mediaButton('stop','■ Stop','danger',true)+mediaButton('save','Save voice note','primary',true)
    +mediaButton('discard','Discard draft','ghost',true)+mediaButton('remove','Remove voice note','ghost',true)+'</div>'
    +mediaDeleteHTML('Saved voice note')+'<p class="qm-help">Max 5 मिनट। नई recording पुराने note की जगह सिर्फ़ Save करने पर लेगी।</p>');
  var id=String(q.id), saved=null, draft=null, stage='loading', confirming=false;
  var mic=null, recorder=null, tick=0, limit=0, started=0, ended=0;
  var supported=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
  var start=editor.node('start'), stop=editor.node('stop'), saveBtn=editor.node('save'), discard=editor.node('discard'), remove=editor.node('remove');
  var player=editor.node('preview');
  player.addEventListener('error',function(){
    if(player.hasAttribute('src'))editor.status('यह audio नहीं चल पाया। Chrome या Edge में file खोलें, या नया note Record करें।','error');
  });
  function clearTimers(){clearInterval(tick);clearTimeout(limit);tick=0;limit=0;}
  function release(){clearTimers();stopMic(mic);mic=null;}
  function refresh(){
    var active=stage==='recording', pending=stage==='asking'||stage==='stopping'||stage==='saving';
    var blob=draft?draft.blob:(saved&&saved.voice||null);
    var showPlayer=!active&&stage!=='stopping'&&!!blob;
    player.hidden=!showPlayer;
    editor.preview(showPlayer?blob:null);
    start.hidden=!(stage==='ready'||stage==='asking');start.disabled=pending||!!draft||confirming||!supported;
    start.textContent=stage==='asking'?'Mic खोल रहे हैं…':saved&&saved.voice?'● Record again':'● Record';
    stop.hidden=!active;
    saveBtn.hidden=discard.hidden=!draft;saveBtn.disabled=discard.disabled=pending;
    remove.hidden=!(stage==='ready'&&saved&&saved.voice&&!draft);remove.disabled=confirming;
    editor.node('confirm').hidden=!confirming;
  }
  function stopRecording(){
    if(stage!=='recording'||!recorder)return;
    stage='stopping';ended=performance.now();clearTimers();
    editor.status('Recording तैयार कर रहे हैं…');refresh();
    if(recorder.state!=='inactive')recorder.stop();
  }
  async function startRecording(){
    if(stage!=='ready'||draft||!supported)return;
    confirming=false;stage='asking';editor.status('Microphone permission का इंतज़ार…');refresh();
    try{
      var stream=await navigator.mediaDevices.getUserMedia({audio:true});
      if(editor.closed){stopMic(stream);return;}
      mic=stream;
      var rec=makeRecorder(stream), pieces=[], bytes=0, tooBig=false;
      recorder=rec;
      rec.ondataavailable=function(event){
        if(editor.closed||recorder!==rec||!event.data.size)return;
        bytes+=event.data.size;
        if(bytes>MAX_VOICE_BYTES){tooBig=true;stopRecording();}
        else pieces.push(event.data);
      };
      rec.onerror=function(){
        if(editor.closed||recorder!==rec)return;
        recorder=null;release();stage='ready';draft=null;
        editor.status('Recording रुक गई। पिछला saved note नहीं बदला।','error');refresh();
      };
      rec.onstop=function(){
        if(editor.closed||recorder!==rec)return;
        recorder=null;release();stage='ready';
        var blob=new Blob(pieces,{type:rec.mimeType||(pieces[0]&&pieces[0].type)||'audio/webm'});
        if(tooBig||!blob.size){editor.status(tooBig?'Recording बहुत बड़ी है। छोटा note रिकॉर्ड करें।':'Audio capture नहीं हुआ। फिर Record दबाएँ।','error');refresh();return;}
        draft={blob:blob,seconds:Math.min(MAX_VOICE_SECONDS,Math.max(0,Math.round(((ended||performance.now())-started)/1000)))};
        editor.status('Draft '+voiceTime(draft.seconds)+' · सुनकर Save voice note दबाएँ।');refresh();
      };
      rec.start(500);started=performance.now();ended=0;stage='recording';
      function updateTime(){editor.status('● Recording  '+voiceTime((performance.now()-started)/1000)+' / 05:00','record');}
      updateTime();tick=setInterval(updateTime,350);limit=setTimeout(stopRecording,MAX_VOICE_SECONDS*1000);refresh();
    }catch(error){
      recorder=null;release();if(editor.closed)return;
      stage='ready';editor.status(micProblem(error),'error');refresh();
    }
  }
  async function commit(change,success,needsSavedQuestion){
    if(needsSavedQuestion&&!canSaveMediaLibrary()){editor.status(MEDIA_LIBRARY_HELP,'error');return;}
    stage='saving';confirming=false;editor.status('Save कर रहे हैं…');refresh();
    try{
      var next=await updateQuestionMedia(id,change);
      refreshQuestionMedia(id,next);
      if(!editor.closed){
        saved=next;draft=null;
        if(needsSavedQuestion)closeModal();else editor.status(success);
      }
      toast(success);
    }catch(error){writeMediaError(editor,error);}
    if(!editor.closed){stage='ready';refresh();}
  }
  start.addEventListener('click',startRecording);stop.addEventListener('click',stopRecording);
  saveBtn.addEventListener('click',function(){
    if(stage!=='ready'||!draft)return;
    var current=draft;
    commit(function(record){record.voice=current.blob;record.seconds=current.seconds;return record;},'Voice note save हो गया।',true);
  });
  discard.addEventListener('click',function(){draft=null;editor.status(showSavedMediaText(saved,'voice'));refresh();});
  remove.addEventListener('click',function(){confirming=true;refresh();editor.node('delete').focus();});
  editor.node('keep').addEventListener('click',function(){confirming=false;refresh();remove.focus();});
  editor.node('delete').addEventListener('click',function(){
    if(stage!=='ready'||!confirming)return;
    commit(function(record){delete record.voice;delete record.seconds;return record;},'Voice note हटा दिया गया।');
  });
  editor.cleanup=function(){
    if(recorder&&recorder.state!=='inactive'){
      recorder.ondataavailable=recorder.onstop=recorder.onerror=null;
      try{recorder.stop();}catch(error){}
    }
    recorder=null;release();draft=null;
  };
  editor.status('Saved voice note देख रहे हैं…');
  (storageAvailable?readQuestionMedia(id):Promise.reject(new Error('Storage unavailable'))).then(function(value){
    if(editor.closed)return;
    saved=value;stage='ready';
    editor.status(supported?showSavedMediaText(saved,'voice'):'इस browser में recording उपलब्ध नहीं है। HTML सीधे Chrome/Edge में खोलें।',supported?'':'error');refresh();
  }).catch(function(){editor.status(MEDIA_STORAGE_HELP,'error');});
}
function decodeImageFromURL(url){
  return new Promise(function(resolve,reject){
    var img=new Image();img.onload=function(){resolve(img);};img.onerror=function(){reject(new Error('Image पढ़ी नहीं जा सकी।'))};img.src=url;
  });
}
function encodeCanvas(canvas,quality){
  return new Promise(function(resolve,reject){
    canvas.toBlob(function(blob){if(blob)resolve(blob);else reject(new Error('Image तैयार नहीं हो पाई।'));},'image/webp',quality);
  });
}
async function prepareQuestionImage(file){
  var type=String(file.type||'').toLowerCase();
  if(!/^image\/(jpeg|png|webp)$/.test(type)&&(type||!/\.(jpe?g|png|webp)$/i.test(file.name)))throw new Error('JPG, PNG या WebP image चुनें।');
  if(!file.size||file.size>MAX_IMAGE_INPUT)throw new Error('20 MB से छोटी JPG, PNG या WebP image चुनें।');
  var src=null, url='', canvas=null;
  try{
    if(typeof createImageBitmap==='function')try{src=await createImageBitmap(file);}catch(error){}
    if(!src){url=URL.createObjectURL(file);src=await decodeImageFromURL(url);}
    var width=src.naturalWidth||src.width, height=src.naturalHeight||src.height;
    if(!width||!height||width*height>50000000)throw new Error('इस image का resolution बहुत बड़ा है। छोटी copy चुनें।');
    canvas=document.createElement('canvas');
    for(var i=0;i<3;i++){
      var scale=Math.min(1,[1920,1536,1080][i]/Math.max(width,height));
      canvas.width=Math.max(1,Math.round(width*scale));canvas.height=Math.max(1,Math.round(height*scale));
      var ctx=canvas.getContext('2d');ctx.imageSmoothingQuality='high';ctx.drawImage(src,0,0,canvas.width,canvas.height);
      var blob=await encodeCanvas(canvas,[.9,.82,.75][i]);
      if(blob.size<=MAX_IMAGE_BYTES)return {blob:blob,width:canvas.width,height:canvas.height};
    }
    throw new Error('Image बहुत बड़ी है। इससे छोटी image चुनें।');
  }finally{
    revokeMediaURL(url);
    if(src&&typeof src.close==='function')src.close();
    if(canvas){canvas.width=0;canvas.height=0;}
  }
}

/* Portable backups keep media in JSON only for explicit export, not in the bank. */
var mediaExportBusy=false;
function mediaReference(ref){return typeof ref==='string'&&ref.length>0&&ref.length<=160?ref:'';}
function mediaToBase64(blob){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onerror=function(){reject(reader.error);};
    reader.onload=function(){var value=String(reader.result);resolve(value.slice(value.indexOf(',')+1));};
    reader.readAsDataURL(blob);
  });
}
async function downloadWithQuestionMedia(name,build,includeIds){
  if(mediaExportBusy){toast('Backup पहले से तैयार हो रहा है।');return;}
  mediaExportBusy=true;
  try{
    if(!storageAvailable){toast('इस preview में media storage उपलब्ध नहीं है। HTML सीधे browser में खोलें या Text-only backup लें।',true);return;}
    var entries=[], refs=new Set();
    var records=(await allQuestionMedia()).filter(function(record){
      return includeIds.has(String(record.id))&&(record.voice||record.image);
    });
    var total=records.reduce(function(n,r){return n+(r.voice?r.voice.size:0)+(r.image?r.image.size:0);},0);
    if(total>MAX_MEDIA_BACKUP){toast('Attachments 80 MB से ज़्यादा हैं। छोटे Topic exports लें। Text-only backup में attachments नहीं होंगे।',true);return;}
    if(records.length)toast('Voice notes और images के साथ backup बना रहे हैं…');
    for(var i=0;i<records.length;i++){
      var r=records[i], ref=mediaReference(String(r.id));
      if(!ref)throw new Error('Attachment reference missing');
      var entry={ref:ref};
      if(r.voice)entry.voice={type:r.voice.type,data:await mediaToBase64(r.voice),seconds:r.seconds||0};
      if(r.image)entry.image={type:r.image.type,data:await mediaToBase64(r.image),width:r.width||0,height:r.height||0};
      entries.push(entry);refs.add(ref);
    }
    var payload=build(refs);
    if(entries.length)payload.questionMedia={version:1,entries:entries};
    download(name,payload);
  }catch(error){toast('Media backup तैयार नहीं हुआ। HTML सीधे browser में खोलकर फिर कोशिश करें, या Text-only backup लें।',true);}
  finally{mediaExportBusy=false;}
}
function readBackupBlob(value,kind){
  if(!value||typeof value.data!=='string'||typeof value.type!=='string'||!value.data.length||value.type.length>120)return null;
  var type=value.type.split(';')[0].toLowerCase().trim();
  var permitted=kind==='image'?/^image\/(jpeg|png|webp)$/.test(type):/^(?:audio\/(?:webm|ogg|mp4|mpeg|aac|wav|x-wav|wave)|video\/(?:webm|mp4))$/.test(type);
  var limit=kind==='image'?MAX_IMAGE_BYTES:MAX_VOICE_BYTES;
  if(!permitted||value.data.length>4*Math.ceil(limit/3))return null;
  try{
    var bytes=atob(value.data);
    if(!bytes.length||bytes.length>limit)return null;
    var arr=new Uint8Array(bytes.length);
    for(var i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);
    if(kind==='image'){
      var valid=type==='image/png'?arr[0]===137&&bytes.slice(1,4)==='PNG':type==='image/jpeg'?arr[0]===255&&arr[1]===216:
        bytes.slice(0,4)==='RIFF'&&bytes.slice(8,12)==='WEBP';
      if(!valid)return null;
    }
    return new Blob([arr],{type:value.type});
  }catch(error){return null;}
}
async function restoreQuestionMedia(pack,targets){
  var info={added:0,kept:0,skipped:0,error:''};
  if(!pack||pack.version!==1||!Array.isArray(pack.entries)){
    info.error='Voice/image backup का format मान्य नहीं है।';return info;
  }
  if(!pack.entries.length)return info;
  if(!storageAvailable){info.error=MEDIA_STORAGE_HELP;return info;}
  if(!canSaveMediaLibrary()){info.error=MEDIA_LIBRARY_HELP;return info;}
  try{
    await mediaIDB();
    for(var i=0;i<pack.entries.length;i++){
      var entry=pack.entries[i], matches=entry&&targets.get(mediaReference(entry.ref));
      if(!matches||!matches.size){info.skipped++;continue;}
      var voice=entry.voice?readBackupBlob(entry.voice,'voice'):null;
      var image=entry.image?readBackupBlob(entry.image,'image'):null;
      if(entry.voice&&!voice)info.skipped++;
      if(entry.image&&!image)info.skipped++;
      if(!voice&&!image)continue;
      for(var id of matches){
        // Never overwrite a newer recording or image that is already in this browser.
        if(!questionMediaSource(id)){info.skipped++;continue;}
        var delta=0, kept=0;
        var next=await updateQuestionMedia(id,function(record){
          if(voice){
            if(record.voice)kept++;
            else{record.voice=voice;record.seconds=Math.min(MAX_VOICE_SECONDS,Math.max(0,Math.round(Number(entry.voice.seconds)||0)));delta++;}
          }
          if(image){
            if(record.image)kept++;
            else{
              record.image=image;
              record.width=Math.min(1920,Math.max(0,Math.round(Number(entry.image.width)||0)));
              record.height=Math.min(1920,Math.max(0,Math.round(Number(entry.image.height)||0)));
              delta++;
            }
          }
          return record;
        });
