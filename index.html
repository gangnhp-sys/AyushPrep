var fm={};
function openQuestionModal(sid,tid,qid,subId){
  var t=getTopic(sid,tid);
  var box=containerOf(t,subId||null);
  var sub=subId?getSub(t,subId):null;
  var q=null;
  if(qid&&box)for(var i=0;i<(box.questions||[]).length;i++)if(box.questions[i].id===qid)q=box.questions[i];
  fm={sid:sid,tid:tid,qid:qid,subId:subId||null,options:q?q.options.slice():['','','',''],correct:q?q.correct:0};
  if(fm.options.length<2)fm.options=['','','',''];
  var html='<div class="mhead"><h3>'+(q?'Question edit करें':'नया Question जोड़ें')
    +(sub?'<span class="chip on" style="margin-left:9px;pointer-events:none">'+esc(sub.name)+'</span>':'')+'</h3>'
    +'<button class="mini" data-act="close-modal">✕</button></div>'
    +'<div class="mbody">'
      +'<div class="field"><label>Question</label><textarea class="inp" id="qText" rows="3" placeholder="यहाँ प्रश्न लिखें...">'+(q?esc(q.question):'')+'</textarea></div>'
      +'<div class="field"><label for="qExamName">Exam name (optional)</label><input class="inp" id="qExamName" placeholder="जैसे SSC CGL" value="'+(q?esc(q.examName||''):'')+'"></div>'
      +'<div class="exam-fields"><div class="field"><label for="qExamDate">Exam date (optional)</label><input class="inp" id="qExamDate" placeholder="जैसे 15/03/2025" value="'+(q?esc(q.examDate||''):'')+'"></div>'
      +'<div class="field"><label for="qExamShift">Shift (optional)</label><input class="inp" id="qExamShift" placeholder="जैसे Shift 1" value="'+(q?esc(q.examShift||''):'')+'"></div></div>'
      +'<div class="field"><label>Options — सही वाले के बाईं ओर का बटन (A/B/C/D) दबाएँ</label>'
      +'<div id="optList" style="display:flex;flex-direction:column;gap:8px"></div>'
      +'<button class="btn ghost sm" id="addOpt" style="align-self:flex-start">＋ Add option</button></div>'
      +'<div class="field"><label>Hint (optional, सिर्फ Practice में)</label><input class="inp" id="qHint" placeholder="बिना answer बताए छोटा संकेत दें" value="'+(q?esc(q.hint||''):'')+'"></div>'
      +'<div class="field"><label>Explanation (optional)</label>'
      +'<input class="inp" id="qExp" placeholder="सही answer का reason या short trick" value="'+(q?esc(q.explanation||''):'')+'"></div>'
    +'</div>'
    +'<div class="mfoot"><button class="btn ghost" data-act="close-modal">Cancel</button>'
    +'<button class="btn primary" id="saveQ">'+(q?'Save changes':'Add Question')+'</button></div>';
  openModal(html,true);

  function readOpts(){
    document.querySelectorAll('#optList input[data-oi]').forEach(function(inp){fm.options[+inp.dataset.oi]=inp.value;});
  }
  function drawOpts(){
    var list=document.getElementById('optList');
    list.innerHTML='';
    fm.options.forEach(function(v,i){
      var row=document.createElement('div');
      row.className='optrow';
      row.innerHTML='<button class="pick '+(fm.correct===i?'sel':'')+'" data-pick="'+i+'" title="Correct answer">'+LETTERS[i]+'</button>'
        +'<input class="inp" data-oi="'+i+'" placeholder="Option '+LETTERS[i]+'" value="'+esc(v)+'" maxlength="200">'
        +(fm.options.length>2?'<button class="rm" data-rm="'+i+'" title="Remove">✕</button>':'');
      list.appendChild(row);
    });
    list.querySelectorAll('[data-pick]').forEach(function(b){
      b.onclick=function(){readOpts();fm.correct=+b.dataset.pick;drawOpts();};
    });
    list.querySelectorAll('[data-rm]').forEach(function(b){
      b.onclick=function(){
        readOpts();
        var i=+b.dataset.rm;
        fm.options.splice(i,1);
        if(fm.correct>=fm.options.length)fm.correct=fm.options.length-1;
        if(fm.correct>i)fm.correct--;
        if(fm.correct<0)fm.correct=0;
        drawOpts();
      };
    });
  }
  drawOpts();
  document.getElementById('addOpt').onclick=function(){
    readOpts();
    if(fm.options.length>=6){toast('Max 6 options',true);return;}
    fm.options.push('');drawOpts();
    var all=document.querySelectorAll('#optList input[data-oi]');
    if(all.length)all[all.length-1].focus();
  };
  document.getElementById('saveQ').onclick=function(){
    readOpts();
    var text=document.getElementById('qText').value.trim();
    var exp=document.getElementById('qExp').value.trim();
    var hint=document.getElementById('qHint').value.trim();
    var examName=document.getElementById('qExamName').value.trim();
    var examDate=document.getElementById('qExamDate').value.trim(),examShift=document.getElementById('qExamShift').value.trim();
    var opts=fm.options.map(function(o){return String(o).trim();}).filter(function(o){return o!=='';});
    if(!text){toast('Question लिखें',true);document.getElementById('qText').focus();return;}
    if(opts.length<2){toast('कम से कम 2 options चाहिए',true);return;}
    var correctIdx=0,kept=0;
    for(var i=0;i<fm.options.length;i++){
      if(String(fm.options[i]).trim()!==''){if(i===fm.correct)correctIdx=kept;kept++;}
    }
    var tp=containerOf(getTopic(sid,tid),fm.subId);
    if(!Array.isArray(tp.questions))tp.questions=[];
    if(q){q.question=text;q.options=opts;q.correct=correctIdx;q.explanation=exp;q.hint=hint;q.examName=examName;q.examDate=examDate;q.examShift=examShift;toast('Question update हो गया ✅');}
    else{tp.questions.push({id:uid(),question:text,options:opts,correct:correctIdx,explanation:exp,hint:hint,examName:examName,examDate:examDate,examShift:examShift,createdAt:Date.now()});toast('Question जुड़ गया 🎉');if(!fm.subId)state.tab='questions';}
    save();closeModal();render();
  };
  setTimeout(function(){var el=document.getElementById('qText');if(el)el.focus();},60);
}

function questionImportStatusHTML(){return '<div class="q-import-status" role="status" aria-live="polite" data-q-import-status hidden></div>';}
function openImportModal(sid,tid,subId){
  var subject=getSubject(sid), topic=getTopic(sid,tid), sub=subId&&topic?getSub(topic,subId):null;
  if(!subject||!topic||(subId&&!sub)){toast('Import का topic या chapter नहीं मिला।',true);return;}

function bindQuestionImporter(root,target){
  var file=root.querySelector(target?'#mFileInp':'#fileInp');
  var area=root.querySelector(target?'#mJson':'#importJson');
  var submit=root.querySelector(target?'#mDoImport':'#doImport');
  var status=root.querySelector('[data-q-import-status]');
  var scope=root.querySelector('[data-import-subject-wide]');
  if(!file||!area||!submit||!status)return;
  var readToken=0, selectedText=null;
  function updateStatus(level,message){
    status.hidden=!message;status.dataset.level=level;
    status.textContent='';
    if(message)appendLine(message);
  }
  function appendLine(message){var line=document.createElement('p');line.textContent=message;status.appendChild(line);}
  function clearSelectedFile(){readToken++;selectedText=null;file.value='';submit.disabled=false;}
  function showResult(result,summary){
    var restored=result.mediaRestore;
    updateStatus((result.error||(restored&&restored.error)||(!importChanged(result)&&!(restored&&restored.kept)))?'error':'ok',summary);
    if(result.error)appendLine(result.error);
    if(restored){
      if(restored.error)appendLine(restored.error);
      if(restored.kept)appendLine(restored.kept+' existing voice notes/images नहीं बदले गए।');
      if(restored.skipped)appendLine(restored.skipped+' attachments match नहीं हुए या valid नहीं थे।');
    }
    if(!importChanged(result)&&!result.error&&!result.invalid&&!result.duplicates&&!restored){
      appendLine('कोई सवाल नहीं मिला। questions की list या एक question object दें। हर सवाल में question और कम से कम 2 options चाहिए।');
    }
    result.details.forEach(appendLine);
    if(result.defaultAnswers)appendLine(result.defaultAnswers+' सवालों में answer नहीं दिया गया था; उनका पहला option सही माना गया।');
    if(result.duplicates&&!result.added&&scope&&scope.checked){
      appendLine('अगर वही सवाल इस chapter में भी चाहिए, तो पूरे subject वाली checkbox हटाकर फिर import करें।');
    }
    if(result.targets.length){
      var list=document.createElement('ul');list.className='q-import-places';
      result.targets.slice(0,12).forEach(function(dest){
        var li=document.createElement('li'), button=document.createElement('button');
        button.type='button';button.className='btn soft sm';button.textContent=dest.path+' · '+dest.added+' नए सवाल देखें →';
        button.addEventListener('click',function(){if(target)closeModal();openImportedQuestions(dest);});
        li.appendChild(button);list.appendChild(li);
      });
      status.appendChild(list);
      if(result.targets.length>12)appendLine('बाकी '+(result.targets.length-12)+' जगहें Subjects मेनू में मिलेंगी।');
    }
    if(importChanged(result)&&storageMessage)appendLine(storageMessage);
  }
  area.addEventListener('input',function(){clearSelectedFile();updateStatus('','');});
  file.addEventListener('change',function(){
    var chosen=file.files&&file.files[0];if(!chosen)return;
    var token=++readToken;
    selectedText=null;area.value='';submit.disabled=true;
    updateStatus('info','“'+chosen.name+'” पढ़ रहे हैं…');
    var reader=new FileReader();
    reader.onload=function(){
      if(token!==readToken||!area.isConnected)return;
      selectedText=String(reader.result||'');submit.disabled=false;
      // Keep large files in memory, not in a repainted textarea.
      if(selectedText.length<50000)area.value=selectedText;
      updateStatus('info','“'+chosen.name+'” तैयार है। नीचे Import करें दबाएँ।');
    };
    reader.onerror=function(){
      if(token!==readToken||!area.isConnected)return;
      clearSelectedFile();updateStatus('error','फ़ाइल पढ़ी नहीं जा सकी। फिर चुनें या JSON paste करें।');
    };
    reader.readAsText(chosen);
  });
  var sample=root.querySelector('#loadSample');
  if(sample)sample.addEventListener('click',function(){
    clearSelectedFile();
    area.value=JSON.stringify({subject:'Maths',topic:'प्रतिशत (नमूना)',questions:[
      {question:'किसी संख्या का 40% यदि 80 है, तो संख्या कितनी है?',options:['160','200','240','320'],correct:'B',explanation:'40% = 80 → 100% = 200'},
      {question:'500 का 12.5% कितना होगा?',options:['50','55','62.5','75'],correct:2,explanation:'500 × 12.5/100 = 62.5'},
      {question:'एक वस्तु 800 से 1000 हो गई। प्रतिशत वृद्धि?',options:['20%','25%','10%','30%'],correct:'25%',explanation:'200/800 × 100 = 25%'}
    ]},null,2);
    updateStatus('info','Sample तैयार है। Import करें दबाएँ।');
  });
  submit.addEventListener('click',async function(){
    var text=(selectedText===null?area.value:selectedText).trim();
    if(!text){updateStatus('error','पहले JSON file चुनें या questions का JSON paste करें।');return;}
    var data;
    try{data=parseQuestionPayload(text);}
    catch(e){updateStatus('error','JSON पढ़ा नहीं गया। सही JSON file या code block दें।');appendLine(e.message);return;}
    var result=importData(data,target&&target.sid,target&&target.tid,target&&target.subId,!!(scope&&scope.checked));
    if(importChanged(result))save();
    if(result.mediaPack!==undefined){
      submit.disabled=area.disabled=file.disabled=true;if(sample)sample.disabled=true;
      updateStatus('info','Voice notes और images restore हो रहे हैं…');
      result.mediaRestore=await restoreQuestionMedia(result.mediaPack,result.mediaTargets);
      if(!status.isConnected)return;
      submit.disabled=area.disabled=file.disabled=false;if(sample)sample.disabled=false;
    }
    var summary=importToast(result);
    var dest=result.targets[0];
    if(target&&result.targets.length===1&&dest.sid===target.sid&&dest.tid===target.tid&&dest.subId===(target.subId||'')
        &&!result.error&&!result.invalid&&!result.defaultAnswers&&!result.mediaRestore){
      closeModal();openImportedQuestions(dest);toast(summary);
      return;
    }
    showResult(result,summary);
  });
}

/* ---------- theory parser: Markdown / plain text / JSON ---------- */
function mdInline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,function(m,g){return '<code>'+g+'</code>';});
  s=s.replace(/\*\*\*([^*]+)\*\*\*/g,'<strong><em>$1</em></strong>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s=s.replace(/~~([^~]+)~~/g,'<s>$1</s>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,function(m,txt,url){
    return '<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+txt+'</a>';
  });
  return s;
}
function mdCells(line){
  return line.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|')
    .map(function(c){return mdInline(c.trim());});
}
/* poora markdown -> safe HTML (block level) */
function mdToHTML(src){
  var lines=String(src==null?'':src).replace(/\r\n?/g,'\n').split('\n');
  var out=[],i=0;
  function para(buf){
    if(!buf.length)return;
    var txt=buf.join('\n');
    buf.length=0;
    if(!txt.trim())return;
    out.push('<p>'+mdInline(txt).replace(/\n/g,'<br>')+'</p>');
  }
  function isList(l){return /^\s*(?:[-*+•]|\d+[.)])\s+/.test(l);}
  function indentOf(l){return l.match(/^\s*/)[0].replace(/\t/g,'  ').length;}
  function parseList(start){
    var items=[],base=indentOf(lines[start]);
    var ordered=/^\s*\d+[.)]\s+/.test(lines[start]);
    while(i<lines.length){
      var l=lines[i];
      if(!l.trim()){
        var nx=lines[i+1];
        if(nx&&(isList(nx)||indentOf(nx)>base)){i++;continue;}
        break;
      }
      if(isList(l)&&indentOf(l)>=base&&indentOf(l)<=base+1){
        items.push({text:l.replace(/^\s*(?:[-*+•]|\d+[.)])\s+/,''),children:''});
        i++;
      }else if(isList(l)&&indentOf(l)>base&&items.length){
        var prevI=i;
        var sub=parseList(i);
        items[items.length-1].children+=sub;
        if(i===prevI)i++;
      }else if(!isList(l)&&indentOf(l)>base&&items.length){
        items[items.length-1].text+='\n'+l.trim();
        i++;
      }else break;
    }
    var tag=ordered?'ol':'ul';
    return '<'+tag+'>'+items.map(function(it){
      return '<li>'+mdInline(it.text).replace(/\n/g,'<br>')+(it.children||'')+'</li>';
    }).join('')+'</'+tag+'>';
  }
  var buf=[];
  while(i<lines.length){
    var line=lines[i];
    if(!line.trim()){para(buf);i++;continue;}
    if(/^\s*(```|~~~)/.test(line)){
      para(buf);
      var fence=line.trim().slice(0,3),code=[];
      i++;
      while(i<lines.length&&lines[i].trim().indexOf(fence)!==0){code.push(lines[i]);i++;}
      i++;
      out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');
      continue;
    }
    var hm=line.match(/^\s{0,3}(#{1,6})\s+(.*)$/);
    if(hm){
      para(buf);
      var lvl=Math.min(6,3+hm[1].length);
      out.push('<h'+lvl+'>'+mdInline(hm[2].replace(/\s+#+\s*$/,''))+'</h'+lvl+'>');
      i++;
      continue;
    }
    if(/^\s{0,3}([-*_])(?:\s*\1){2,}\s*$/.test(line)){para(buf);out.push('<hr>');i++;continue;}
    if(/^\s*>/.test(line)){
      para(buf);
      var q=[];
      while(i<lines.length&&/^\s*>/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,''));i++;}
      out.push('<blockquote>'+mdToHTML(q.join('\n'))+'</blockquote>');
      continue;
    }
    if(line.indexOf('|')>-1&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])&&lines[i+1].indexOf('-')>-1){
      para(buf);
      var head=mdCells(line);
      i+=2;
      var rows=[];
      while(i<lines.length&&lines[i].indexOf('|')>-1&&lines[i].trim()){rows.push(mdCells(lines[i]));i++;}
      out.push('<table><thead><tr>'+head.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr></thead><tbody>'
        +rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('')
        +'</tbody></table>');
      continue;
    }
    if(isList(line)){para(buf);out.push(parseList(i));continue;}
    /* setext heading: text ke neeche === ya --- */
    if(i+1<lines.length&&/^\s*(=+|-{3,})\s*$/.test(lines[i+1])&&line.trim().length<90){
      para(buf);
      var st=/^\s*=+\s*$/.test(lines[i+1])?4:5;
      out.push('<h'+st+'>'+mdInline(line.trim())+'</h'+st+'>');
      i+=2;
      continue;
    }
    buf.push(line);
    i++;
  }
  para(buf);
  return out.join('\n');
}
/* text (markdown ya plain) -> sections [{title,content}] */
function splitMarkdownSections(txt){
  var lines=String(txt).replace(/\r\n?/g,'\n').split('\n');
  var out=[],cur=null,buf=[];
  function flush(){
    var body=buf.join('\n').replace(/^\n+|\n+$/g,'');
    buf=[];
    if(!cur&&!body.trim())return;
    out.push({title:cur||(body.trim()?'':''),content:body});
  }
  lines.forEach(function(l,i){
    var m=l.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
    var nxt=i+1<lines.length?lines[i+1]:'';
    var isUnderline=/^\s*(=+|-{3,})\s*$/.test(l);
    if(isUnderline)return;                       /* setext underline — heading ban chuki hai */
    if(!m&&l.trim()&&/^\s*(=+|-{3,})\s*$/.test(nxt)&&l.trim().length<90){
      m=[null,'',l.trim()];                      /* setext heading */
    }
    if(m){
      flush();
      cur=m[2].trim();
      return;
    }
    buf.push(l);
  });
  flush();
  return out.filter(function(s){return s.title||s.content.trim();});
}
function splitPlainSections(txt){
  var t=String(txt).replace(/\r\n?/g,'\n').trim();
  var numHead=/^\s*(?:\d{1,2}[.)]\s+(?!\d{1,2}[.)]\s)|(?:Q|प्रश्न|Section|Chapter|अध्याय|इकाई|Unit|Part)\s*[-–—:.]?\s*\d{0,3}\s*[.:)]?\s+)(.{2,80})$/i;
  var lines=t.split('\n');
  var idx=[];
  lines.forEach(function(l,i){
    var m=l.match(numHead);
    if(m&&m[1]&&l.trim().length<90)idx.push({i:i,title:m[1].replace(/[:.\-–—]+$/,'').trim()});
  });
  if(!idx.length){
    /* koi heading nahi — khaali line par todo (max 12 sections) */
    var blocks=t.split(/\n\s*\n/).map(function(b){return b.trim();}).filter(Boolean);
    if(blocks.length>1&&blocks.length<=12){
      return blocks.map(function(b,i){
        var fl=b.split('\n')[0].replace(/^\s*(?:\d{1,2}[.)]|[-*+•])\s+/,'').trim();
        var title=fl.length<=60?fl:(fl.slice(0,52).replace(/\s+\S*$/,'')+'…');
        return {title:'नोट '+(i+1)+(title?' — '+title:''),content:b};
      });
    }
    return [{title:'',content:t}];
  }
  var out=[];
  var head=lines.slice(0,idx[0].i).join('\n').trim();
  if(head)out.push({title:'परिचय',content:head});
  idx.forEach(function(h,k){
    var end=k+1<idx.length?idx[k+1].i:lines.length;
    out.push({title:h.title,content:lines.slice(h.i+1,end).join('\n').trim()});
  });
  return out.filter(function(s){return s.title||s.content.trim();});
}
function isMarkdownish(t){
  return /^\s{0,3}#{1,6}\s+\S/m.test(t)||/^\s*[-*+•]\s+\S/m.test(t)||/^\s*>\s?/m.test(t)
    ||/\*\*[^*\n]+\*\*/.test(t)||/```/.test(t)||/^\s*\|.+\|\s*$/m.test(t)||/^\s*\d+[.)]\s+\S/m.test(t);
}
function parseTheoryText(txt){
  var t=String(txt==null?'':txt).replace(/\r\n?/g,'\n').trim();
  if(!t)return [];
  var raw=[];
  if(/^\s{0,3}#{1,6}\s+\S/m.test(t)||/^\s*>\s?\S/m.test(t)||/^\s*(=+|-{3,})\s*$/m.test(t)){
    raw=splitMarkdownSections(t);
  }
  if(raw.length<2)raw=splitPlainSections(t);      /* numbered/plain headings ya khaali-line blocks */
  if(raw.length<2)raw=splitMarkdownSections(t);   /* sirf lists/bold wala markdown */
  return raw.map(function(s){
    return {id:uid(),title:String(s.title||'').trim().slice(0,120),content:String(s.content||'').trim()};
  }).filter(function(s){return s.content||s.title;});
}
/* JSON ke theory field ko sections me badlo — string / array / object sab chalega */
function cleanTheory(th){
  var out=[];
  function push(title,content){
    content=String(content==null?'':content).replace(/\r\n?/g,'\n').trim();
    title=String(title==null?'':title).trim().slice(0,120);
    if(!content&&!title)return;
    out.push({id:uid(),title:title,content:content});
  }
  if(th==null)return out;
  if(typeof th==='string'){return parseTheoryText(th);}
  if(Array.isArray(th)){
    th.forEach(function(it){
      if(it==null)return;
      if(typeof it==='string'){parseTheoryText(it).forEach(function(s){push(s.title,s.content);});return;}
      if(typeof it!=='object')return;
      var title=it.title||it.name||it.heading||it.section||it.h||'';
      var body=it.content||it.text||it.body||it.notes||it.theory||it.md||it.markdown||it.value||'';
      if(Array.isArray(body))body=body.map(function(b){return typeof b==='string'?b:(b&&(b.text||b.content)||'');}).join('\n\n');
      if(body){parseTheoryText(String(body)).forEach(function(s,i){push(i===0&&title?title:(title&&s.title?title+' — '+s.title:(title||s.title)),s.content);});}
      else if(title)push(title,'');
    });
    return out;
  }
  if(typeof th==='object'){
    var k=th.title||th.name||th.heading||'';
    var c=th.content||th.text||th.body||th.notes||th.md||th.markdown||'';
    if(Array.isArray(th.sections)){cleanTheory(th.sections).forEach(function(s){push(s.title,s.content);});return out;}
    if(c){parseTheoryText(String(c)).forEach(function(s,i){push(i===0&&k?k:s.title||k,s.content);});return out;}
    Object.keys(th).forEach(function(key){
      var v=th[key];
      if(typeof v==='string')push(key,v);
      else if(Array.isArray(v)||v&&typeof v==='object')cleanTheory(v).forEach(function(s){push(key+(s.title?' — '+s.title:''),s.content);});
    });
  }
  return out;
}
/* ek poora JSON blob (file/paste) -> theory sections */
function theoryFromJSON(data){
  if(data==null)return [];
  if(typeof data==='string')return parseTheoryText(data);
  if(Array.isArray(data)){
    var flat=[];
    data.forEach(function(it){
      if(typeof it==='string'){parseTheoryText(it).forEach(function(s){flat.push(s);});return;}
      if(it&&typeof it==='object'){
        if(it.title||it.name||it.heading||it.content||it.text||it.body||it.notes||it.md||it.markdown){
          cleanTheory(it).forEach(function(s){flat.push(s);});return;
        }
        if(it.theory){cleanTheory(it.theory).forEach(function(s){flat.push(s);});return;}
      }
    });
    if(flat.length)return flat;
    return [];
  }
  if(typeof data!=='object')return [];
  if(data.content||data.text||data.body||data.md||data.markdown)return cleanTheory(data);
  if(Array.isArray(data.sections))return cleanTheory(data.sections);
  var direct=data.theory!=null?data.theory:(data.theories!=null?data.theories:(data.notes!=null?data.notes:null));
  if(direct!=null){var r=cleanTheory(direct);if(r.length)return r;}
  var all=[];
  function walk(o){
    if(!o||typeof o!=='object')return;
    if(Array.isArray(o)){o.forEach(walk);return;}
    ['theory','theories','notes'].forEach(function(k){
      if(o[k]!=null)cleanTheory(o[k]).forEach(function(s){all.push(s);});
    });
    ['topics','subs','subtopics','sections','subjects','chapters','children'].forEach(function(k){
      if(o[k])walk(o[k]);
    });
  }
  walk(data);
  return all;
}

/* Question files are data, never executable code. Normalize a few common JSON schemas. */
var QUESTION_FIELDS=['question','questiontext','questionstatement','stem','prompt','q','प्रश्न','सवाल','questionhi','questionen'];
var CHOICE_FIELDS=['options','choices','opts','answers','alternatives','answerchoices','optionlist','विकल्प'];
var ROW_FIELDS=['questions','questionlist','questionbank','mcqs','mcq','items','records','data','results','result','payload','प्रश्न'];
var TOPIC_FIELDS=['topics','sections'];
var SUB_FIELDS=['subs','subtopics','chapters'];
var TYPE_FIELDS=['types','questiontypes'];
function isImportRecord(value){return !!value&&typeof value==='object'&&!Array.isArray(value);}
function importFields(record){
  var fields=Object.create(null);
  if(isImportRecord(record))Object.keys(record).forEach(function(key){
    fields[key.trim().toLowerCase().replace(/[^a-z0-9\u0900-\u097f]/g,'')]=record[key];
  });
  return fields;
}
function importProp(fields,names){
  for(var i=0;i<names.length;i++){
    var v=fields[names[i]];
    if(v!=null&&!(typeof v==='string'&&!v.trim())&&!(Array.isArray(v)&&!v.length))return v;
  }
}
function importText(value){return typeof value==='string'||typeof value==='number'?String(value).trim():'';}
function importName(fields,names,fallback){return importText(importProp(fields,names))||fallback||'';}
function importList(fields,names){var v=importProp(fields,names);return Array.isArray(v)?v:[];}
function importStem(fields){return importName(fields,QUESTION_FIELDS)||importName(fields,['text','title']);}
function hasQuestionFields(fields){
  return !!importName(fields,QUESTION_FIELDS)||importProp(fields,CHOICE_FIELDS)!==undefined||
    (!!importStem(fields)&&importProp(fields,['a','optiona','option1'])!==undefined);
}
function parseQuestionPayload(text){
  var input=String(text||'').replace(/^\uFEFF/,'').trim();
  // Accept a single JSON code block copied from chat, as well as ordinary JSON.
  if(!/^[\[{]/.test(input)){
    var fence=/(?:^|\n)```(?:json)?[ \t]*\r?\n([\s\S]*?)\r?\n```[ \t]*(?=\r?\n|$)/gi;
    var block=fence.exec(input);
    if(block&&!fence.exec(input))input=block[1].trim();
  }
  return JSON.parse(input);
}
function unwrapQuestionPayload(data){
  var node=data, payload=data;
  for(var i=0;i<5&&isImportRecord(node);i++){
    var f=importFields(node);
    if(importList(f,['subjects']).length||importList(f,TOPIC_FIELDS).length||hasQuestionFields(f))break;
    var n=importProp(f,['data','payload','result','results']);
    if(!isImportRecord(n))break;
    var nested=importFields(n);
    if(importList(nested,['subjects']).length||importList(nested,TOPIC_FIELDS).length||
      importName(nested,['subject','subjectname','topic','topicname','chapter','chaptername','section','sectionname'])||
      importProp(nested,['data','payload','result','results'])!==undefined){
      // Null prototype: a key from the input cannot change the merged object's prototype.
      payload=Object.assign(Object.create(null),payload,n);
      node=n;
    }else break;
  }
  return payload;
}
function optionLabel(index){return index<26?String.fromCharCode(65+index):String(index+1);}
function importChoices(fields){
  var raw=importProp(fields,CHOICE_FIELDS), list=[];
  function add(rawValue,sourceIndex,label,sourceId){
    var option=isImportRecord(rawValue)?importFields(rawValue):null;
    var value=option?importName(option,['text','option','optiontext','choice','value','answer','content','name','label']):importText(rawValue);
    if(!value)return;
    var flag=option&&importProp(option,['correct','iscorrect','right','isanswer']);
    var id=(option?importName(option,['key','id','letter','label']):'')||sourceId||'';
    list.push({text:value,source:sourceIndex,label:label,id:id,correct:flag===true||flag===1||/^true$/i.test(importText(flag))});
  }
  if(Array.isArray(raw)){
    raw.forEach(function(value,i){add(value,i,optionLabel(i));});
  }else{
    var optionFields=isImportRecord(raw)?importFields(raw):fields;
    var zeroBased=Object.prototype.hasOwnProperty.call(optionFields,'0')||Object.prototype.hasOwnProperty.call(optionFields,'option0');
    for(var i=0;i<26;i++){
      var letter=optionLabel(i), pos=String(i+(zeroBased?0:1));
      add(importProp(optionFields,['option'+letter.toLowerCase(),letter.toLowerCase(),'option'+pos,pos]),i,letter);
    }
    if(!list.length&&isImportRecord(raw)){
      var keys=Object.keys(raw);
      // Some exports use named IDs for choices, not A/B or 1/2 keys.
      if(keys.length>=2&&keys.every(function(key){var v=raw[key];return importText(v)||isImportRecord(v);})){
        keys.forEach(function(key,i){add(raw[key],i,optionLabel(i),key);});
      }
    }
  }

}
function importCorrectIndex(fields,options){
  var explicit=importProp(fields,['correctindex','answerindex','correctoptionindex','correctanswerindex']);
  var canonical=importProp(fields,['correct']);
  var val=explicit!==undefined?explicit:canonical!==undefined?canonical:importProp(fields,['answer','correctanswer','correctoption','right','answerkey','correctchoice','सहीउत्तर','उत्तर']);
  var usesIndex=explicit!==undefined||typeof canonical==='number';
  if(Array.isArray(val)){if(val.length!==1)return -1;val=val[0];}
  if(isImportRecord(val)){
    var f=importFields(val), i=importProp(f,['index','optionindex']);
    usesIndex=i!==undefined;
    val=usesIndex?i:importProp(f,['text','value','answer','option','label','letter','key','id']);
    if(val===undefined)return -1;
  }
  if(val===undefined){
    var marked=options.reduce(function(out,o,i){if(o.correct)out.push(i);return out;},[]);
    return marked.length===1?marked[0]:marked.length>1?-1:null;
  }
  var asText=importText(val);
  if(!asText)return -1;
  function bySource(i){return options.findIndex(function(o){return o.source===i;});}
  if(usesIndex)return /^\d+$/.test(asText)?bySource(Number(asText)):-1;
  var byText=options.findIndex(function(o){return normQText(o.text)===normQText(asText);});
  var byId=options.findIndex(function(o){return o.id&&normQText(o.id)===normQText(asText);});
  if(byId>=0)return byId;
  var letter=asText.match(/^(?:option\s*[:\-]?\s*)?[\[(]?([a-z])(?:[\])]|[.:\-](?:\s+.*)?)?$/i);

    if(hit>=0)return hit;
  }
  if(byText>=0)return byText;
  if(/^\d+$/.test(asText)){
    var num=Number(asText);
    return bySource(typeof val==='number'||num===0?num:num-1);
  }
  return -1;
}
function cleanQuestions(source,onInvalid,onDefault){
  var out=[];
  function visit(raw,depth,expectRow){
    if(depth>9){onInvalid('', 'JSON में सवालों की nesting बहुत गहरी है।');return;}
    if(Array.isArray(raw)){raw.forEach(function(row){visit(row,depth+1,true);});return;}
    if(!isImportRecord(raw)){if(expectRow)onInvalid('', 'एक question JSON object होना चाहिए।');return;}
    var f=importFields(raw);
    if(!hasQuestionFields(f)){
      var collection=importProp(f,ROW_FIELDS);
      if(typeof collection==='object'&&collection!==null){visit(collection,depth+1,true);return;}
      if(expectRow){
        var keys=Object.keys(raw);
        if(keys.length&&keys.every(function(key){return isImportRecord(raw[key]);})){
          keys.forEach(function(key){visit(raw[key],depth+1,true);});
        }else onInvalid('', 'Question text या options नहीं मिले।');
      }
      return;
    }
    var text=importStem(f), options=importChoices(f);
    if(!text||options.length<2){onInvalid(text, !text?'Question text खाली है।':'कम से कम 2 options चाहिए।');return;}
    var correct=importCorrectIndex(f,options);
    if(correct===-1){onInvalid(text, 'सही answer options से match नहीं हुआ (एक सही उत्तर दें)।');return;}
    if(correct===null){correct=0;onDefault();}
    var created=Number(f.createdat);
    out.push({id:uid(),question:text,options:options.map(function(o){return o.text;}),correct:correct,
      explanation:importName(f,['explanation','explain','reason','solution','व्याख्या']),hint:importName(f,['hint']),
      examName:importName(f,['examname','exam']),examDate:importName(f,['examdate','date']),examShift:importName(f,['examshift','shift']),
      createdAt:Number.isFinite(created)&&created>0?created:Date.now()});
    var mediaRef=mediaReference(f.mediaref);
    if(mediaRef)out[out.length-1]._incomingMediaRef=mediaRef;
  }
  visit(source,0,false);
  return out;
}
function isStandaloneTheoryRow(row){
  if(typeof row==='string')return true;
  if(!isImportRecord(row))return false;
  var f=importFields(row);
  return !hasQuestionFields(f)&&!importProp(f,ROW_FIELDS)&&!!importProp(f,['content','body','notes','theory','markdown','md','text']);
}

function findOrCreateSubject(name){
  if(!name)return null;
  name=String(name).trim();if(!name)return null;
  var n=name.toLowerCase();
  for(var i=0;i<DB.subjects.length;i++)if(DB.subjects[i].name.toLowerCase()===n)return DB.subjects[i];
  var official=Object.prototype.hasOwnProperty.call(SUBJ_RENAME,name)?SUBJ_RENAME[name]:null;
  if(!official){
    if(/^(math|maths|mathematics)$/i.test(name))official='Maths';
    else if(/^gk\s*[-/]?\s*gs$/i.test(name))official='GK-GS';
  }
  if(official){
    for(var i=0;i<DB.subjects.length;i++)if(DB.subjects[i].name.toLowerCase()===official.toLowerCase())return DB.subjects[i];
    name=official;

  var p=PALETTE[DB.subjects.length%PALETTE.length];

}

/* theory ko topic/subtopic me jodo (mode: 'append' | 'replace') */
function applyTheory(box,secs,mode){
  if(!box||!secs||!secs.length)return 0;
  if(mode==='replace'){box.theory=secs.slice();return secs.length;}
  /* append — par bilkul same (title+content) section dobara na jude (backup re-import safe) */
  var have=theoryOf(box);
  var keys={};
  have.forEach(function(x){keys[String(x.title||'').trim().toLowerCase()+'\u0001'+String(x.content||'').trim().toLowerCase()]=1;});
  var fresh=secs.filter(function(x){
    return !keys[String(x.title||'').trim().toLowerCase()+'\u0001'+String(x.content||'').trim().toLowerCase()];
  });
  box.theory=have.concat(fresh);
  return fresh.length;
}
function normQText(str){
  var text=String(str||'');
  if(text.normalize)text=text.normalize('NFC');
  return text
    .replace(/[\u200B-\u200D\uFEFF]/g,'')
    .replace(/\u00A0/g,' ')
    .replace(/[‘’`´]/g,"'")
    .replace(/[“”]/g,'"')
    .replace(/[–—]/g,'-')
    .replace(/\s+/g,' ')
    .trim()
    .toLocaleLowerCase();
}
function normQStem(str){
  var t=normQText(str);
  /* Strip optional leading question numbering like "Q.1.", "Q12)", "Question 5:", "प्रश्न 3.", "12)", "(12)", "12. " */
  var stripped=t.replace(/^(?:(?:q(?:ues(?:tion)?)?\.?|प्र\.?|प्रश्न)\s*\d+\s*[\.\)\:\-]\s*|\(\d+\)\s*|\d+\s*[\)\:\-]\s+|\d+\.\s+)/i,'').trim();
  if(stripped)t=stripped;
  return t.replace(/\s+([?!.,;:|।])/g,'$1').replace(/[?!.,;:|।]+$/g,'').trim();
}
function questionDedupKey(q){
  if(!q||typeof q!=='object')return '';
  var stem=normQStem(q.question)||normQText(q.question);
  if(!stem)return '';
  var options=(Array.isArray(q.options)?q.options:[]).map(normQText).filter(Boolean).sort();
  return JSON.stringify([stem,options]);
}
function importChanged(r){return !!(r.added||r.topics||r.theory||r.vocab||r.tricks||r.study||(r.mediaRestore&&r.mediaRestore.added));}
function importToast(r){
  var counts=[r.added+' questions जुड़े'];
  if(r.duplicates)counts.push(r.duplicates+' duplicates छोड़े');
  if(r.invalid)counts.push(r.invalid+' invalid छोड़े');
  if(r.theory)counts.push(r.theory+' theory sections');
  if(r.vocab)counts.push(r.vocab+' vocab words');
  if(r.tricks)counts.push(r.tricks+' trick sections');
  if(r.study)counts.push(r.study+' study records');
  if(r.topics)counts.push(r.topics+' नए topics/sections');
  if(r.mediaRestore&&r.mediaRestore.added)counts.push(r.mediaRestore.added+' attachments restore हुए');
  return counts.join(' · ');
}

function importData(rawData,sid,tid,subId,subjectWide){
  var data=unwrapQuestionPayload(rawData);
  var mediaPack=isImportRecord(data)&&Object.hasOwn(data,'questionMedia')?data.questionMedia:undefined;
  var mediaTargets=new Map(), mediaRefs=new Set(), mediaMatched=new WeakMap();
  if(mediaPack&&mediaPack.version===1&&Array.isArray(mediaPack.entries))mediaPack.entries.forEach(function(entry){
    var ref=entry&&mediaReference(entry.ref);if(ref)mediaRefs.add(ref);
  });
  function linkMedia(ref,q){
    if(!q||!q.id)return;
    if(!mediaTargets.has(ref))mediaTargets.set(ref,new Set());
    mediaTargets.get(ref).add(String(q.id));mediaMatched.set(q,ref);
  }
  function remapMediaSnapshot(row){
    var matches=mediaTargets.get(String(row.id||''));
    return matches&&matches.size===1?Object.assign({},row,{id:matches.values().next().value}):row;
  }
  var added=0,newTopics=0,tAdded=0,duplicates=0,vAdded=0,trAdded=0,studyAdded=0,invalid=0,defaultAnswers=0;
  var destinations=new Map(), details=[], targetError='';
  function res(){return {added:added,topics:newTopics,theory:tAdded,duplicates:duplicates,vocab:vAdded,tricks:trAdded,study:studyAdded,
    invalid:invalid,defaultAnswers:defaultAnswers,details:details,targets:Array.from(destinations.values()),error:targetError,mediaPack:mediaPack,mediaTargets:mediaTargets};}
  function readQuestions(data){
    return cleanQuestions(data,function(text,reason){
      invalid++;
      if(details.length<3)details.push((text?'“'+text.slice(0,110)+'” — ':'')+reason);
    },function(){defaultAnswers++;});
  }
  var seenByBox=new WeakMap();
  function rememberQuestion(index,key,q){
    if(!key)return;
    if(!index.has(key))index.set(key,[q]);
    else if(mediaRefs.size)index.get(key).push(q);
  }
  function seenSet(subject,box,acrossSubject){
    var scope=acrossSubject?subject:box;
    if(seenByBox.has(scope))return seenByBox.get(scope);
    var keys=new Map();
    function add(q){rememberQuestion(keys,questionDedupKey(q),q);}
    if(acrossSubject)subject.topics.forEach(function(t){topicAllQ(t).forEach(add);});
    else (box.questions||[]).forEach(add);
    seenByBox.set(scope,keys);
    return keys;
  }
  function existingMediaDestination(ref,q,choices){
    if(!choices||!choices.length)return null;
    function available(item){var used=mediaMatched.get(item);return !used||used===ref;}
    return choices.find(function(item){return String(item.id)===ref&&available(item);})
      ||choices.find(function(item){return item.createdAt===q.createdAt&&available(item);})
      ||choices.find(available)||null;
  }
  function addTo(subject,topic,box,qs){
    if(!subject||!topic||!box||!qs.length)return;
    if(!Array.isArray(box.questions))box.questions=[];
    var seen=seenSet(subject,box,subjectWide), sub=box===topic?'':box.id;
    var canLink=mediaRefs.size&&eligibleMediaSubject(subject);
    var destKey=questionListKey(subject.id,topic.id,sub), dest=destinations.get(destKey);
    qs.forEach(function(q){
      var ref=q._incomingMediaRef;delete q._incomingMediaRef;
      var attach=canLink&&mediaRefs.has(ref), key=questionDedupKey(q);
      if(key&&seen.has(key)){
        if(!attach){duplicates++;return;}
        var local=subjectWide?seenSet(subject,box,false):seen;
        var match=existingMediaDestination(ref,q,local.get(key));
        if(match){duplicates++;linkMedia(ref,match);return;}
        if(subjectWide){duplicates++;return;} // Don't attach to an unrelated copy in another chapter.
        // Each media-bearing source row is distinct, even if its text and options are identical.
      }
      if(!dest){
        var parent=sub?parentChapter(topic,sub):null;
        var path=[subject.name,topic.name];if(parent)path.push(parent.name);if(sub)path.push(box.name);
        dest={sid:subject.id,tid:topic.id,subId:sub,firstIndex:box.questions.length,firstQuestionId:q.id,added:0,path:path.join(' → ')};
        destinations.set(destKey,dest);
      }
      rememberQuestion(seen,key,q);
      if(subjectWide&&seenByBox.has(box))rememberQuestion(seenByBox.get(box),key,q);
      box.questions.push(q);added++;dest.added++;
      if(attach)linkMedia(ref,q);
    });
  }
  function addTheory(box,sections){
    if(!sections.length)return;
    tAdded+=applyTheory(box,sections,'append');
  }
  function importTypes(topic,chapter,typeList,subject){
    typeList.forEach(function(raw){
      if(!isImportRecord(raw))return;
      var f=importFields(raw), name=importName(f,['name','type','questiontype','title'],'Question Type');
      var qs=readQuestions(raw), th=cleanTheory(importProp(f,['theory','notes']));
      if(!Array.isArray(chapter.types))chapter.types=[];
      var type=chapter.types.find(function(x){return String(x.name).trim().toLowerCase()===name.toLowerCase();});
      if(!type){type={id:uid(),name:name,questions:[],theory:[]};chapter.types.push(type);newTopics++;}
      addTo(subject,topic,type,qs);addTheory(type,th);
    });
  }
  function importSubs(topic,subsArr,subject){
    subsArr.forEach(function(raw){
      if(!isImportRecord(raw))return;
      var f=importFields(raw), qs=readQuestions(raw), th=cleanTheory(importProp(f,['theory','notes']));
      var name=importName(f,['sub','name','subtopic','chapter','title']);
      var types=importList(f,TYPE_FIELDS);
      if(!qs.length&&!th.length&&!name&&!types.length)return;
      var before=subsOf(topic).length;
      var sub=findOrCreateSub(topic,name||'Subtopic');
      if(subsOf(topic).length>before)newTopics++;
      addTo(subject,topic,sub,qs);addTheory(sub,th);
      importTypes(topic,sub,types,subject);
    });
  }
  function restoreVocabOnSubject(subj,sd){
    if(!subj||!sd)return;
    if(!Array.isArray(subj.vocabWords))subj.vocabWords=[];
    if(!Array.isArray(subj.vocabGroups))subj.vocabGroups=[];
    var seen={};
    allVocabEntries(subj).forEach(function(w){seen[String(w.word||'').trim().toLowerCase()]=true;});
    if(Array.isArray(sd.vocabWords)){
      vocabRowsFromJSON(sd.vocabWords).forEach(function(item){
        var k=item.word.toLowerCase();if(!k||seen[k])return;seen[k]=true;
        subj.vocabWords.push({id:uid(),word:item.word,meaning:item.meaning});vAdded++;
      });
    }
    if(Array.isArray(sd.vocabGroups)){
      sd.vocabGroups.forEach(function(g){
        if(!g||typeof g!=='object')return;
        var rows=vocabRowsFromJSON(g.words||[]);
        if(!rows.length)return;
        var fresh=[];
        rows.forEach(function(item){
          var k=item.word.toLowerCase();if(!k||seen[k])return;seen[k]=true;
          fresh.push({id:uid(),word:item.word,meaning:item.meaning});vAdded++;
        });
        if(!fresh.length)return;
        var gName=String(g.name||'Imported Words').trim()||'Imported Words';
        var existing=subj.vocabGroups.find(function(x){return String(x.name||'').toLowerCase()===gName.toLowerCase();});
        if(existing){existing.words=(existing.words||[]).concat(fresh);}
        else{subj.vocabGroups.push({id:uid(),name:gName,kind:g.kind||'import',words:fresh});}
      });
    }
  }
  function restoreTricks(tricksObj){
    if(!tricksObj||typeof tricksObj!=='object')return;
    if(!DB.tricks)DB.tricks={};
    Object.keys(tricksObj).forEach(function(k){
      var bucket=tricksObj[k];
      var items=Array.isArray(bucket)?bucket:(bucket&&Array.isArray(bucket.items)?bucket.items:[]);
      if(!items.length)return;
      if(!DB.tricks[k])DB.tricks[k]={items:[]};
      var seen={};
      DB.tricks[k].items.forEach(function(it){seen[trickSectionFingerprint(it)]=1;});
      items.forEach(function(it){
        if(!it||typeof it!=='object')return;
        var cleanItem=null;
        if(Array.isArray(it.entries)&&it.entries.length){
          var ens=it.entries.filter(function(e){return e&&typeof e==='object'&&String(e.body||e.content||'').trim();})
            .map(function(e){return {title:String(e.title||'Trick').trim(),body:String(e.body||e.content||'').trim()};});
          if(!ens.length&&!String(it.overview||'').trim())return;
          cleanItem={id:it.id||uid(),title:String(it.title||'Tricks Section').trim(),entries:ens};
          if(it.subtitle)cleanItem.subtitle=String(it.subtitle).trim();
          if(it.overview)cleanItem.overview=String(it.overview).trim();
        }else{
          var title=String(it.title||'Trick').trim(),body=String(it.body||it.content||it.note||'').trim();
          if(!body)return;
          cleanItem={id:it.id||uid(),title:title,body:body};
        }
        var fp=trickSectionFingerprint(cleanItem);
        if(seen[fp])return;seen[fp]=1;
        DB.tricks[k].items.push(cleanItem);trAdded++;
      });
    });
  }
  function findVisibleChapterByName(subject,name){
    var n=name.trim().toLowerCase(), visible=orderedSubjectSections(subject).sections;
    if(!n||visible.some(function(t){return String(t.name||'').trim().toLowerCase()===n||t.sectionKey===n;}))return null;
    var match=null;
    for(var i=0;i<visible.length;i++){
      var subs=subsOf(visible[i]);
      for(var j=0;j<subs.length;j++){
        if(String(subs[j].name||'').trim().toLowerCase()!==n)continue;
        if(match)return null; // Don't pick an arbitrary chapter when several have this name.
        match={topic:visible[i],box:subs[j]};
      }
    }
    return match;
  }
  function ensureTopic(subject,name,qs,subs,sections){
    if(!subject||(!qs.length&&!sections.length&&!subs.length))return;
    /* A flat named topic may correspond to a built-in chapter (e.g. Maths → Arithmetic → प्रतिशत). */
    var ch=subs.length?null:findVisibleChapterByName(subject,name);
    if(ch){addTo(subject,ch.topic,ch.box,qs);addTheory(ch.box,sections);return;}
    var before=subject.topics.length;
    var topic=findOrCreateTopic(subject,name||'Imported');
    if(subject.topics.length>before)newTopics++;
    addTo(subject,topic,topic,qs);addTheory(topic,sections);importSubs(topic,subs,subject);
  }
  function importTopicNode(subject,raw){
    if(!isImportRecord(raw))return;
    var f=importFields(raw);
    ensureTopic(subject,importName(f,['topic','topicname','name','section','chapter','title'],'Imported'),readQuestions(raw),
      importList(f,SUB_FIELDS),cleanTheory(importProp(f,['theory','notes'])));
  }
  var selectedSubject=sid?getSubject(sid):null;
  var selectedTopic=tid?getTopic(sid,tid):null;
  var selectedBox=subId&&selectedTopic?getSub(selectedTopic,subId):selectedTopic;
  if(tid&&(!selectedSubject||!selectedTopic||!selectedBox)){
    targetError='Import का topic या chapter नहीं मिला। उसे दोबारा खोलकर Import करें।';return res();
  }
  if(Array.isArray(data)){
    var notes=[], rows=[];
    data.forEach(function(row){(isStandaloneTheoryRow(row)?notes:rows).push(row);});
    var qs=readQuestions(rows), sections=notes.length?theoryFromJSON(notes):[];
    if(selectedBox){addTo(selectedSubject,selectedTopic,selectedBox,qs);addTheory(selectedBox,sections);}
    else ensureTopic(selectedSubject||DB.subjects[0],'Imported',qs,[],sections);
    return res();
  }
  if(!isImportRecord(data))return res();
  var meta=importFields(data), subjects=importList(meta,['subjects']);
  if(subjects.length){
    subjects.forEach(function(sd){
      if(!isImportRecord(sd))return;
      var f=importFields(sd), name=importName(f,['subject','subjectname','name'],'Imported');
      var subj=findOrCreateSubject(name);if(!subj)return;
      var topics=importList(f,TOPIC_FIELDS);
      if(topics.length)topics.forEach(function(raw){importTopicNode(subj,raw);});
      else ensureTopic(subj,'Imported',readQuestions(sd),importList(f,SUB_FIELDS),cleanTheory(importProp(f,['theory','notes'])));
      restoreVocabOnSubject(subj,sd);
      if(Array.isArray(sd.sectionOrderNames)&&sd.sectionOrderNames.length){
        var orderIds=[];
        sd.sectionOrderNames.forEach(function(nm){
          var match=subj.topics.find(function(t){return String(t.name||'').trim().toLowerCase()===String(nm||'').trim().toLowerCase();});
          if(match&&orderIds.indexOf(match.id)<0)orderIds.push(match.id);
        });
        if(orderIds.length)subj.sectionOrder=orderIds;
      }
    });
    if(data.tricks)restoreTricks(data.tricks);
    ensureStudyData();
    if(Array.isArray(data.mistakes)){
      var mSeen={};
      DB.mistakes.forEach(function(m){mSeen[m.key]=1;});
      data.mistakes.forEach(function(m){
        if(!m||!m.question||!Array.isArray(m.options))return;
        var k=m.key||studyQKey(m);
        if(!k||mSeen[k])return;mSeen[k]=1;
        DB.mistakes.push(Object.assign({},remapMediaSnapshot(m),{key:k}));studyAdded++;
      });
    }
    if(data.bookmarks&&typeof data.bookmarks==='object'){
      if(Array.isArray(data.bookmarks.questions)){
        var bqSeen={};
        DB.bookmarks.questions.forEach(function(b){bqSeen[b.key]=1;});
        data.bookmarks.questions.forEach(function(b){
          if(!b||!b.question||!Array.isArray(b.options))return;
          var k=b.key||studyQKey(b);
          if(!k||bqSeen[k])return;bqSeen[k]=1;
          DB.bookmarks.questions.push(Object.assign({},remapMediaSnapshot(b),{key:k}));studyAdded++;
        });
      }
      if(Array.isArray(data.bookmarks.vocab)){
        var bvSeen={};
        DB.bookmarks.vocab.forEach(function(b){bvSeen[vocabBookmarkKey(b)]=1;});
        data.bookmarks.vocab.forEach(function(b){
          if(!b||!b.word)return;
          var k=vocabBookmarkKey(b);
          if(!k||bvSeen[k])return;bvSeen[k]=1;
          DB.bookmarks.vocab.push({id:b.id||uid(),word:String(b.word).trim(),meaning:String(b.meaning||'').trim(),subjectId:b.subjectId||'',savedAt:b.savedAt||Date.now()});studyAdded++;
        });
      }
    }
    if(data.progress&&typeof data.progress==='object'){
      if(data.progress.daily&&typeof data.progress.daily==='object'){
        Object.keys(data.progress.daily).forEach(function(dk){
          if(!DB.progress.daily[dk]){DB.progress.daily[dk]=data.progress.daily[dk];studyAdded++;}
        });
      }
      if(Array.isArray(data.progress.history)){
        var hSeen={};
        DB.progress.history.forEach(function(h){hSeen[h.id]=1;});
        data.progress.history.forEach(function(h){if(h&&h.id&&!hSeen[h.id]){hSeen[h.id]=1;DB.progress.history.push(h);studyAdded++;}});
        DB.progress.history.sort(function(a,b){return (b.at||0)-(a.at||0);});
        if(DB.progress.history.length>60)DB.progress.history.length=60;
      }
      if(data.progress.topics&&typeof data.progress.topics==='object'){
        Object.keys(data.progress.topics).forEach(function(tk){
          if(!DB.progress.topics[tk])DB.progress.topics[tk]=data.progress.topics[tk];
        });
      }
    }
    return res();
  }
  var topics=importList(meta,TOPIC_FIELDS);
  var subjectName=importName(meta,['subject','subjectname']);
  if(topics.length){
    subjectName=subjectName||importName(meta,['name','title']);
    var packSubject=(subjectName?findOrCreateSubject(subjectName):selectedSubject||DB.subjects[0]);
    if(packSubject){
      topics.forEach(function(topic){importTopicNode(packSubject,topic);});
      restoreVocabOnSubject(packSubject,data);
    }
    if(meta.tricks)restoreTricks(meta.tricks);
    return res();
  }
  var questions=readQuestions(data);
  var theory=cleanTheory(importProp(meta,['theory','notes']));
  var children=importList(meta,SUB_FIELDS), types=importList(meta,TYPE_FIELDS);
  if(selectedBox){
    // Import launched inside a chapter/type: that explicit destination wins over a flat file's labels.
    addTo(selectedSubject,selectedTopic,selectedBox,questions);addTheory(selectedBox,theory);
    if(selectedBox===selectedTopic)importSubs(selectedTopic,children,selectedSubject);
    else if(!parentChapter(selectedTopic,selectedBox.id))importTypes(selectedTopic,selectedBox,types.length?types:children,selectedSubject);
    else if(children.length||types.length)targetError='इस Question Type में nested sections नहीं जुड़ सकते। उनके लिए chapter का Import खोलें।';
  }else if(questions.length||theory.length||children.length){
    var destSubject=subjectName?findOrCreateSubject(subjectName):selectedSubject||DB.subjects[0];
    var topicName=importName(meta,['topic','topicname','chapter','chaptername','section','sectionname']);
    if(!topicName&&!hasQuestionFields(meta))topicName=importName(meta,['name','title']);
    ensureTopic(destSubject,topicName||'Imported',questions,children,theory);
  }
  if(meta.tricks)restoreTricks(meta.tricks);
  return res();
}

/* export */
function plainQ(q,refs){
  var o={question:q.question,options:q.options,correct:q.correct,explanation:q.explanation,hint:q.hint||'',examName:q.examName||'',examDate:q.examDate||'',examShift:q.examShift||''};
  if(q.createdAt)o.createdAt=q.createdAt;
  if(refs&&refs.has(String(q.id)))o.mediaRef=String(q.id);
  return o;
}
function plainTopic(t,refs){
  var o={name:t.name};
  if(tCount(t))o.theory=theoryOf(t).map(function(x){return {title:x.title||'',content:x.content||''};});
  o.questions=(t.questions||[]).map(function(q){return plainQ(q,refs);});
  if(subsOf(t).length)o.subs=subsOf(t).map(function(sb){
    var so={name:sb.name};
    if(tCount(sb))so.theory=theoryOf(sb).map(function(x){return {title:x.title||'',content:x.content||''};});
    so.questions=(sb.questions||[]).map(function(q){return plainQ(q,refs);});
    if((sb.types||[]).length)so.types=sb.types.map(function(type){return {name:type.name,questions:(type.questions||[]).map(function(q){return plainQ(q,refs);}),theory:theoryOf(type).map(function(x){return {title:x.title||'',content:x.content||''};})};});
    return so;
  });
  return o;
}
function plainSubject(s,refs){
  var o={name:s.name,topics:s.topics.map(function(t){return plainTopic(t,refs);})};
  if(Array.isArray(s.vocabWords)&&s.vocabWords.length){
    o.vocabWords=s.vocabWords.map(function(w){return {word:w.word,meaning:w.meaning};});
  }
  var groups=vocabGroupsOf(s).filter(function(g){return Array.isArray(g.words)&&g.words.length;});
  if(groups.length){
    o.vocabGroups=groups.map(function(g){return {name:g.name,kind:g.kind||'import',words:g.words.map(function(w){return {word:w.word,meaning:w.meaning};})};});
  }
  if(Array.isArray(s.sectionOrder)&&s.sectionOrder.length){
    o.sectionOrderNames=s.sectionOrder.map(function(id){var t=s.topics.find(function(x){return x.id===id;});return t?t.name:null;}).filter(Boolean);
  }
  return o;
}
function download(name,obj){
  try{
    var blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},400);
    toast('Download शुरू: '+name);
  }catch(e){toast('Download block हो गया — file browser में खोलें',true);}
}
function fullBackupPayload(refs){
  ensureStudyData();
  var payload={subjects:DB.subjects.map(function(s){return plainSubject(s,refs);})};
  if(DB.tricks&&Object.keys(DB.tricks).length)payload.tricks=DB.tricks;
  if(DB.mistakes.length)payload.mistakes=DB.mistakes;
  if(DB.bookmarks.questions.length||DB.bookmarks.vocab.length)payload.bookmarks=DB.bookmarks;
  if(Object.keys(DB.progress.daily).length||DB.progress.history.length||Object.keys(DB.progress.topics).length)payload.progress=DB.progress;
  return payload;
}
function exportAll(withMedia){
  if(withMedia===false){download('studybook-backup-text.json',fullBackupPayload(null));return;}
  var ids=new Set();forEachLibraryQuestion(function(q){if(q&&q.id)ids.add(String(q.id));});
  downloadWithQuestionMedia('studybook-backup.json',fullBackupPayload,ids);
}

function startPractice(sid,tid,pool,opts){
  opts=opts||{};
  var questions=pool||topicAllQ(getTopic(sid,tid));
  if(!questions.length){toast('पहले कुछ questions जोड़ें!',true);return;}
  listPages.delete('quiz-review');
  state.practice={subjectId:sid,topicId:tid,mode:opts.mode||'',label:opts.label||'',backHref:opts.backHref||'',backLabel:opts.backLabel||'',source:questions.slice(),queue:shuffle(questions).map(shuffleQ),idx:0,score:0,answered:false,chosen:-1,log:[]};
  goto('#/practice');
}
var subjectPoolCache=new WeakMap();
function subjectUniqueQuestions(subject){
  if(!subject)return [];
  var cached=subjectPoolCache.get(subject);
  if(cached&&cached.version===libraryVersion)return cached.pool;

      var k=questionDedupKey(q);
      if(k&&seen.has(k))return;
      if(k)seen.add(k);
      out.push(Object.assign({},q,{_sid:subject.id,_tid:tid||'',_sName:subject.name,_tName:tName||''}));
    });
  }
  (subject.topics||[]).forEach(function(t){
    collect(t.questions,t.id,t.name);
    subsOf(t).forEach(function(sb){
      collect(sb.questions,t.id,sb.name||t.name);
      (sb.types||[]).forEach(function(tp){
        collect(tp.questions,t.id,(sb.name?sb.name+' · ':'')+tp.name);
      });
    });
  });
  subjectPoolCache.set(subject,{version:libraryVersion,pool:out});

}
function fmtQuizTimer(z){

    var rem=Math.max(0,z.timeLimit-(z.elapsed||0));
    var m=Math.floor(rem/60), s=rem%60;
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  return (z?z.elapsed:0)+'s';
}

/* search input (in-place update: zero screen shake, zero animation replay, zero focus loss) */
function updateSearchResultsOnly(){
  var box=document.getElementById('searchResults');
  if(!box)return false;
  clearRenderSlots(box);
  var html=null;
  if(state.page==='tricks'){
    var items=trickSubjects();
    var selected=items.filter(function(item){return item.id===state.trickSubject;})[0];
    html=selected?tricksList(selected.id):tricksAllResultsHTML(items);
  }else if(state.page==='subjects'){
    html=subjectsResultsHTML();
  }else if(state.page==='vocabwords'){
    var vs=getSubject(state.subjectId);
    if(vs)html=vocabWordsResultsHTML(vs);
  }else if(state.page==='vocabgroup'){
    var gs=getSubject(state.subjectId), grp=gs&&getVocabGroup(gs,state.groupId);
    if(gs&&grp)html=vocabGroupResultsHTML(gs,grp);
  }
  if(html===null)return false;
  box.classList.add('no-anim');
  box.innerHTML=deco(html);
  return true;
}
function scheduleSearch(e){
  if(e.target.id!=='searchInp'||e.isComposing)return;
  var input=e.target;
  state.search=input.value;
  var clear=document.getElementById('searchClearBtn');
  if(clear)clear.style.display=state.search?'':'none';
  clearTimeout(searchTimer);
  searchTimer=setTimeout(function(){
    if(!input.isConnected)return;
    listPages.clear();updateSearchResultsOnly();
  },120);
}
document.addEventListener('input',scheduleSearch);
document.addEventListener('compositionstart',function(e){if(e.target.id==='searchInp')clearTimeout(searchTimer);});
document.addEventListener('compositionend',scheduleSearch);

/* Vocab JSON import: append words, ignore existing duplicates. */
document.addEventListener('change',function(e){
  if(e.target.id!=='vocabJsonFile')return;
  var file=e.target.files&&e.target.files[0];if(!file)return;
  var sid=state.subjectId;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var parsed=JSON.parse(String(reader.result||''));
      var rows=vocabRowsFromJSON(parsed);
      if(!rows.length){toast('JSON में word और meaning वाली सूची नहीं मिली',true);return;}
      var subject=getSubject(sid);if(!subject){toast('Vocab section नहीं मिला',true);return;}
      var result=addVocabBatch(subject,rows,file.name);
      save();state.search='';render();
      toast(result.added?result.added+' शब्द “'+result.section+'” section में import हुए'+(result.duplicates?' · '+result.duplicates+' duplicate छोड़े':'')+' ✅':'कोई नया शब्द नहीं जुड़ा'+(result.duplicates?' · '+result.duplicates+' duplicate मिले':''),!result.added);
    }catch(err){toast('JSON file पढ़ने में समस्या — सही JSON file चुनें',true);}
    finally{e.target.value='';}
  };
  reader.onerror=function(){toast('File पढ़ी नहीं जा सकी',true);e.target.value='';};
  reader.readAsText(file);
});

/* keyboard shortcuts */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&modalRoot.firstElementChild){closeModal();return;}
  if(e.key==='Enter'&&e.target&&(e.target.id==='vocabWord'||e.target.id==='vocabMeaning')){
    e.preventDefault();
    clickEl('[data-act="vocab-add"]');
    return;
  }
  if(modalRoot.firstElementChild)return;
  if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('.qmedia'))return;
  var n=parseInt(e.key,10);
  if(state.page==='practice'&&state.practice){
    var p=state.practice;
    var pq=p.queue&&p.queue[p.idx];
    if(!p.answered&&pq&&n>=1&&n<=pq.options.length){clickEl('[data-act="answer"][data-oi="'+(n-1)+'"]');}
    else if(p.answered&&pq&&(e.key==='Enter'||e.key===' ')){e.preventDefault();clickEl('[data-act="next"]');}
  }else if(state.page==='quiz'&&state.quiz&&state.quiz.phase==='play'){
    var z=state.quiz;
    var zq=z.queue&&z.queue[z.idx];
    if(zq&&n>=1&&n<=zq.options.length){clickEl('[data-act="qpick"][data-oi="'+(n-1)+'"]');}
    else if(e.key==='Enter'&&z.chosen>=0){clickEl('#quizNext');}
  }else if(state.page==='vocabflashcards'&&state.flashcards&&!state.flashcards.done){
    var fcK=state.flashcards;
    if(e.key===' '){e.preventDefault();clickEl('[data-act="fc-flip"]');}
    else if(e.key==='s'||e.key==='S'){if(fcK.deck[0])speakWord(fcK.deck[0].word);}
    else if(fcK.flipped&&(e.key==='1'||e.key==='ArrowLeft')){e.preventDefault();clickEl('[data-act="fc-repeat"]');}
    else if(fcK.flipped&&(e.key==='2'||e.key==='ArrowRight'||e.key==='Enter')){e.preventDefault();clickEl('[data-act="fc-know"]');}
  }
});

function eligibleMediaSubject(s){
  return /^(maths?|mathematics|reasoning|english|गणित|तर्कशक्ति|रीजनिंग|अंग्रेज़ी|अंग्रेजी)$/i.test(String((s&&s.name)||'').trim());
}
function forEachLibraryQuestion(fn){
  DB.subjects.forEach(function(s){
    (s.topics||[]).forEach(function(t){
      (t.questions||[]).forEach(function(q){fn(q,s);});
      (t.subs||[]).forEach(function(ch){
        (ch.questions||[]).forEach(function(q){fn(q,s);});
        (ch.types||[]).forEach(function(type){(type.questions||[]).forEach(function(q){fn(q,s);});});
      });
    });
  });
}
function questionMediaSource(id){
  if(!id)return null;
  if(!mediaQuestionIndex||libraryVersion!==mediaIndexVersion){
    mediaIndexVersion=libraryVersion;
    mediaQuestionIndex=new Map();
    forEachLibraryQuestion(function(q,s){
      if(q&&q.id&&eligibleMediaSubject(s))mediaQuestionIndex.set(String(q.id),q);
    });
  }
  return mediaQuestionIndex.get(String(id))||null;
}
function mediaIDB(){
  if(!mediaDbPromise){
    mediaDbPromise=new Promise(function(resolve,reject){
      if(!window.indexedDB){reject(new Error('IndexedDB unavailable'));return;}
      var req=indexedDB.open(QUESTION_MEDIA_DB,1);
      req.onupgradeneeded=function(){
        if(!req.result.objectStoreNames.contains(QUESTION_MEDIA_STORE))req.result.createObjectStore(QUESTION_MEDIA_STORE,{keyPath:'id'});
      };
      req.onerror=function(){reject(req.error||new Error('Cannot open media storage'));};
      req.onsuccess=function(){
        var db=req.result;
        db.onversionchange=function(){db.close();mediaDbPromise=null;};
        db.onclose=function(){mediaDbPromise=null;};
        resolve(db);
      };
    }).catch(function(error){mediaDbPromise=null;throw error;});
  }
  return mediaDbPromise;
}
async function readQuestionMedia(id){
  var db=await mediaIDB();
  return new Promise(function(resolve,reject){
    var request=db.transaction(QUESTION_MEDIA_STORE,'readonly').objectStore(QUESTION_MEDIA_STORE).get(String(id));
    request.onsuccess=function(){resolve(request.result||null);};
    request.onerror=function(){reject(request.error);};
  });
}
async function allQuestionMedia(){
  var db=await mediaIDB();
  return new Promise(function(resolve,reject){
    var request=db.transaction(QUESTION_MEDIA_STORE,'readonly').objectStore(QUESTION_MEDIA_STORE).getAll();
    request.onsuccess=function(){resolve(request.result||[]);};
    request.onerror=function(){reject(request.error);};
  });
}
async function updateQuestionMedia(id,change){
  id=String(id);
  var db=await mediaIDB();
  return new Promise(function(resolve,reject){
    var tx=db.transaction(QUESTION_MEDIA_STORE,'readwrite'), table=tx.objectStore(QUESTION_MEDIA_STORE);
    var next=null, problem=null, req=table.get(id);
    tx.oncomplete=function(){resolve(next);};
    tx.onabort=function(){reject(problem||tx.error||new Error('Media transaction aborted'));};
    req.onsuccess=function(){
      try{
        next=change(req.result||{id:id});
        if(next&&(next.voice||next.image)){next.id=id;table.put(next);}
        else{next=null;table.delete(id);}
      }catch(error){problem=error;tx.abort();}
    };
  });
}
async function deleteMediaFor(questions){
  var ids=new Set();
  questions.forEach(function(q){if(q&&q.id)ids.add(String(q.id));});
  if(!ids.size)return;
  try{
    var db=await mediaIDB();
    await new Promise(function(resolve,reject){
      var tx=db.transaction(QUESTION_MEDIA_STORE,'readwrite'), table=tx.objectStore(QUESTION_MEDIA_STORE);
      tx.oncomplete=resolve;tx.onabort=function(){reject(tx.error);};
      ids.forEach(function(id){table.delete(id);});
    });
  }catch(error){if(storageAvailable)toast('Attachments हटाने में समस्या आई।',true);}
}
function questionMediaHTML(q,subject){
  if(!q||!q.id||!(subject?eligibleMediaSubject(subject):questionMediaSource(q.id)))return '';
  var id=esc(q.id);
  return '<div class="qmedia" data-qmedia-key="'+id+'"><div class="qmedia-actions">'
    +'<div class="qmedia-voice-tools"><button type="button" class="btn ghost sm" data-act="qmedia-voice" data-voice-mode="record" data-saved="0" data-qid="'+id+'">'+QM_MIC+'<span>Voice note</span></button>'
    +'<button type="button" class="btn ghost sm qmedia-voice-edit" data-act="qmedia-voice-edit" data-qid="'+id+'" aria-label="Edit voice note" title="Edit voice note · Record again or remove" hidden>'+QM_EDIT+'</button></div>'
    +'<button type="button" class="btn ghost sm" data-act="qmedia-image" data-qid="'+id+'">'+QM_IMAGE+'<span>Add image</span></button>'
    +'</div><button type="button" class="qmedia-thumb" data-act="qmedia-image" data-qid="'+id+'" aria-label="Question image बड़ी देखें" hidden></button></div>';
}
function revokeMediaURL(url){if(url)URL.revokeObjectURL(url);}
/* Only one question can play at a time. The player is never added to the page. */
function paintQuestionVoice(node,tracked){
  var button=node.querySelector('[data-act="qmedia-voice"]');
  var saved=!!(tracked&&tracked.voice);
  var mode=activeQuestionVoice&&activeQuestionVoice.node===node?activeQuestionVoice.phase:(saved?'play':'record');
  if(button.dataset.voiceMode!==mode){
    var icon=mode==='playing'?QM_PAUSE:mode==='record'?QM_MIC:QM_PLAY;
    var label={record:'Voice note',play:'Play voice note',playing:'Pause voice note',paused:'Resume voice note',loading:'Loading voice…'}[mode];
    button.innerHTML=icon+'<span>'+label+'</span>';
    button.dataset.voiceMode=mode;
  }
  button.dataset.saved=saved?'1':'0';
  node.querySelector('[data-act="qmedia-voice-edit"]').hidden=!saved;
}
function stopQuestionVoice(){
  var run=activeQuestionVoice;
  if(!run)return;
  activeQuestionVoice=null;
  if(run.audio){
    run.audio.pause();run.audio.removeAttribute('src');run.audio.load();
  }
  revokeMediaURL(run.url);
  if(run.node.isConnected)paintQuestionVoice(run.node,mediaMounts.get(run.node));
}
function questionVoiceError(run,error){
  if(activeQuestionVoice!==run)return;
  stopQuestionVoice();
  toast(error&&error.name==='NotAllowedError'?'Browser ने audio रोक दिया। Play voice note फिर दबाएँ।':'Voice note नहीं चल पाया। Chrome या Edge में खोलें, या Edit voice note से नई recording करें।',true);
}
function playQuestionVoice(run){
  var attempt=++run.attempt;
  run.phase='playing';paintQuestionVoice(run.node,mediaMounts.get(run.node));
  // Call play from the click handler when the blob is already loaded.
  try{
    Promise.resolve(run.audio.play()).catch(function(error){
      if(run.attempt===attempt)questionVoiceError(run,error);
    });
  }catch(error){questionVoiceError(run,error);}
}
function startQuestionVoice(run,blob){
  try{
    var audio=new Audio();run.audio=audio;
    audio.addEventListener('ended',function(){if(activeQuestionVoice===run)stopQuestionVoice();});
    audio.addEventListener('error',function(){questionVoiceError(run);});
    audio.addEventListener('pause',function(){
      if(activeQuestionVoice===run&&audio.paused&&!audio.ended&&run.phase==='playing'){
        run.phase='paused';paintQuestionVoice(run.node,mediaMounts.get(run.node));
      }
    });
    run.url=URL.createObjectURL(blob);audio.src=run.url;
    playQuestionVoice(run);
  }catch(error){questionVoiceError(run,error);}
}
function toggleQuestionVoice(button,q){
  var node=button.closest('[data-qmedia-key]');
  if(!node)return;
  var tracked=mediaMounts.get(node), current=activeQuestionVoice;
  if(current&&current.node===node){
    if(!current.audio)stopQuestionVoice(); // cancel a pending read
    else if(current.audio.paused)playQuestionVoice(current);
    else{
      current.attempt++;current.phase='paused';current.audio.pause();paintQuestionVoice(node,tracked);
    }
    return;
  }
  var wasSaved=button.dataset.saved==='1';
  stopQuestionVoice();
  if(!tracked||(tracked.ready&&!tracked.voice)){
    if(wasSaved)toast('Saved voice note नहीं मिला। Page reload करके फिर कोशिश करें।',true);
    else openVoiceNote(q);
    return;
  }
  var run={node:node,id:String(q.id),audio:null,url:'',phase:'loading',attempt:0};
  activeQuestionVoice=run;
  if(tracked.voice){startQuestionVoice(run,tracked.voice);return;}
  paintQuestionVoice(node,tracked);
  if(mediaObserver)mediaObserver.unobserve(node);
  loadMountedMedia(node).then(function(){
    if(activeQuestionVoice!==run||!node.isConnected)return;
    if(tracked.voice)startQuestionVoice(run,tracked.voice);
    else{
      stopQuestionVoice();
      if(wasSaved)toast('Saved voice note नहीं मिला। Page reload करके फिर कोशिश करें।',true);
      else openVoiceNote(q);
    }
  });
}
function paintQuestionMedia(node,tracked,value){
  var thumb=node.querySelector('.qmedia-thumb'), image=node.querySelector('.qmedia-actions [data-act="qmedia-image"]');
  tracked.ready=true;tracked.voice=value&&value.voice||null;
  paintQuestionVoice(node,tracked);
  image.firstElementChild.nextElementSibling.textContent=value&&value.image?'View image':'Add image';
  image.dataset.saved=value&&value.image?'1':'0';
  if(tracked.blob===(value&&value.image||null))return;
  thumb.replaceChildren();thumb.hidden=true;
  revokeMediaURL(tracked.url);tracked.url='';tracked.blob=value&&value.image||null;
  if(tracked.blob){
    var pic=document.createElement('img');
    pic.alt='इस question की attached image';pic.decoding='async';
    if(value.width&&value.height){pic.width=value.width;pic.height=value.height;}
    tracked.url=URL.createObjectURL(tracked.blob);pic.src=tracked.url;
    thumb.appendChild(pic);thumb.hidden=false;
  }
}
function loadMountedMedia(node){
  var tracked=mediaMounts.get(node);
  if(!tracked||tracked.ready)return Promise.resolve();
  if(tracked.loading)return tracked.loading;
  var version=++tracked.version;
  tracked.loading=readQuestionMedia(node.dataset.qmediaKey).then(function(value){
    if(node.isConnected&&mediaMounts.get(node)===tracked&&tracked.version===version)paintQuestionMedia(node,tracked,value);
  }).catch(function(){/* individual errors are explained when the editor is opened */})
    .finally(function(){tracked.loading=null;});
  return tracked.loading;
}
function syncQuestionMediaView(){
  if(activeQuestionVoice&&!activeQuestionVoice.node.isConnected)stopQuestionVoice();
  mediaMounts.forEach(function(tracked,node){
    if(node.isConnected)return;
    if(mediaObserver)mediaObserver.unobserve(node);
    revokeMediaURL(tracked.url);mediaMounts.delete(node);
  });
  if(!storageAvailable)return;  // opaque preview frames cannot persist media
  view.querySelectorAll('[data-qmedia-key]').forEach(function(node){
    if(mediaMounts.has(node))return;
    mediaMounts.set(node,{version:0,url:'',blob:null,voice:null,ready:false,loading:null});
    if(!window.IntersectionObserver){loadMountedMedia(node);return;}
    if(!mediaObserver)mediaObserver=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){mediaObserver.unobserve(entry.target);loadMountedMedia(entry.target);}
      });
    },{rootMargin:'280px 0px'});
    mediaObserver.observe(node);
  });
}
function refreshQuestionMedia(id,value){
  if(activeQuestionVoice&&activeQuestionVoice.id===String(id)&&activeQuestionVoice.audio)stopQuestionVoice();
  mediaMounts.forEach(function(tracked,node){
    if(node.isConnected&&node.dataset.qmediaKey===String(id)){
      tracked.version++;
      if(mediaObserver)mediaObserver.unobserve(node);
      paintQuestionMedia(node,tracked,value);
    }
  });
}
window.addEventListener('pagehide',function(){
  stopQuestionVoice();
  if(activeModalCleanup)closeModal();
  if(mediaObserver)mediaObserver.disconnect();
  mediaMounts.forEach(function(tracked){revokeMediaURL(tracked.url);});mediaMounts.clear();
});
window.addEventListener('pageshow',function(e){if(e.persisted)syncQuestionMediaView();});
