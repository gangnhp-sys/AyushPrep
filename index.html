/* Consistent site-wide type, while keeping the original logo wordmark & monospace code/JSON inputs. */
body *:not(.brand-name):not(.brand-name *):not(code):not(pre):not(.pre):not(#vocabJsonText):not(#importJson):not(#mJson):not(#thText):not(.tedit-sec textarea){font-family:var(--sans)!important}
code,pre,.pre,#vocabJsonText,#importJson,#mJson,#thText,.tedit-sec textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Paathshala","Noto Sans Devanagari","Nirmala UI",monospace}
/* Dark theme readability on subject-tinted pages */
[data-theme="dark"] .subject-page{
  --brand-ink:color-mix(in srgb,var(--subject-color) 42%,#fff3d5);
  --brand-soft:color-mix(in srgb,var(--subject-color) 28%,var(--panel));
}
[data-theme="dark"] .subject-page .eyebrow,
[data-theme="dark"] .subject-page .vocab-word,
[data-theme="dark"] .subject-page .vquiz-timer,
[data-theme="dark"] .subject-page .vquiz-score,
[data-theme="dark"] .subject-page .btn.soft,
[data-theme="dark"] .subject-page .md a,
[data-theme="dark"] .subject-page .tprev b,
[data-theme="dark"] .subject-page .welcome-kicker{color:var(--brand-ink)}
[data-theme="dark"] .subject-page .btn.soft{border-color:color-mix(in srgb,var(--subject-color) 45%,transparent)}
[data-theme="dark"] .subject-page .tabbar a.on{background:var(--subject-color);color:#fff}
[data-theme="dark"] .welcome-spark{color:#26372b}

/* Vocabulary wordbook */
.vocab-panel{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.vocab-add{padding:20px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.vocab-add h2{font-size:17px;margin:0 0 14px}
.vocab-form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.vocab-field label{display:block;font-size:12px;font-weight:800;color:var(--ink-2);margin:0 0 6px}
.vocab-field input{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;background:var(--panel);color:var(--ink);font:inherit;outline:none}
.vocab-field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}
.vocab-table{width:100%;border-collapse:collapse}
.vocab-table th{text-align:left;padding:13px 18px;background:var(--panel);color:var(--ink-2);font-size:12px;letter-spacing:.04em}
.vocab-table td{padding:15px 18px;border-top:1px solid var(--line);vertical-align:middle}
.vocab-table tbody tr:hover{background:var(--panel-2)}
.vocab-word{font-weight:800;font-size:16px;color:var(--brand)}
.vocab-meaning{font-size:15px;font-weight:650}
.vocab-actions{white-space:nowrap;text-align:right}
.vocab-count{font-size:13px;color:var(--ink-2);margin-top:8px}
.vocab-empty{text-align:center;padding:34px 18px;color:var(--ink-2)}
.vocab-square-wrap{position:relative;min-width:0}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:18px}
.vocab-square{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;aspect-ratio:1/1;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.vocab-square:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:var(--sh-2)}
.vocab-square .sq-ico{font-size:30px;line-height:1}
.vocab-square .sq-name{font-weight:800;font-size:15px;line-height:1.25;word-break:break-word}
.vocab-square .sq-count{display:inline-block;font-size:12px;font-weight:800;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.vocab-square-wrap .sq-mini{position:absolute;top:8px;right:8px;z-index:2}
.vocab-square-new{border-style:dashed;color:var(--ink-2);background:transparent;box-shadow:none}
.vocab-square-new:hover{color:var(--brand)}
@media(max-width:420px){.vocab-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}.vocab-square .sq-ico{font-size:26px}}
@media(max-width:650px){.vocab-form{grid-template-columns:1fr}.vocab-form .btn{width:100%}.vocab-table th,.vocab-table td{padding:12px 10px}.vocab-table th:last-child{width:64px}.vocab-actions .mini{margin:2px}}


.vquiz-card{max-width:700px;margin:24px auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);padding:clamp(18px,4vw,34px);box-shadow:var(--sh-2)}
.vquiz-top,.vquiz-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vquiz-timer{font-variant-numeric:tabular-nums;font-size:18px;font-weight:850;color:var(--brand);background:var(--panel-2);padding:8px 14px;border-radius:12px}
.vquiz-progress{font-size:13px;font-weight:750;color:var(--ink-2);margin-top:28px}
.vquiz-word{font-size:clamp(30px,6vw,46px);margin:9px 0}
.vquiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}
.vquiz-option{min-height:58px;padding:14px;border:1px solid var(--line-2);border-radius:14px;background:var(--panel);color:var(--ink);font:inherit;font-weight:700;text-align:left;cursor:pointer}
.vquiz-option:hover:not(:disabled){border-color:var(--brand);background:var(--panel-2)}
.vquiz-option.is-selected{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 28%,transparent)}
.vquiz-bottom{border-top:1px solid var(--line);padding-top:16px}
@media(max-width:560px){.vquiz-options{grid-template-columns:1fr}.vquiz-card{padding:16px}}


.vquiz-result{max-width:760px;margin:28px auto;padding:clamp(20px,4vw,38px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-2);text-align:center}
.vquiz-score{font-size:clamp(54px,12vw,86px);line-height:1.1;font-weight:900;letter-spacing:-.06em;color:var(--brand);margin:10px auto}
.vquiz-score small{font-size:.42em;letter-spacing:0;margin-left:3px}
.vquiz-result-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}
.vquiz-result-stats>div{padding:15px 8px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2);display:flex;flex-direction:column;gap:4px}
.vquiz-result-stats b{font-size:23px}.vquiz-result-stats span{font-size:12px;font-weight:750;color:var(--ink-2)}

<script>
(function(){
'use strict';

/* ============================================================
   STORAGE + SEED
============================================================ */
var KEY='studybook:v3';
var THEME_KEY='studybook:theme';
var storageAvailable=true, storageMessage='', storageLocked=false;
var saveTimer=0, saveIdle=null, savePending=false;
var structureDirty=true, libraryVersion=0;
function showStorageStatus(){
  var notice=document.getElementById('storageNotice');
  if(!notice)return;
  notice.hidden=!storageMessage;
  if(storageMessage)notice.firstElementChild.textContent=storageMessage;
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  }).replace(/[\u2030-\u2BFF\uFE0F]|[\uD800-\uDBFF][\uDC00-\uDFFF]/g,function(c){
    return '&#'+c.codePointAt(0)+';';
  });
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
// Partial Fisher–Yates with a sparse swap table. Optional excluded index (correct meaning).
function sampleItems(items,count,exclude){
  var n=items.length-(exclude>=0?1:0), limit=Math.min(n,count), out=[];
  if(limit<=0)return out;
  if(!(exclude>=0)&&limit===n)return shuffle(items);
  var swaps=new Map();
  for(var i=0;i<limit;i++){
    var j=i+Math.floor(Math.random()*(n-i));
    var picked=swaps.has(j)?swaps.get(j):j;
    swaps.set(j,swaps.has(i)?swaps.get(i):i);
    out.push(items[exclude>=0&&picked>=exclude?picked+1:picked]);
  }
  return out;
}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
var LETTERS=['A','B','C','D','E','F'];
/* ---- marking scheme (har quiz/mock) ---- */
var MK_RIGHT=2, MK_WRONG=-0.5;
function fmtMarks(n){var v=Math.round(n*100)/100;return (v>0?'+':'')+v;}

function hexRgba(hex,a){
  var h=hex.replace('#','');
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n=parseInt(h,16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
/* StudyBook palette — one calm olive accent across every subject */
var OLIVE='#4D694E';
/* har subject ka apna punchy colour — light/dark dono me kaam karta hai */
var SUBJ_COLORS=['#0F7A6B','#B4560A','#3F45A8','#A32247','#5B7A18','#8A3FA0','#0E6DA8','#B0341E'];
function colorFor(i){return SUBJ_COLORS[i%SUBJ_COLORS.length];}
var PALETTE=[[OLIVE,'Maths'],[OLIVE,'Reasoning'],[OLIVE,'English'],[OLIVE,'GK-GS'],[OLIVE,'Vocab'],[OLIVE,'More']];

function seed(){
  function S(name,icon,c,topics){return {id:uid(),name:name,icon:icon,c:c,topics:topics};}
  function T(name,qs){return {id:uid(),name:name,questions:qs};}
  function Q(question,options,correct,explanation){
    return {id:uid(),question:question,options:options,correct:correct,explanation:explanation||''};
  }
  return {subjects:[
    S('Maths','➗','#0F7A6B',[
      T('प्रतिशत',[
        Q('240 का 25% कितना होगा?',['50','60','70','80'],1,'240 × 25/100 = 60'),
        Q('किसी संख्या को 40 से 50 कर दिया जाए तो प्रतिशत वृद्धि कितनी होगी?',['20%','25%','10%','125%'],1,'वृद्धि = 10, 10/40 × 100 = 25%'),
        Q('15, 60 का कितना प्रतिशत है?',['20%','25%','30%','35%'],1,'15/60 × 100 = 25%')
      ]),
      T('औसत',[
        Q('5, 10, 15, 20, 25 का औसत कितना है?',['12','13','15','17'],2,'योग = 75, 75/5 = 15'),
        Q('4 संख्याओं का औसत 20 है। सभी का योग कितना होगा?',['60','70','80','100'],2,'औसत × संख्या = 20 × 4 = 80')
      ])
    ]),
    S('Reasoning','🧩','#B4560A',[
      T('संख्या श्रेणी',[
        Q('2, 6, 12, 20, 30, ? — अगली संख्या क्या है?',['36','40','42','44'],2,'अंतर 4, 6, 8, 10, 12 → 30 + 12 = 42'),
        Q('3, 5, 7, 9, 11 में से भिन्न संख्या कौन है?',['3','5','9','11'],2,'9 के अलावा सभी अभाज्य संख्याएँ हैं')
      ]),
      T('कोडिंग-डिकोडिंग',[
        Q('यदि किसी कोड में MOUSE को NPVTF लिखा जाता है, तो CAT को कैसे लिखेंगे?',['DBU','DAT','EBU','CBT'],0,'हर अक्षर +1: C→D, A→B, T→U')
      ])
    ]),
    S('English','🔤','#3F45A8',[
      T('व्याकरण',[
        Q('She ___ to school every day.',['goes','go','going','gone'],0,'Third person singular → goes'),
        Q('He is good ___ mathematics.',['at','in','on','for'],0,'Good at + subject'),
        Q('Choose the correct spelling:',['necessary','neccessary','necesary','necessery'],0,'Correct spelling: necessary')
      ])
    ]),
    S('GK-GS','🌍','#A32247',[
      T('स्थिर सामान्य ज्ञान',[
        Q('ऑस्ट्रेलिया की राजधानी क्या है?',['Sydney','Canberra','Melbourne','Perth'],1,'कैनबरा ऑस्ट्रेलिया की राजधानी है'),
        Q('सौरमंडल का सबसे बड़ा ग्रह कौन सा है?',['Jupiter','Saturn','Earth','Neptune'],0,'बृहस्पति (Jupiter) सबसे बड़ा ग्रह है'),
        Q('भारत का राष्ट्रीय पक्षी कौन सा है?',['Sparrow','Peacock','Parrot','Eagle'],1,'मोर (Peacock)')
      ])
    ]),
    S('Vocab','📖','#5B7A18',[
      T('पर्यायवाची और विलोम',[
        Q('"Abundant" का पर्यायवाची क्या है?',['Plentiful','Scarce','Rare','Tiny'],0,'Abundant = बहुत अधिक = Plentiful'),
        Q('"Benevolent" का विलोम क्या है?',['Kind','Cruel','Generous','Helpful'],1,'Benevolent = दयालु, विलोम = Cruel')
      ]),
      T('एक शब्द प्रतिस्थापन',[
        Q('"A person who writes books" — एक शब्द?',['Author','Editor','Publisher','Critic'],0,'पुस्तक लिखने वाला = Author')
      ])
    ]),
    S('Blackbook','📕','#8A3FA0',[
      T('Antonyms',[]),
      T('Synonyms',[]),
      T('OWS - One words substitution',[]),
      T('Idioms & Phrases',[]),
      T('Mis-spelt words',[])
    ])
  ]};
}
function ensureDemoTheory(){
  try{
    var s=DB.subjects[0];if(!s||!s.topics||!s.topics[0])return;
    var t=s.topics[0];
    if(theoryOf(t).length)return;
    t.theory=[
      {id:uid(),title:'प्रतिशत क्या है?',content:'**प्रतिशत** का मतलब है — "प्रति सौ" (per hundred)।\n\n- सूत्र: `प्रतिशत = (भाग / पूरा) × 100`\n- 25% का अर्थ है 100 में से 25, यानी भिन्न `1/4`\n- किसी संख्या का x% निकालना हो तो उसे `x/100` से गुणा करें'},
      {id:uid(),title:'ज़रूरी भिन्न → प्रतिशत',content:'| भिन्न | प्रतिशत |\n|---|---|\n| 1/2 | 50% |\n| 1/3 | 33.33% |\n| 1/4 | 25% |\n| 1/5 | 20% |\n| 1/6 | 16.66% |\n| 1/8 | 12.5% |\n| 1/9 | 11.11% |\n| 1/11 | 9.09% |\n| 1/12 | 8.33% |\n\n> ये मान याद रखें — exam में सीधे इस्तेमाल होते हैं।'},
      {id:uid(),title:'Short tricks',content:'1. **क्रम बदलने पर मान नहीं बदलता**: A का 20%, B के बराबर है यदि B का 20% A हो — `A × 20% = 20% × A`.\n2. **लगातार वृद्धि**: पहले 10% फिर 20% बढ़ा → कुल `10 + 20 + (10×20)/100 = 32%`.\n3. **कमी के बाद वापसी**: 20% घटने के बाद पुराना मान पाने के लिए 25% बढ़ाना पड़ेगा (`100/80 × 100`).'}
    ];
    save();
  }catch(e){}
}

var loadedFromStorage=false;
var DB=(function(){
  var raw;
  try{raw=localStorage.getItem(KEY);}
  catch(e){
    storageAvailable=false;
    storageMessage='Preview Mode: यहाँ browser storage उपलब्ध नहीं है। डेटा सहेजने के लिए HTML को अपने browser में खोलें या Backup & Import से JSON export करें।';
    return seed();
  }
  if(raw){
    try{var d=JSON.parse(raw);if(d&&Array.isArray(d.subjects)&&d.subjects.length){loadedFromStorage=true;return d;}}catch(e){}
    // Never overwrite an unreadable library just because this page opened.
    storageLocked=true;

function flushSave(){
  if(saveTimer)clearTimeout(saveTimer);
  if(saveIdle!==null&&window.cancelIdleCallback)window.cancelIdleCallback(saveIdle);
  saveTimer=0;saveIdle=null;
  if(!savePending||!storageAvailable||storageLocked)return;
  savePending=false;
  try{localStorage.setItem(KEY,JSON.stringify(DB));storageMessage='';}
  catch(e){storageMessage='बदलाव browser में save नहीं हो पाए (storage limit या permission)। इस tab को बंद करने से पहले Backup & Import से Full Backup export करें।';}
  showStorageStatus();
}
function save(kind){
  if(kind!=='study'){structureDirty=true;libraryVersion++;}
  if(!storageAvailable||storageLocked)return;
  savePending=true;
  if(saveTimer||saveIdle!==null)return;
  // Wait briefly so repeated changes result in a single write, then use idle time.
  saveTimer=setTimeout(function(){
    saveTimer=0;
    if(window.requestIdleCallback)saveIdle=window.requestIdleCallback(flushSave,{timeout:600});
    else flushSave();
  },150);
}

var questionKeyCache=new WeakMap();
function studyQKey(q){
  var text=String((q&&q.question)||'');
  if(!text)return '';
  var saved=questionKeyCache.get(q);
  if(saved&&saved.text===text)return saved.key;
  var source=text;
  if(text.normalize)text=text.normalize('NFC');
  var key=text.replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
  questionKeyCache.set(q,{text:source,key:key});
  return key;
}
function studySnapshotQ(q,meta){
  meta=meta||{};
  var sObj=meta.subjectId?getSubject(meta.subjectId):null;
  var tObj=(meta.subjectId&&meta.topicId)?getTopic(meta.subjectId,meta.topicId):null;
  return {
    key:studyQKey(q),
    id:String((q&&q.id)||''),
    subjectId:meta.subjectId||(q&&q._sid)||'',
    topicId:meta.topicId||(q&&q._tid)||'',
    subjectName:meta.subjectName||(q&&q._sName)||(sObj?sObj.name:''),
    topicName:meta.topicName||(q&&q._tName)||(q&&q.chapter)||(tObj?tObj.name:''),
    question:String((q&&q.question)||''),
    options:Array.isArray(q&&q.options)?q.options.slice():[],
    correct:Number(q&&q.correct)||0,
    explanation:String((q&&q.explanation)||''),
    hint:String((q&&q.hint)||''),
    examName:String((q&&q.examName)||''),
    examDate:String((q&&q.examDate)||''),
    examShift:String((q&&q.examShift)||'')
  };
}
function recordMistake(q,meta){
  ensureStudyData();
  if(!q||!q.question||!Array.isArray(q.options)||q.options.length<2)return;
  var snap=studySnapshotQ(q,meta);
  if(!snap.key)return;
  var existing=DB.mistakes.find(function(m){return m.key===snap.key;});
  if(existing){
    existing.wrongCount=(existing.wrongCount||1)+1;
    existing.lastWrongAt=Date.now();
    if(snap.subjectName&&!existing.subjectName)existing.subjectName=snap.subjectName;
    if(snap.topicName&&!existing.topicName)existing.topicName=snap.topicName;
  }else{
    snap.wrongCount=1;
    snap.lastWrongAt=Date.now();
    DB.mistakes.unshift(snap);
  }
  save('study');
}

var bookmarkIndex=new WeakMap();
function bookmarkKeys(list,toKey){
  var hit=bookmarkIndex.get(list);
  if(hit&&hit.size===list.length)return hit.keys;
  var keys=new Set(list.map(toKey));
  bookmarkIndex.set(list,{size:list.length,keys:keys});
  return keys;
}
function isQBookmarked(q){

function dayTotalActivity(rec){
  if(!rec)return 0;
  return (rec.q||0)+(rec.vocab||0)+(rec.quizzes||0);
}
function calcStudyStats(){
  ensureStudyData();
  var daily=DB.progress.daily||{};
  var today=new Date();
  today.setHours(12,0,0,0);
  var todayK=todayDateKey(today);
  var todayRec=daily[todayK]||{q:0,ok:0,vocab:0,quizzes:0};
  var current=0;
  var cursor=new Date(today.getTime());
  if(!dayTotalActivity(daily[todayDateKey(cursor)])){
    cursor.setDate(cursor.getDate()-1);
  }
  while(dayTotalActivity(daily[todayDateKey(cursor)])>0){
    current++;
    cursor.setDate(cursor.getDate()-1);
    if(current>3650)break;
  }
  var activeKeys=Object.keys(daily).filter(function(k){return dayTotalActivity(daily[k])>0;}).sort();
  var best=0, run=0, prevTs=null;
  activeKeys.forEach(function(k){
    var parts=k.split('-').map(Number);
    var ts=new Date(parts[0],parts[1]-1,parts[2],12,0,0,0).getTime();
    if(prevTs!==null&&Math.round((ts-prevTs)/86400000)===1){run++;}
    else{run=1;}
    if(run>best)best=run;
    prevTs=ts;
  });
  var dayNames=['रवि','सोम','मंगल','बुध','गुरु','शुक्र','शनि'];
  var last7=[];
  for(var d=6;d>=0;d--){
    var dt=new Date(today.getTime());
    dt.setDate(dt.getDate()-d);
    var dk=todayDateKey(dt);
    var r=daily[dk]||{q:0,ok:0,vocab:0,quizzes:0};
    last7.push({key:dk,label:d===0?'आज':dayNames[dt.getDay()],count:(r.q||0)+(r.vocab||0),active:dayTotalActivity(r)>0});
  }
  var totQ=0, totOk=0, totVocab=0;
  Object.keys(daily).forEach(function(k){
    var r=daily[k];
    if(!r)return;
    totQ+=(r.q||0);totOk+=(r.ok||0);totVocab+=(r.vocab||0);
  });
  return {
    currentStreak:current,
    bestStreak:Math.max(best,current),
    todayCount:(todayRec.q||0)+(todayRec.vocab||0),
    todayQ:todayRec.q||0,
    todayVocab:todayRec.vocab||0,
    totalSolved:totQ,
    totalVocab:totVocab,
    overallAcc:totQ?Math.round(totOk/totQ*100):0,
    totalQuizzes:(DB.progress.history||[]).length,
    last7:last7
  };
}
function weakTopicsList(){

  });
  out.sort(function(a,b){return a.acc-b.acc||b.total-a.total;});

function speakWord(word){

function pageNavigator(start,end,total,cur,last){
  return '<form class="perf-nav" data-perf-nav aria-label="List pagination">'

function pageContent(spec,page){
  var total=spec.items.length, last=Math.ceil(total/spec.size);
  var cur=Math.min(last,Math.max(1,page||1)), offset=(cur-1)*spec.size;
  var end=Math.min(total,offset+spec.size);
  listPages.set(spec.key,cur);
  var nav=pageNavigator(offset+1,end,total,cur,last);
  return nav+spec.draw(spec.items.slice(offset,end),offset)+nav;
}

  if(items.length<=size){listPages.delete(key);return draw(items,0);}

function totalQuestionTypes(){var n=0;DB.subjects.forEach(function(s){if(isVocabSubject(s))return;n+=subjectStructureCounts(s).types;});return n;}
var wordCountCache=new WeakMap();
function secWords(s){
  var text=String((s&&s.content)||'');if(!text)return 0;
  var memo=wordCountCache.get(s);if(memo&&memo.text===text)return memo.count;
  var n=text.trim().split(/\s+/).filter(Boolean).length;
  wordCountCache.set(s,{text:text,count:n});return n;
}
function theoryWords(list){var n=0;(list||[]).forEach(function(s){n+=secWords(s);});return n;}
function readMin(w){return Math.max(1,Math.round(w/180));}
function subQ(sub){
  if(!sub)return 0;
  var n=(sub.questions||[]).length;
  (sub.types||[]).forEach(function(type){n+=(type.questions||[]).length;});
  return n;
}
function topicQuestionCount(t){
  if(!t)return 0;
  var n=(t.questions||[]).length;
  subsOf(t).forEach(function(sub){n+=subQ(sub);});
  return n;
}
function appendQuestions(out,list){
  if(list)for(var i=0;i<list.length;i++)out.push(list[i]);
}
function appendSubQuestions(out,sub){
  appendQuestions(out,sub.questions);
  (sub.types||[]).forEach(function(type){appendQuestions(out,type.questions);});
}
function appendTopicQuestions(out,t){
  appendQuestions(out,t.questions);
  subsOf(t).forEach(function(sub){appendSubQuestions(out,sub);});
}
function topicAllQ(t){var out=[];if(t)appendTopicQuestions(out,t);return out;}
function subAllQ(sub){var out=[];if(sub)appendSubQuestions(out,sub);return out;}
function containerOf(t,subId){return subId?(getSub(t,subId)||{questions:[]}):t;}
function plural(n,one,many){return n+' '+(n===1?one:many);}
function subjColor(s){
  var palette=['#755789','#9b624f','#55729b','#955d70','#927443','#7e3f6e','#3d7a6c','#4d694e'];
  var i=DB.subjects.indexOf(s);
  return i>=0?palette[i%palette.length]:palette[0];
}
function monoOf(s){
  var w=String((s&&s.name)||'?').trim().split(/\s+/).filter(function(x){return /[A-Za-z0-9\u0900-\u097F]/.test(x);});
  var m=(w[0]||'?').charAt(0);
  return '<span class="mono">'+esc(m.toUpperCase())+'</span>';
}
function tintStyle(s){
  var c=subjColor(s);
  return '--c:'+c
    +';--tint:color-mix(in srgb,'+c+' 13%,transparent)'
    +';--tint-strong:color-mix(in srgb,'+c+' 19%,transparent)'

function shuffleQ(q){

var reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
var celebrationLayer=null, celebrationTimer=0;
function motionOK(){return !document.hidden&&!reducedMotion.matches;}
function showParticles(layer,timeout){
  if(celebrationLayer)celebrationLayer.remove();
  clearTimeout(celebrationTimer);
  celebrationLayer=layer;
  document.body.appendChild(layer);
  celebrationTimer=setTimeout(function(){layer.remove();celebrationLayer=null;},timeout);
}
function confettiBurst(x,y,n){
  if(!motionOK())return;
  n=Math.min(n||24,24);
  var layer=document.createElement('div');
  layer.className='confetti-layer';
  var cols=['#6f9a63','#0F7A6B','#B4560A','#3F45A8','#A32247','#5B7A18','#d9b34a'];
  for(var i=0;i<n;i++){
    var d=document.createElement('i');
    d.className='cf';
    var ang=(Math.PI*2*i)/n+Math.random()*.6;
    var spread=90+Math.random()*180;
    d.style.left=(x||window.innerWidth/2)+'px';
    d.style.top=(y||90)+'px';
    d.style.background=cols[i%cols.length];
    d.style.setProperty('--dx',(Math.cos(ang)*spread).toFixed(0)+'px');
    d.style.setProperty('--dy',(120+Math.sin(ang)*spread+260).toFixed(0)+'px');
    d.style.setProperty('--rot',(Math.random()*900-450).toFixed(0)+'deg');
    d.style.setProperty('--dur',(1.15+Math.random()*.75).toFixed(2)+'s');
    d.style.animationDelay=(Math.random()*140).toFixed(0)+'ms';
    if(i%3===0)d.style.borderRadius='50%';
    layer.appendChild(d);
  }
  showParticles(layer,2300);
}
function logoParty(el){
  if(!el)return;
  if(motionOK()){
    el.classList.add('party');
    setTimeout(function(){el.classList.remove('party');},650);
  }
  var r=el.getBoundingClientRect();
  confettiBurst(r.left+r.width/2, r.top+r.height, 40);
  toast('🎉 AYUSH~PREP — All the best!');
}
function toast(msg,err){
  var t=document.createElement('div');
  t.className='toast'+(err?' err':'');
  t.textContent=msg;
  toastRoot.appendChild(t);
  requestAnimationFrame(function(){t.classList.add('show');});
  setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove();},400);},2800);
}

  if(!motionOK())return;

    list.sort(function(a,b){var ai=s.sectionOrder.indexOf(a.id),bi=s.sectionOrder.indexOf(b.id);return (ai<0?1e6:ai)-(bi<0?1e6:bi);});

function drawerTree(sid){
  var s=getSubject(sid);if(!s)return '';

      vgroups.forEach(function(g){

          +'<a class="d-item d-leaf" href="#/vocab-group/'+encodeURIComponent(sid)+'/'+encodeURIComponent(g.id)+'" title="'+esc(g.name)+'">'

            +'<span class="d-label">'+esc(t.name)+'</span>'
          +'</a>'
          +'<span class="cnt">'+(subs.length?subs.length+' sub':q+' q')+'</span>'
        +'</div>';
      if(openT){
        h+='<ul class="d-tree">';
        if(!subs.length){
          h+='<li><div class="d-none">इस topic में कोई subtopic नहीं</div></li>';
        }else{

var state={page:'home',subjectId:null,topicId:null,practice:null,quiz:null,vocabQuiz:null,blackbookQuiz:null,flashcards:null,revTab:'progress',editMode:false,search:'',
  tab:'questions',theoryOpen:{},tree:{sub:{},topic:{}}};
var onlyShowAnswers=true;

var currentRouteHash=(location.hash&&location.hash!=='#')?location.hash:'#/';
var routeStack=[];
function getRouteHash(){
  return currentRouteHash||location.hash||'#/';
}
function parseRoute(hashOverride){
  var srcHash=typeof hashOverride==='string'?hashOverride:getRouteHash();
  var raw=(srcHash||'').replace(/^#\/?/,'');
  var p=raw.split('/').filter(Boolean).map(decodeURIComponent);
  state.search='';
  if(!p.length)return {page:'home'};
  if(p[0]==='subjects')return {page:'subjects'};
  if(p[0]==='subject'&&p[1])return {page:'subject',subjectId:p[1]};
  if(p[0]==='vocab-words'&&p[1])return {page:'vocabwords',subjectId:p[1]};
  if(p[0]==='vocab-group'&&p[1]&&p[2])return {page:'vocabgroup',subjectId:p[1],groupId:p[2]};
  if(p[0]==='vocab-quiz'&&p[1])return {page:'vocabquiz',subjectId:p[1]};
  if(p[0]==='vocab-flashcards'&&p[1])return {page:'vocabflashcards',subjectId:p[1],fcFilter:p[2]||'all'};
  if(p[0]==='blackbook-quiz'&&p[1])return {page:'blackbookquiz',subjectId:p[1]};
  if(p[0]==='revision')return {page:'revision',revTab:(p[1]==='mistakes'||p[1]==='bookmarks')?p[1]:'progress'};
  if(p[0]==='topic'&&p[1]&&p[2])return {page:'topic',subjectId:p[1],topicId:p[2],
    tab:(p[3]==='theory'||p[3]==='notes')?'theory':(p[3]==='questions'?'questions':'none'),subId:p[4]||null};
  if(p[0]==='sub'&&p[1]&&p[2]&&p[3])return {page:'sub',subjectId:p[1],topicId:p[2],subId:p[3],subDetail:p[4]==='questions'};
  if(p[0]==='practice')return {page:'practice'};
  if(p[0]==='quiz')return {page:'quiz',quizSubject:p[1]||null,quizTopic:p[2]||null,quizSub:p[3]||null};
  if(p[0]==='tricks')return {page:'tricks',trickSubject:p[1]||null};
  if(p[0]==='import')return {page:'import'};
  return {page:'home'};
}
function route(hashOverride){
  if(typeof hashOverride==='string')currentRouteHash=hashOverride||'#/';
  var newRoute=shownListRoute!==currentRouteHash;
  if(newRoute){
    if(activeModalCleanup)closeModal();
    shownListRoute=currentRouteHash;
    listPages.clear();expandedQuestionLists.clear();renameCards=false;
  }
  var r=parseRoute(currentRouteHash);
  if(r.page!=='practice')state.practice=null;
  if(r.page!=='quiz'){if(window.__qt){clearInterval(window.__qt);window.__qt=null;}state.quiz=null;}
  if(r.page!=='vocabquiz'){if(window.__vqt){clearInterval(window.__vqt);window.__vqt=null;}state.vocabQuiz=null;}
  if(r.page!=='blackbookquiz'){if(window.__bbqt){clearInterval(window.__bbqt);window.__bbqt=null;}state.blackbookQuiz=null;}
  if(r.page!=='vocabflashcards')state.flashcards=null;
  if(r.page!=='topic'&&r.page!=='sub')state.editMode=false;
  state.page=r.page;
  state.trickSubject=r.trickSubject||null;
  state.quizSubject=r.quizSubject||null;
  state.quizTopic=r.quizTopic||null;
  state.quizSub=r.quizSub||null;
  state.revTab=r.revTab||'progress';
  state.subjectId=r.subjectId||null;
  state.groupId=r.groupId||null;
  state.topicId=r.topicId||null;
  state.subId=(r.page==='sub')?r.subId||null:null;
  state.subDetail=!!r.subDetail;
  if(newRoute&&r.page==='sub'&&r.subDetail)expandedQuestionLists.add(r.topicId+'|'+r.subId);
  if(pendingImportTarget){
    var imp=pendingImportTarget;pendingImportTarget=null;
    if(imp.subId)expandedQuestionLists.add(imp.tid+'|'+imp.subId);
    listPages.set(questionListKey(imp.sid,imp.tid,imp.subId),Math.floor(imp.firstIndex/QUESTIONS_PER_PAGE)+1);
  }
  if(r.page==='topic')state.tab=r.tab||'none';
  if(r.page==='vocabflashcards'){
    if(!state.flashcards||state.flashcards.subjectId!==r.subjectId||state.flashcards.filter!==(r.fcFilter||'all')){
      initVocabFlashcards(r.subjectId,r.fcFilter||'all');
    }
  }
  render();
  if(r.page==='topic'&&r.subId){
    var sec=document.getElementById('subsec-'+r.subId);
    if(sec&&sec.scrollIntoView)requestAnimationFrame(function(){if(sec.isConnected)sec.scrollIntoView({block:'start'});});
  }
  if(pendingSubjectScroll!==null){
    var y=pendingSubjectScroll;pendingSubjectScroll=null;
    requestAnimationFrame(function(){window.scrollTo({top:y,behavior:'instant'});});
  }
}
function goto(hash,skipHistory){
  hash=String(hash||'#/');
  if(hash.charAt(0)!=='#')hash='#'+hash;
  if(!skipHistory&&currentRouteHash&&currentRouteHash!==hash){
    routeStack.push(currentRouteHash);
    if(routeStack.length>60)routeStack.shift();
  }
  currentRouteHash=hash;
  try{if(location.hash!==hash)location.hash=hash;}catch(e){}
  var restoreScroll=pendingSubjectScroll!==null;
  route(hash);
  if(!restoreScroll)window.scrollTo(0,0);
}

  }

});

/* Initialize built-in sections and chapters before counts are shown, not on first visit. */
function ensureBuiltInStructure(){
  if(!structureDirty)return;
  var old={page:state.page,subjectId:state.subjectId,topicId:state.topicId,tab:state.tab};
  try{
    DB.subjects.forEach(function(subject){
      var name=String(subject.name||'').trim();
      if(/^blackbook$/i.test(name)){
        if(!Array.isArray(subject.topics))subject.topics=[];
        var bbChanged=false;
        BLACKBOOK_CHAPTERS.forEach(function(ch){
          if(!subject.topics.some(function(t){return String(t.name||'').trim().toLowerCase()===ch.toLowerCase();})){
            subject.topics.push({id:uid(),name:ch,questions:[],subs:[],theory:[]});
            bbChanged=true;
          }
        });
        if(bbChanged)save();
        return;
      }
      var isMath=/^maths$/i.test(name),isReasoning=/^reasoning$/i.test(name),isGK=/^gk\s*[-/]\s*gs$/i.test(name);
      if(!isMath&&!isReasoning&&!isGK)return;
      state.page='subject';state.subjectId=subject.id;
      if((isMath&&(!subject.mathsSectionsInitialized||!subject.numberSystemInitialized))||
         (isReasoning&&!subject.reasoningSectionsInitialized)||(isGK&&!subject.gkCategoriesV2))viewSubject();
      subject.topics.forEach(function(topic){
        var key=String(topic.sectionKey||topic.name||'').trim().toLowerCase();
        var needed=(isMath&&((key==='arithmetic'&&!topic.arithmeticHindiChaptersV2)||(key==='advance'&&!topic.advanceChaptersInitialized)||(key==='number system'&&!topic.numberSystemChaptersInitialized)))||
          (isReasoning&&((key==='verbal'&&!topic.verbalChaptersInitialized)||(key==='non-verbal'&&!topic.nonVerbalChaptersInitialized)))||
          (isGK&&((key==='history'&&!topic.historyChaptersInitialized)||(key==='static'&&!topic.staticChaptersInitialized)));
        if(needed){state.page='topic';state.topicId=topic.id;state.tab='none';viewTopic();}
        if(isMath&&key==='arithmetic'){
          var pct=subsOf(topic).find(function(ch){return ch.name.trim()==='प्रतिशत';});
          if(pct&&!pct.percentageTypesV1){
            var types=[
              'टाइप 1: भिन्न और प्रतिशत का बेसिक रूपांतरण तथा तुलना',

              'टाइप 6: मूल्य और खपत आधारित प्रश्न (जब कुल खर्च स्थिर/अपरिवर्तित रहे)',
              'टाइप 7: मूल्य, खपत और खर्च आधारित प्रश्न (जब कुल खर्च में भी बदलाव हो)',

    var tMap=DEMO_TYPES[sn]||{};
    Object.keys(tMap).forEach(function(secName){
      var sec=(subj.topics||[]).find(function(t){return String(t.sectionKey||t.name||'').trim().toLowerCase()===secName.toLowerCase()||String(t.name||'').trim().toLowerCase()===secName.toLowerCase();});
      if(!sec)return;
      Object.keys(tMap[secName]).forEach(function(chName){
        var ch=subsOf(sec).find(function(sb){return String(sb.name||'').trim().toLowerCase()===chName.toLowerCase();});
        if(!ch||!Array.isArray(ch.types))return;
        var names=tMap[secName][chName].map(function(x){return x.toLowerCase();});
        ch.types=ch.types.filter(function(tp){
          if(names.indexOf(String(tp.name||'').trim().toLowerCase())<0)return true;
          return (tp.questions&&tp.questions.length>0)||theoryOf(tp).length>0;
        });
      });
    });
    /* Remove empty sample chapters */
    var cMap=DEMO_CHS[sn]||{};
    Object.keys(cMap).forEach(function(secName){
      var sec=(subj.topics||[]).find(function(t){return String(t.sectionKey||t.name||'').trim().toLowerCase()===secName.toLowerCase()||String(t.name||'').trim().toLowerCase()===secName.toLowerCase();});
      if(!sec||!Array.isArray(sec.subs))return;
      var cNames=cMap[secName].map(function(x){return x.toLowerCase();});
      sec.subs=sec.subs.filter(function(sb){
        if(cNames.indexOf(String(sb.name||'').trim().toLowerCase())<0)return true;
        return (sb.questions&&sb.questions.length>0)||(sb.types&&sb.types.length>0)||theoryOf(sb).length>0;
      });
    });
    /* Remove empty sample sections */
    var sList=(DEMO_SECS[sn]||[]).map(function(x){return x.toLowerCase();});
    if(sList.length){
      subj.topics=(subj.topics||[]).filter(function(t){
        if(sList.indexOf(String(t.name||'').trim().toLowerCase())<0)return true;
        return (t.questions&&t.questions.length>0)||subsOf(t).length>0||theoryOf(t).length>0;
      });
    }
  });
  /* Remove the 2 sample Vocab groups & their 24 sample words (keeping any user-added words!) */
  var vocabSubj=DB.subjects.find(function(s){return isVocabSubject(s);});
  var vWordSet=new Set(DEMO_VWORDS.map(function(w){return w.toLowerCase();}));
  var vGroupSet=new Set(DEMO_VGROUPS.map(function(g){return g.toLowerCase();}));
  if(vocabSubj&&Array.isArray(vocabSubj.vocabGroups)){
    vocabSubj.vocabGroups.forEach(function(g){
      if(vGroupSet.has(String(g.name||'').trim().toLowerCase())&&Array.isArray(g.words)){
        g.words=g.words.filter(function(w){return !vWordSet.has(String(w&&w.word||'').trim().toLowerCase());});
      }
    });
    vocabSubj.vocabGroups=vocabSubj.vocabGroups.filter(function(g){
      if(!vGroupSet.has(String(g.name||'').trim().toLowerCase()))return true;
      return Array.isArray(g.words)&&g.words.length>0;
    });
  }
  /* Also clean any sample questions/vocab that landed in Mistakes or Bookmarks during testing */
  ensureStudyData();
  DB.mistakes=(DB.mistakes||[]).filter(function(m){return !isDemoQ(m,allDemoQKeys);});
  DB.bookmarks.questions=(DB.bookmarks.questions||[]).filter(function(b){return !isDemoQ(b,allDemoQKeys);});
  DB.bookmarks.vocab=(DB.bookmarks.vocab||[]).filter(function(b){return !vWordSet.has(String(b&&b.word||'').trim().toLowerCase());});
  delete DB.demoSamplePackV1;
  delete DB.demoVocabGroup2V1;
  save();
}

function subjectStructureCounts(s){
  var names=[];
  if(/^maths$/i.test(s.name.trim()))names=['arithmetic','advance','number system'];
  else if(/^reasoning$/i.test(s.name.trim()))names=['verbal','non-verbal'];
  else if(/^gk\s*[-/]\s*gs$/i.test(s.name.trim()))names=['static','history','polity','geography','economics','physics','chemistry','biology','computer','current affairs'];
  var sections=(s.topics||[]).filter(function(t){return !names.length||t.customSection||names.indexOf(t.sectionKey||t.name.trim().toLowerCase())>=0;});
  var chapters=0,types=0;
  sections.forEach(function(t){subsOf(t).forEach(function(ch){chapters++;types+=(ch.types||[]).length;});});
  return {sections:sections.length,chapters:chapters,types:types};
}
function subjCard(s,i){

function trickSubjects(){
  var presets=[
    {id:'maths',name:'Maths',icon:'➗',color:'#0F7A6B',aliases:['maths','math','mathematics','गणित']},
    {id:'reasoning',name:'Reasoning',icon:'🧩',color:'#B4560A',aliases:['reasoning','रीजनिंग']},
    {id:'gk-gs',name:'GK-GS',icon:'🌍',color:'#3F45A8',aliases:['gk-gs','gkgs','gk','gs','general knowledge','सामान्य ज्ञान']},
    {id:'english',name:'English',icon:'🔤',color:'#A32247',aliases:['english','अंग्रेजी','अंग्रेज़ी']},
    {id:'vocab',name:'Vocab',icon:'📖',color:'#5B7A18',aliases:['vocab','vocabulary','शब्दावली']},
    {id:'blackbook',name:'Blackbook',icon:'📕',color:'#8A3FA0',aliases:['blackbook','black book']}
  ];
  var list=[],usedIds={},usedNames={};
  function normKey(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,' ');}
  presets.forEach(function(p){
    var match=(DB.subjects||[]).find(function(s){
      var n=normKey(s.name);
      return p.aliases.indexOf(n)>-1;
    });
    var item={
      id:p.id,
      name:match?match.name:p.name,
      icon:(match&&match.icon)?match.icon:p.icon,
      color:(match&&match.c)?match.c:p.color
    };
    list.push(item);
    usedIds[item.id]=true;
    p.aliases.forEach(function(a){usedNames[a]=true;});
    if(match)usedNames[normKey(match.name)]=true;
  });
  (DB.subjects||[]).forEach(function(s){
    var n=normKey(s.name);
    if(!n||usedNames[n])return;
    var baseId=slug(s.name)||('sub-'+s.id);
    if(usedIds[baseId])baseId='sub-'+s.id;
    usedIds[baseId]=true;
    usedNames[n]=true;
    list.push({
      id:baseId,
      name:s.name,
      icon:s.icon||'📘',
      color:s.c||subjColor(s)
    });
  });
  return list;
}
function copyTextToClipboard(text,onDone){
  function fallback(){
    try{
      var ta=document.createElement('textarea');
      ta.value=text;
      ta.setAttribute('readonly','');
      ta.style.position='fixed';
      ta.style.opacity='0';
      ta.style.left='-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok=document.execCommand&&document.execCommand('copy');
      ta.remove();
      onDone(!!ok);
    }catch(e){onDone(false);}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){onDone(true);},fallback);
  }else{fallback();}
}

function trickPrettyKey(key){
  var k=String(key||'').trim();
  var low=k.toLowerCase().replace(/[\s-]+/g,'_');
  var map={
    visual_cue:'Visual Cue (पहचान)',
    action_step:'Action Step (कैसे हल करें)',
    golden_rule:'Golden Rule',
    purpose:'Purpose',
    example:'Example',
    examples:'Examples',
    series:'Series',
    logic:'Logic',
    formula:'Formula',
    shortcut:'Shortcut',
    trick:'Trick',
    tip:'Tip',
    tips:'Tips',
    rule:'Rule',
    pattern:'Pattern',
    method:'Method',
    note:'Note',
    notes:'Notes',
    summary:'Summary',
    explanation:'Explanation',
    solution:'Solution',
    answer:'Answer',
    exception:'Exception',
    exceptions:'Exceptions'
  };
  if(map[low])return map[low];
  if(/[\u0900-\u097f]/.test(k))return k;
  return k.replace(/([a-z0-9])([A-Z])/g,'$1 $2').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim()
    .replace(/\b[a-z]/g,function(ch){return ch.toUpperCase();});
}
function trickValueToMD(val,indent){
  var pad=indent||'';
  if(val===null||val===undefined)return '';
  if(typeof val==='string'||typeof val==='number'||typeof val==='boolean')return String(val).trim();
  if(Array.isArray(val)){
    var rows=[];
    val.forEach(function(item){
      if(item===null||item===undefined)return;
      if(typeof item==='string'||typeof item==='number'||typeof item==='boolean'){
        var s=String(item).trim();
        if(s)rows.push(pad+'- '+s);
      }else if(typeof item==='object'){
        var sub=trickObjectToMD(item,pad+'  ');
        if(sub)rows.push(sub);
      }
    });
    return rows.join('\n');
  }
  if(typeof val==='object'){
    return trickObjectToMD(val,pad);
  }
  return '';
}
function trickObjectToMD(obj,indent){
  var pad=indent||'';
  var lines=[];
  Object.keys(obj).forEach(function(k){
    var v=obj[k];
    if(v===null||v===undefined||v==='')return;
    var label=trickPrettyKey(k);
    if(typeof v==='string'||typeof v==='number'||typeof v==='boolean'){
      var sv=String(v).trim();
      if(!sv)return;
      lines.push(pad+'- **'+label+':** '+sv);
    }else if(Array.isArray(v)){
      var arrMd=trickValueToMD(v,pad+'  ');
      if(arrMd)lines.push(pad+'- **'+label+':**\n'+arrMd);
    }else if(typeof v==='object'){
      var nested=trickObjectToMD(v,pad+'  ');
      if(nested)lines.push(pad+'- **'+label+':**\n'+nested);
    }
  });
  return lines.join('\n');
}
function trickStructuredItemToBody(item,skipKeys){
  var blocks=[];
  Object.keys(item).forEach(function(k){
    if(skipKeys[k])return;
    var v=item[k];
    if(v===null||v===undefined||v==='')return;
    var label=trickPrettyKey(k);
    if(typeof v==='string'||typeof v==='number'||typeof v==='boolean'){
      var sv=String(v).trim();
      if(!sv)return;
      blocks.push('**'+label+':** '+sv);
    }else if(Array.isArray(v)){
      var arrMd=trickValueToMD(v,'');
      if(arrMd)blocks.push('**'+label+':**\n'+arrMd);
    }else if(typeof v==='object'){
      var objMd=trickObjectToMD(v,'');
      if(objMd)blocks.push('**'+label+':**\n'+objMd);
    }
  });
  return blocks.join('\n\n');
}
function parseTrickJSONText(raw){
  var cleaned=String(raw||'').trim();
  if(!cleaned)throw new Error('JSON खाली है।');
  var fence=cleaned.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
  if(fence)cleaned=fence[1].trim();
  try{return JSON.parse(cleaned);}catch(e1){
    var firstObj=cleaned.indexOf('{'), lastObj=cleaned.lastIndexOf('}');
    var firstArr=cleaned.indexOf('['), lastArr=cleaned.lastIndexOf(']');
    var cand=null;
    if(firstObj>=0&&lastObj>firstObj&&(firstArr<0||firstObj<firstArr))cand=cleaned.slice(firstObj,lastObj+1);
    else if(firstArr>=0&&lastArr>firstArr)cand=cleaned.slice(firstArr,lastArr+1);
    if(cand){try{return JSON.parse(cand);}catch(e2){}}
    throw e1;
  }
}
function trickSectionFingerprint(sec){
  if(!sec||typeof sec!=='object')return '';
  var t=String(sec.title||'').trim().toLowerCase();
  if(Array.isArray(sec.entries)&&sec.entries.length){
    var parts=sec.entries.map(function(e){return String(e.title||'').trim().toLowerCase()+'\u0002'+String(e.body||'').trim().toLowerCase();});
    return 'G\u0001'+t+'\u0001'+String(sec.overview||'').trim().toLowerCase()+'\u0001'+parts.join('\u0003');
  }
  return 'S\u0001'+t+'\u0001'+String(sec.body||'').trim().toLowerCase();
}
function importTricks(subjectId,raw,customSectionName,fallbackSectionName){
  var obj=parseTrickJSONText(raw);
  var TITLE_KEYS=['title','name','heading','topic','concept','rule','pattern','term','शीर्षक','नाम'];
  var BODY_KEYS=['body','content','note','trick','text','description','details','ट्रिक','नोट','विवरण'];
  var LIST_KEYS=['tricks','items','notes','concepts','rules','formulas','shortcuts','tips','points','patterns','methods','steps','flashcards','cards','sections','topics','data'];

  function extractEntry(t,idx){
    if(typeof t==='string'&&t.trim()){
      return {title:'Trick '+(idx+1),body:t.trim()};
    }
    if(!t||typeof t!=='object'||Array.isArray(t))return null;
    var titleKey=null, rawTitle='';
    for(var ti=0;ti<TITLE_KEYS.length;ti++){
      if(typeof t[TITLE_KEYS[ti]]==='string'&&t[TITLE_KEYS[ti]].trim()){
        titleKey=TITLE_KEYS[ti];rawTitle=t[titleKey].trim();break;
      }
    }
    var bodyKey=null, rawBody=null;
    for(var bi=0;bi<BODY_KEYS.length;bi++){
      var bk=BODY_KEYS[bi];
      if(t[bk]!==undefined&&t[bk]!==null&&t[bk]!==''){
        bodyKey=bk;rawBody=t[bk];break;
      }
    }
    var skip={id:true,_id:true,index:true,order:true};
    if(titleKey)skip[titleKey]=true;
    var extraKeys=Object.keys(t).filter(function(k){return !skip[k]&&k!==bodyKey;});
    var bodyText='';
    if(bodyKey&&!extraKeys.length){
      bodyText=Array.isArray(rawBody)?trickValueToMD(rawBody,''):(typeof rawBody==='object'?trickObjectToMD(rawBody,''):String(rawBody).trim());
    }else{
      bodyText=trickStructuredItemToBody(t,skip);
    }
    if(!bodyText)return null;
    return {title:rawTitle||('Trick '+(idx+1)),body:bodyText};
  }

  var sectionTitle=String(customSectionName||'').trim();
  var subtitle='';
  var overview='';
  var entries=[];

  if(Array.isArray(obj)){
    obj.forEach(function(item,idx){
      var en=extractEntry(item,idx);
      if(en)entries.push(en);
    });
  }else if(obj&&typeof obj==='object'){
    var listKey=null;
    for(var li=0;li<LIST_KEYS.length;li++){
      if(Array.isArray(obj[LIST_KEYS[li]])&&obj[LIST_KEYS[li]].length){listKey=LIST_KEYS[li];break;}
    }
    if(!listKey){
      var allKeys=Object.keys(obj);
      for(var ak=0;ak<allKeys.length;ak++){
        if(Array.isArray(obj[allKeys[ak]])&&obj[allKeys[ak]].length){listKey=allKeys[ak];break;}
      }
    }
    if(listKey){
      if(!sectionTitle){
        sectionTitle=String(obj.topic||obj.title||obj.chapter||obj.name||'').trim();
      }
      if(typeof obj.purpose==='string'&&obj.purpose.trim())subtitle=obj.purpose.trim();
      else if(typeof obj.subtitle==='string'&&obj.subtitle.trim())subtitle=obj.subtitle.trim();
      var metaSkip={subject:true,topic:true,title:true,chapter:true,name:true,purpose:true,subtitle:true,id:true,_id:true};
      metaSkip[listKey]=true;
      overview=trickStructuredItemToBody(obj,metaSkip);
      obj[listKey].forEach(function(item,idx){
        var en=extractEntry(item,idx);
        if(en)entries.push(en);
      });
    }else{
      var single=extractEntry(obj,0);
      if(single)entries.push(single);
      if(!sectionTitle)sectionTitle=String(obj.topic||obj.title||obj.chapter||obj.name||(single&&single.title)||'').trim();
    }
  }

  if(!entries.length&&!overview)throw new Error('JSON में कोई valid trick या note नहीं मिला।');
  if(!DB.tricks)DB.tricks={};
  if(!DB.tricks[subjectId])DB.tricks[subjectId]={items:[]};

  var existing=DB.tricks[subjectId].items;
  if(!sectionTitle){
    if(fallbackSectionName&&String(fallbackSectionName).trim())sectionTitle=String(fallbackSectionName).trim();
    else if(entries.length===1)sectionTitle=entries[0].title;
    else{
      var subjObj=trickSubjects().find(function(x){return x.id===subjectId;});
      var baseName=(subjObj?subjObj.name:'Tricks')+' — Set '+(existing.length+1);
      sectionTitle=baseName;
    }
  }

  var newSection;
  if(entries.length===1&&!overview&&!subtitle&&entries[0].title===sectionTitle){
    newSection={id:uid(),title:sectionTitle,body:entries[0].body};
  }else{
    newSection={id:uid(),title:sectionTitle,entries:entries};
    if(subtitle)newSection.subtitle=subtitle;
    if(overview)newSection.overview=overview;
  }

  var fp=trickSectionFingerprint(newSection);
  var isDup=existing.some(function(it){return trickSectionFingerprint(it)===fp;});
  if(isDup){
    return {added:0,duplicates:1,itemCount:entries.length||1,sectionTitle:sectionTitle};
  }
  existing.push(newSection);
  save();
  return {added:1,duplicates:0,itemCount:entries.length||1,sectionTitle:sectionTitle};
}

function vocabRowsFromJSON(data){
  var WORD_KEYS=['word','english','englishword','term','vocab','name','शब्द','अंग्रेजी','अंग्रेजीशब्द','अंग्रेज़ी','अंग्रेज़ीशब्द','इंग्लिश','इंग्लिशशब्द'];
  var MEANING_KEYS=['meaning','hindi','hindimeaning','meaninginhindi','translation','definition','arth','hindiarth','अर्थ','हिंदी','हिंदीअर्थ','हिन्दी','हिन्दीअर्थ','मतलब'];
  function find(obj,names){
    if(!obj||typeof obj!=='object'||Array.isArray(obj))return '';
    var normalized={};
    Object.keys(obj).forEach(function(k){
      normalized[k.toLowerCase().replace(/[^a-z\u0900-\u097f]/g,'')]=obj[k];
    });
    for(var j=0;j<names.length;j++){
      var value=normalized[names[j]];
      if(value!==undefined&&value!==null){
        var str=Array.isArray(value)?value.map(function(v){return String(v||'').trim();}).filter(Boolean).join(', '):String(value).trim();
        if(str)return str;
      }
    }
    return '';
  }
  var rows=null, keys=['words','vocabWords','vocabulary','vocab','items','data'];
  if(Array.isArray(data))rows=data;
  else if(data&&typeof data==='object'){
    /* Single word object like {"word":"Apple","meaning":"सेब"} */
    var singleW=find(data,WORD_KEYS), singleM=find(data,MEANING_KEYS);
    if(singleW&&singleM)return [{word:singleW,meaning:singleM}];
    for(var i=0;i<keys.length;i++){
      if(data[keys[i]]!==undefined){
        if(Array.isArray(data[keys[i]])){rows=data[keys[i]];break;}
        if(data[keys[i]]&&typeof data[keys[i]]==='object'){
          var nested=data[keys[i]];
          if(Array.isArray(nested.words)){rows=nested.words;break;}
          var mapRows=[];
          Object.keys(nested).forEach(function(k){if(typeof nested[k]==='string'&&nested[k].trim())mapRows.push({word:k,meaning:nested[k]});});
          if(mapRows.length){rows=mapRows;break;}
        }
      }
    }
    if(!rows){
      rows=[];Object.keys(data).forEach(function(k){if(typeof data[k]==='string'&&data[k].trim())rows.push({word:k,meaning:data[k]});});
    }
  }
  if(!Array.isArray(rows))return [];
  return rows.map(function(row){
    if(Array.isArray(row))return {word:String(row[0]||'').trim(),meaning:String(row[1]||'').trim()};
    if(!row||typeof row!=='object')return {word:'',meaning:''};
    return {word:find(row,WORD_KEYS),meaning:find(row,MEANING_KEYS)};
  }).filter(function(row){return row.word&&row.meaning;});
}
function vocabGroupsOf(s){return Array.isArray(s&&s.vocabGroups)?s.vocabGroups:[];}
function vocabWordCount(s){
  var count=Array.isArray(s&&s.vocabWords)?s.vocabWords.length:0;
  vocabGroupsOf(s).forEach(function(g){count+=(Array.isArray(g.words)?g.words.length:0);});
  return count;
}
function allVocabEntries(s){
  var out=[];
  (Array.isArray(s&&s.vocabWords)?s.vocabWords:[]).forEach(function(w){out.push(w);});
  vocabGroupsOf(s).forEach(function(g){(Array.isArray(g.words)?g.words:[]).forEach(function(w){out.push(w);});});
  return out;
}
function findVocabEntry(s,id){
  var found=(Array.isArray(s&&s.vocabWords)?s.vocabWords:[]).find(function(w){return w.id===id;});
  if(found)return found;
  for(var i=0;i<vocabGroupsOf(s).length;i++){found=(vocabGroupsOf(s)[i].words||[]).find(function(w){return w.id===id;});if(found)return found;}
  return null;
}
function removeVocabEntry(s,id){
  if(Array.isArray(s.vocabWords)){var i=s.vocabWords.findIndex(function(w){return w.id===id;});if(i>=0){s.vocabWords.splice(i,1);return true;}}
  var groups=vocabGroupsOf(s);
  for(var j=0;j<groups.length;j++){
    var list=groups[j].words||[],k=list.findIndex(function(w){return w.id===id;});
    if(k>=0){
      list.splice(k,1);
      if(!list.length)s.vocabGroups.splice(j,1);
      return true;
    }
  }
  return false;
}
function uniqueVocabGroupName(s,base){
  var name=base,suffix=2;
  while(vocabGroupsOf(s).some(function(g){return (g.words&&g.words.length)&&String(g.name||'').toLowerCase()===name.toLowerCase();})){
    name=base+' ('+suffix+')';suffix++;
  }
  return name;
}
function addVocabBatch(s,rows,label){
  if(!Array.isArray(s.vocabWords))s.vocabWords=[];
  if(!Array.isArray(s.vocabGroups))s.vocabGroups=[];
  /* Prune any legacy empty groups before checking duplicate names */
  s.vocabGroups=s.vocabGroups.filter(function(g){return Array.isArray(g.words)&&g.words.length;});
  var seen={};allVocabEntries(s).forEach(function(w){seen[String(w.word||'').trim().toLowerCase()]=true;});
  var accepted=[],duplicates=0;
  rows.forEach(function(item){var key=String(item.word||'').trim().toLowerCase();if(!key||seen[key]){duplicates++;return;}seen[key]=true;accepted.push({id:uid(),word:String(item.word).trim(),meaning:String(item.meaning).trim()});});
  if(!accepted.length)return {added:0,duplicates:duplicates};
  /* Keep previously added manual words together as their own uniquely named section before batch import. */
  if(s.vocabWords.length){
    var legacyName=uniqueVocabGroupName(s,'पहले से जोड़े गए Words');
    s.vocabGroups.unshift({id:uid(),name:legacyName,kind:'legacy',words:s.vocabWords.slice()});
    s.vocabWords=[];
  }
  var n=s.vocabGroups.filter(function(g){return g.kind==='import';}).length+1;
  var base=String(label||('JSON Import '+n)).trim().replace(/\.json$/i,'')||('JSON Import '+n);
  var name=uniqueVocabGroupName(s,base);
  s.vocabGroups.push({id:uid(),name:name,kind:'import',words:accepted});
  return {added:accepted.length,duplicates:duplicates,section:name};
}

function vocabGroupList(s){
  var groups=[];
  if(Array.isArray(s.vocabWords)&&s.vocabWords.length)groups.push({id:'manual',name:'मेरे जोड़े हुए Words',kind:'manual',words:s.vocabWords});

function getVocabGroup(s,gid){
  if(!s)return null;
  if(gid==='manual')return (Array.isArray(s.vocabWords)&&s.vocabWords.length)?{id:'manual',name:'मेरे जोड़े हुए Words',kind:'manual',words:s.vocabWords}:null;
  return vocabGroupsOf(s).find(function(g){return g.id===gid;})||null;
}
var vocabSearchCache=new WeakMap();
function vocabMatches(entry,q){
  var word=String(entry.word||''), meaning=String(entry.meaning||''), memo=vocabSearchCache.get(entry);
  if(!memo||memo.word!==word||memo.meaning!==meaning){
    memo={word:word,meaning:meaning,wordKey:word.toLowerCase(),meaningKey:meaning.toLowerCase()};
    vocabSearchCache.set(entry,memo);
  }
  return memo.wordKey.includes(q)||memo.meaningKey.includes(q);
}

function openVocabEditModal(sid,wid){
  var es=getSubject(sid),entry=es&&findVocabEntry(es,wid);
  if(!entry)return;
  openModal('<div class="mhead"><h3>✏️ शब्द बदलें</h3><button class="mini" data-act="close-modal" aria-label="बंद करें">✕</button></div>'
    +'<div class="mbody">'
      +'<div class="field"><label for="editVocabWord">Word (English)</label><input class="inp" id="editVocabWord" maxlength="120" value="'+esc(entry.word)+'"></div>'
      +'<div class="field"><label for="editVocabMeaning">हिंदी अर्थ</label><input class="inp" id="editVocabMeaning" maxlength="240" value="'+esc(entry.meaning)+'"></div>'
    +'</div>'
    +'<div class="mfoot"><button class="btn ghost" data-act="close-modal">Cancel</button><button class="btn primary" id="saveVocabEdit">Save changes</button></div>');
  var wi=document.getElementById('editVocabWord'),mi=document.getElementById('editVocabMeaning');
  setTimeout(function(){wi.focus();wi.select();},60);
  function commit(){
    var nw=wi.value.trim(),nm=mi.value.trim();
    if(!nw||!nm){toast('Word और अर्थ खाली नहीं हो सकते',true);return;}
    var dup=allVocabEntries(es).some(function(x){return x.id!==entry.id&&String(x.word||'').trim().toLowerCase()===nw.toLowerCase();});
    if(dup){toast('यह शब्द पहले से सूची में मौजूद है',true);wi.focus();return;}
    entry.word=nw;entry.meaning=nm;save();closeModal();render();toast('शब्द अपडेट हो गया ✅');
  }
  document.getElementById('saveVocabEdit').onclick=commit;
  wi.addEventListener('keydown',function(e){if(e.key==='Enter')commit();});
  mi.addEventListener('keydown',function(e){if(e.key==='Enter')commit();});
}

function vocabFlashcardPool(s,filter){
  if(!s)return [];
  if(filter==='starred'){
    ensureStudyData();
    return DB.bookmarks.vocab.map(function(w){return {id:w.id,word:w.word,meaning:w.meaning};});
  }
  if(!filter||filter==='all')return allVocabEntries(s).map(function(w){return {id:w.id,word:w.word,meaning:w.meaning};});
  var grp=getVocabGroup(s,filter);
  return grp?grp.words.map(function(w){return {id:w.id,word:w.word,meaning:w.meaning};}):allVocabEntries(s).map(function(w){return {id:w.id,word:w.word,meaning:w.meaning};});
}
function initVocabFlashcards(sid,filter,dir){
  var s=getSubject(sid)||findVocabSubject();
  var pool=vocabFlashcardPool(s,filter||'all');
  state.flashcards={
    subjectId:s?s.id:(sid||''),
    filter:filter||'all',
    dir:dir||'en-hi',
    deck:shuffle(pool),
    totalInitial:pool.length,
    mastered:0,
    repeated:0,
    flipped:false,
    done:!pool.length
  };
}

function openVocabQuizConfig(sid){
  var ch=getRouteHash();if(/^#\/quiz/.test(ch))state.quizFrom=ch;else if(!/^#\/(vocab|blackbook)-quiz/.test(ch))state.quizFrom='';
  var subject=getSubject(sid),allEntries=subject?allVocabEntries(subject):[];
  if(!allEntries.length){toast('Quiz शुरू करने से पहले Vocab में words जोड़ें',true);return;}
  var groups=vocabGroupList(subject);
  var groupOpts='<option value="__all__">सभी Groups ('+allEntries.length+' words)</option>';
  groups.forEach(function(g){groupOpts+='<option value="'+esc(g.id)+'">'+esc(g.name)+' ('+g.words.length+' words)</option>';});
  var max=allEntries.length,initial=Math.min(10,max);
  var html='<div class="mhead"><h3>📝 Vocabulary Quiz सेट करें</h3><button class="mini" data-act="close-modal">✕</button></div>'
    +'<div class="mbody">'
    +(groups.length>1?'<div class="field"><label for="vocabQuizGroup">Word Group चुनें</label><select class="inp" id="vocabQuizGroup">'+groupOpts+'</select></div>':'')
    +'<p class="p-sec" id="vocabQuizAvail" style="margin-bottom:16px">कुल '+max+' words उपलब्ध हैं। कितने सवाल और कितना समय चाहिए, चुनें।</p>'
    +'<div class="field"><label for="vocabQuizCount">Number of questions</label><input class="inp" id="vocabQuizCount" type="number" min="1" max="'+max+'" value="'+initial+'"></div>'
    +'<div class="field"><label>Time limit</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label for="vocabQuizMinutes">Minutes</label><input class="inp" id="vocabQuizMinutes" type="number" min="0" max="180" value="5"></div><div><label for="vocabQuizSeconds">Seconds</label><input class="inp" id="vocabQuizSeconds" type="number" min="0" max="59" value="0"></div></div></div>'
    +'<p class="vocab-count">हर सवाल में English word देखकर सही हिंदी meaning चुनें। समय मिनट और सेकंड में सेट करें।</p></div>'
    +'<div class="mfoot"><button class="btn ghost" data-act="close-modal">Cancel</button><button class="btn primary" id="startVocabQuiz">Quiz शुरू करें</button></div>';
  openModal(html);
  var gSel=document.getElementById('vocabQuizGroup'),cntInp=document.getElementById('vocabQuizCount'),availEl=document.getElementById('vocabQuizAvail');
  function activeEntries(){
    if(!gSel||gSel.value==='__all__')return allEntries;
    var g=getVocabGroup(subject,gSel.value);
    return g&&Array.isArray(g.words)?g.words:allEntries;
  }
  if(gSel){
    gSel.addEventListener('change',function(){
      var cur=activeEntries(),m=cur.length;
      cntInp.max=Math.max(1,m);
      cntInp.value=String(Math.min(Math.max(1,parseInt(cntInp.value,10)||10),Math.max(1,m)));
      if(availEl)availEl.textContent='कुल '+m+' words उपलब्ध हैं। कितने सवाल और कितना समय चाहिए, चुनें।';
    });
  }
  document.getElementById('startVocabQuiz').onclick=function(){
    var entries=activeEntries(),curMax=entries.length;
    var count=parseInt(cntInp.value,10);
    var mRaw=document.getElementById('vocabQuizMinutes').value.trim(),sRaw=document.getElementById('vocabQuizSeconds').value.trim();
    var minutes=mRaw===''?0:parseInt(mRaw,10);
    var seconds=sRaw===''?0:parseInt(sRaw,10);
    var duration=minutes*60+seconds;
    if(!curMax){toast('इस group में words नहीं हैं',true);return;}
    if(!Number.isFinite(count)||count<1||count>curMax){toast('Questions की संख्या 1 से '+curMax+' के बीच रखें',true);return;}
    if(!Number.isFinite(minutes)||minutes<0||minutes>180||!Number.isFinite(seconds)||seconds<0||seconds>59||duration<1){toast('समय 1 सेकंड से 180 मिनट तक रखें',true);return;}
    var chosen=sampleItems(entries,count);
    var allMeanings=[], meaningIndex=new Map();
    allEntries.forEach(function(entry){
      var meaning=String(entry.meaning||'').trim();
      if(meaning&&!meaningIndex.has(meaning)){meaningIndex.set(meaning,allMeanings.length);allMeanings.push(meaning);}
    });
    var questions=chosen.map(function(entry){
      var right=String(entry.meaning||'').trim();
      var wrong=sampleItems(allMeanings,3,meaningIndex.get(right));
      var options=shuffle([right].concat(wrong));
      return {word:entry.word,meaning:right,options:options,correct:options.indexOf(right),selected:null};
    });
    listPages.delete('vocab-quiz-review');
    state.vocabQuiz={from:state.quizFrom||'',subjectId:sid,questions:questions,idx:0,score:0,right:0,wrong:0,skipped:0,showMistakes:false,secondsLeft:duration,totalSeconds:duration,phase:'play',selected:null};
    closeModal();goto('#/vocab-quiz/'+encodeURIComponent(sid));
    if(window.__vqt)clearInterval(window.__vqt);
    window.__vqt=setInterval(function(){
      var z=state.vocabQuiz;
      if(!z||z.phase!=='play'||state.page!=='vocabquiz'){clearInterval(window.__vqt);window.__vqt=null;return;}
      z.secondsLeft=Math.max(0,z.secondsLeft-1);

      if(z.secondsLeft<=0){finishVocabQuiz(true);render();}
    },1000);
  };
}
function vocabTimeLabel(seconds){var m=Math.floor(Math.max(0,seconds)/60),ss=Math.max(0,seconds)%60;return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');}
function updateVocabQuizChoiceUI(){

function finishVocabQuiz(timeout){
  var z=state.vocabQuiz;if(!z||z.phase==='done')return;
  z.timedOut=!!timeout;z.elapsed=z.totalSeconds-z.secondsLeft;
  z.questions.forEach(function(q){
    if(q.result)return;
    q.result=(q.selected===null||q.selected<0)?'skip':(q.selected===q.correct?'right':'wrong');
  });
  z.right=z.questions.filter(function(q){return q.result==='right';}).length;
  z.wrong=z.questions.filter(function(q){return q.result==='wrong';}).length;
  z.skipped=z.questions.filter(function(q){return q.result==='skip';}).length;
  z.score=z.right;z.phase='done';z.showMistakes=false;
  if(window.__vqt){clearInterval(window.__vqt);window.__vqt=null;}
  recordQuizSession({mode:'vocab',label:'Vocab Quiz',subjectId:z.subjectId,subjectName:'Vocab',right:z.right,wrong:z.wrong,skipped:z.skipped,total:z.questions.length,elapsed:z.elapsed||0});
  if(!z.celebrated){z.celebrated=true;confetti(24);}
}

var BLACKBOOK_CHAPTERS=['Antonyms','Synonyms','OWS - One words substitution','Idioms & Phrases','Mis-spelt words'];
function blackbookChapters(subject){
  if(!subject)return [];
  var list=[];
  BLACKBOOK_CHAPTERS.forEach(function(name){
    var found=(subject.topics||[]).find(function(t){return String(t.name||'').trim().toLowerCase()===name.toLowerCase();});
    if(found)list.push(found);
  });
  (subject.topics||[]).forEach(function(t){
    if(list.indexOf(t)<0)list.push(t);
  });
  return list;
}
function blackbookQuestionPool(subject,mode){
  var chapters=blackbookChapters(subject),pool=[];
  chapters.forEach(function(topic){
    if(!topic)return;
    topicAllQ(topic).forEach(function(q){
      if(mode==='__new__'&&!q.createdAt)return;
      if(!Array.isArray(q.options)||q.options.length<2)return;
      pool.push({id:q.id||'',question:q.question,options:q.options.slice(),correct:Number(q.correct)||0,explanation:q.explanation||'',chapter:topic.name,topicId:topic.id,selected:null,result:null});
    });
  });
  if(mode!=='__new__'&&mode!=='__all__')pool=pool.filter(function(q){return String(q.chapter||'').trim().toLowerCase()===String(mode||'').trim().toLowerCase();});
  if(mode==='__all__'||mode==='__new__'){
    var seenBB=new Set();
    pool=pool.filter(function(q){var k=questionDedupKey(q);if(!k)return true;if(seenBB.has(k))return false;seenBB.add(k);return true;});
  }
  return pool;
}

  if(/^gk\s*[-/]\s*gs$/i.test(s.name.trim())&&!s.gkCategoriesV2){
    ['Static','History','Polity','Geography','Economics','Physics','Chemistry','Biology','Computer','Current Affairs'].forEach(function(name){

        s.topics.push({id:uid(),name:name,questions:[],subs:[],theory:[]});
    });
    s.gkCategoriesV2=true;save();
  }
  /* Maths ke dono sections ek baar add karein; existing topics safe rahenge. */
  if(/^maths$/i.test(s.name.trim())&&!s.mathsSectionsInitialized){
    ['Arithmetic','Advance'].forEach(function(name){
      if(!s.topics.some(function(t){return t.name.trim().toLowerCase()===name.toLowerCase();}))
        s.topics.push({id:uid(),name:name,questions:[],subs:[],theory:[]});
    });

  }
  if(/^maths$/i.test(s.name.trim())&&!s.numberSystemInitialized){
    if(!s.topics.some(function(t){return t.sectionKey==='number system'||t.name.trim().toLowerCase()==='number system';}))

  }

    ['Verbal','Non-verbal'].forEach(function(name){
      if(!s.topics.some(function(t){return t.name.trim().toLowerCase()===name.toLowerCase();}))
        s.topics.push({id:uid(),name:name,questions:[],subs:[],theory:[]});
    });

  if(Array.isArray(s.sectionOrder)){sections.sort(function(a,b){var ai=s.sectionOrder.indexOf(a.id),bi=s.sectionOrder.indexOf(b.id);return (ai<0?1e6:ai)-(bi<0?1e6:bi);});}

        h+='<button class="opt'+(isC?' correct':'')+'" data-act="set-correct" data-sid="'+sid+'" data-tid="'+tid+'"'+sub+' data-qid="'+q.id+'" data-oi="'+oi+'">'

          +'<span class="mark">'+(isC?'✓':'↺')+'</span></button>';
      }else{
        h+='<div class="opt'+(isC&&!hideAnswers?' correct':'')+'"'+(isC&&hideAnswers?' data-c="1"':'')+'><span class="key">'+LETTERS[oi]+'</span>'
          +'<span class="lbl">'+esc(o)+'</span><span class="mark">'+(isC?'✓':'')+'</span></div>';
      }
    });
    h+='</div>';
    if(hideAnswers)h+='<button class="see-ans" type="button" data-act="see-answer" aria-expanded="false"><span class="sa-show">👁 See answer</span><span class="sa-hide">🙈 Hide answer</span></button>';
    if(q.explanation&&(!hideAnswers))h+='<p class="explain"><b>💡 Explanation:</b> '+esc(q.explanation)+'</p>';
    else if(q.explanation&&hideAnswers)h+='<p class="explain ans-only"><b>💡 Explanation:</b> '+esc(q.explanation)+'</p>';
    h+='</article>';
  });
    return h+'</div>';
  });
}

        +'</div></div>';
    });
    h+='</div>';

  /* Default topic view: no hidden-questions message. */

  /* ---------- topic ke seedhe questions ---------- */
  h+='<div class="sec-head" style="margin-top:34px"><h2 class="h-sec" style="font-size:18px">'+(subs.length?'Topic के सीधे Questions':'Questions')+'</h2>'
    +'<span class="chip on" style="pointer-events:none">'+(t.questions||[]).length+' total</span></div>';

  if(!(t.questions||[]).length){

      h+='<div class="subnone" style="margin-bottom:6px">Topic level पर कोई question नहीं — सारे questions subtopics के अंदर हैं।</div>';

        '<button class="btn primary" data-act="add-q" data-sid="'+s.id+'" data-tid="'+t.id+'">＋ Add Question</button>'

    }
  }else{
    h+=qListHTML(s.id,t.id,t.questions,null,s);

  opt=opt||{};
  var secs=theoryOf(box);
  var words=theoryWords(secs);
  var href='#/topic/'+s.id+'/'+t.id+'/theory'+(subId?'/'+subId:'');
  var h='<div class="tbox'+(opt.mini?' mini-mode':'')+'" style="'+tintStyle(s)+'">';
  if(opt.mini){
    h+='<div class="tbox-head" style="margin-bottom:8px"><span class="tico">📖</span>'
      +'<div class="growwrap"><h2 style="font-size:15.5px">Theory</h2>'

      +'<div class="tacts">'
        +'<button class="btn ghost sm" data-act="theory-import" data-sid="'+s.id+'" data-tid="'+t.id+'" data-sub="'+(subId||'')+'">⬆ Import</button>'
        +'<a class="btn ghost sm" href="'+href+'">पूरी पढ़ें →</a>'
      +'</div></div>';
    h+=tSecList(s,t,subId,box,secs,true);
    return h+'</div>';
  }
  h+='<div class="tbox-head"><span class="tico">📖</span>'
    +'<div class="growwrap"><h2>'+(subId?'Subtopic की Theory':'इस Topic की Theory')+'</h2>'
    +'<p class="tmeta2">'+(secs.length?secs.length+' sections · '+words+' words · पढ़ने में ~'+readMin(words)+' मिनट':'अभी कोई theory नहीं — text/Markdown/JSON से import करें')+'</p></div>'

function tSecList(s,t,subId,box,secs,collapsedDefault){

function orderedSubjectSections(s){
  if(!s)return {sections:[],extras:[]};
  var sName=String(s.name||'').trim();
  var names=[];
  if(/^maths$/i.test(sName))names=['Arithmetic','Advance','Number System'];
  else if(/^reasoning$/i.test(sName))names=['Verbal','Non-verbal'];
  else if(/^gk\s*[-/]\s*gs$/i.test(sName))names=['Static','History','Polity','Geography','Economics','Physics','Chemistry','Biology','Computer','Current Affairs'];
  var sections=[];
  names.forEach(function(name){
    var topic=(s.topics||[]).find(function(t){return t.sectionKey===name.toLowerCase()||(!t.sectionKey&&String(t.name||'').trim().toLowerCase()===name.toLowerCase());});
    if(topic)sections.push(topic);
  });
  (s.topics||[]).forEach(function(t){
    if((!names.length||t.customSection)&&sections.indexOf(t)<0)sections.push(t);
  });
  if(Array.isArray(s.sectionOrder)){
    sections.sort(function(a,b){
      var ai=s.sectionOrder.indexOf(a.id), bi=s.sectionOrder.indexOf(b.id);
      return (ai<0?1e6:ai)-(bi<0?1e6:bi);
    });
  }
  var extras=(s.topics||[]).filter(function(t){return sections.indexOf(t)<0&&topicQuestionCount(t)>0;});
  return {sections:sections,extras:extras};
}

function runnerQuiz(){
  var z=state.quiz;
  var s=z.subjectId?getSubject(z.subjectId):null;
  var t=(z.subjectId&&z.topicId)?getTopic(z.subjectId,z.topicId):null;
  var backHref=z.backHref||((s&&t)?'#/topic/'+s.id+'/'+t.id:'#/quiz');
  var backLabel=z.backLabel||((s&&t)?esc(t.name):'Quiz');
  var h='<div class="wrap"><div class="runner">'
    +'<div class="crumbs"><button type="button" class="backbtn" data-act="runner-exit" data-kind="quiz" data-href="'+esc(backHref)+'">← Back: '+backLabel+'</button></div>';

  if(z.phase==='done'){
    var maxMarks=z.queue.length*MK_RIGHT;
    var marksPct=maxMarks?Math.max(0,Math.round(z.marks/maxMarks*100)):0;
    function makeReviewItem(q,i){
      var a=z.answers[i];
      var mk=(a===undefined||a<0)?0:(a===q.correct?MK_RIGHT:MK_WRONG);
      return {id:q.id,question:q.question,ok:a===q.correct,skipped:(a===undefined||a<0),
              correctText:q.options[q.correct],chosenText:(a>=0?a:null)!=null?q.options[a]:'छोड़ा हुआ',
              explanation:q.explanation,marks:mk};
    }
    if(!z.__confettiDone){z.__confettiDone=true;setTimeout(function(){if(marksPct>=60)confetti(80);},150);}
    return h+resultCard({
      stateObj:z,
      title:marksPct>=80?'ज़बरदस्त! 🏆':marksPct>=50?'अच्छा किया 🎯':'थोड़ा और अभ्यास चाहिए 📚',
      marks:z.marks,maxMarks:maxMarks,
      correct:z.correct,wrong:z.wrong,skipped:z.skipped,
      sub:'Time: '+z.elapsed+' sec',
      pct:marksPct,
      actions:'<button class="btn primary" data-act="retry-quiz">↻ Retry Quiz</button>'+(DB.mistakes.length?'<a class="btn soft" href="#/revision/mistakes">❌ Mistakes ('+DB.mistakes.length+')</a>':'')+'<button type="button" class="btn ghost" data-act="runner-exit" data-kind="quiz" data-href="'+esc(backHref)+'">← Back</button>',
      review:z.queue,makeReviewItem:makeReviewItem
    })+'</div></div>';
  }
  var q=z.queue[z.idx];
  h+='<div class="rbar"><span class="tt">Q '+(z.idx+1)+' / '+z.queue.length+'</span>'
    +'<span class="track"><i style="width:'+(z.idx/z.queue.length*100)+'%"></i></span>'
    +'<span class="tt marks" id="liveMarks">अंक '+fmtMarks(z.marks)+'</span>'
    +'<span class="tt" id="quizTimerWrap">⏱ <span id="quizTimerVal">'+fmtQuizTimer(z)+'</span></span></div>'
    +'<div class="qbox"><div class="qtag" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>Quiz · '+esc(z.label||(t?t.name:(s?s.name:'Mixed questions')))
      +' <span class="mkchip">+'+MK_RIGHT+' / '+MK_WRONG+'</span></span><button type="button" class="mini star-btn'+(isQBookmarked(q)?' on':'')+'" data-act="toggle-quiz-star" title="'+(isQBookmarked(q)?'Unstar':'Bookmark')+'">'+(isQBookmarked(q)?'★':'☆')+'</button></div>'
    +'<div class="qtitle">'+esc(q.question)+'</div>'+examDetailsHTML(q)+questionMediaHTML(q,(q._sid&&getSubject(q._sid))||s)+'<div class="opts">';
  q.options.forEach(function(o,oi){
    h+='<button class="opt'+(z.chosen===oi?' picked':'')+'" data-act="qpick" aria-pressed="'+(z.chosen===oi)+'" data-oi="'+oi+'">'
      +'<span class="key">'+LETTERS[oi]+'</span><span class="lbl">'+esc(o)+'</span>'
      +'<span class="mark">'+(z.chosen===oi?'●':'')+'</span></button>';
  });
  h+='</div></div><div class="rfoot">'
    +'<span class="hint" id="quizPickHint">'+(z.chosen>=0
        ?'Answer locked — Next दबाएँ'
        :'Option चुनें (1–'+q.options.length+' keys) · सही +'+MK_RIGHT+' · ग़लत '+MK_WRONG+' · छोड़ने पर 0')+'</span>'
    +'<span style="display:flex;gap:8px">'
    +'<button class="btn ghost" id="quizSkip" data-act="qnext" data-skip="1" '+(z.chosen<0?'':'hidden')+'>छोड़ें</button>'
    +'<button class="btn '+(z.chosen>=0?'primary':'ghost')+'" id="quizNext" data-act="qnext" '+(z.chosen<0?'disabled':'')+'>'
      +(z.idx===z.queue.length-1?'Finish 🏁':'Next →')+'</button></span>'
    +'</div></div></div>';
  return h;
}
function resultCard(o){
  var off=396-(396*o.pct/100);
  var celTarget=o.stateObj||o;
  if(o.pct>=80&&!celTarget.__celebrated){
    celTarget.__celebrated=true;
    setTimeout(function(){
      confettiBurst(window.innerWidth/2, Math.min(window.innerHeight*0.32,300), 46);
      if(o.pct>=95)toast('🏆 शानदार! '+o.pct+'% — AYUSH~PREP proud है!');
    },420);
  }
  var h='<div class="result"><div class="ring"><svg width="142" height="142" viewBox="0 0 142 142">'
    +'<circle class="bgc" cx="71" cy="71" r="63"/>'
    +'<circle class="fgc" cx="71" cy="71" r="63" style="--off:'+off+'"/></svg>'
    +'<div class="val">'+o.pct+'%<small>SCORE</small></div></div>'
    +'<h2>'+o.title+'</h2>'
    +(o.maxMarks!==undefined
      ? '<div class="mkrow">'
        +'<span class="mkbadge total">'+Math.round(o.marks*100)/100+' / '+o.maxMarks+' अंक</span>'
        +'<span class="mkbadge ok">✓ सही '+o.correct+' <b>'+fmtMarks(o.correct*MK_RIGHT)+'</b></span>'
        +'<span class="mkbadge no">✕ ग़लत '+o.wrong+' <b>'+fmtMarks(o.wrong*MK_WRONG)+'</b></span>'
        +'<span class="mkbadge skip">– छोड़े '+o.skipped+' <b>0</b></span>'
        +'</div>'
        +'<p class="sub" style="margin-top:8px">'+esc(o.sub)+' · '+o.pct+'% score</p>'
      : '<p class="sub">'+esc(o.sub)+'</p>')
    +'<div class="row-c">'+o.actions+'</div>';
  if(o.review&&o.review.length){
    h+=pageList('quiz-review',o.review,28,function(batch,offset){
      var h='<div class="review">';
      batch.forEach(function(r,i){
        i+=offset;
        if(o.makeReviewItem)r=o.makeReviewItem(r,i);
      var ok=r.ok!==undefined?r.ok:true;
      var cls=ok?'ok':(r.skipped?'skip':'no');
      h+='<div class="rev '+cls+'"><div class="t"><span class="bg">'+(ok?'✓':(r.skipped?'–':'✕'))+'</span>'
        +'<span style="flex:1"><b>'+(i+1)+'.</b> '+esc(r.question||'')+'</span>'
        +(r.marks!==undefined?'<span class="pm '+(r.marks>0?'plus':(r.marks<0?'minus':'zero'))+'">'+fmtMarks(r.marks)+'</span>':'')
        +'</div>';
      if(r.correctText!==undefined){
        h+='<div class="ans">'+(r.skipped?'सही: <b>'+esc(r.correctText)+'</b> · छोड़ा हुआ'
            :(ok?'सही उत्तर':'सही: <b>'+esc(r.correctText)+'</b> · आपका: <s>'+esc(r.chosenText)+'</s>'))+'</div>';
      }
      if(r.explanation)h+='<div class="ans">💡 '+esc(r.explanation)+'</div>';
      h+=questionMediaHTML(r)+'</div>';
      });
      return h+'</div>';
    });
  }
  h+='</div>';
  return h;
}
