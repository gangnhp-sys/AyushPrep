/* ============================================================
   DESIGN TOKENS
============================================================ */
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
:root{
  --bg:#fff8e5;
  --bg-2:#f5eed9;
  --panel:#fffdf6;
  --panel-2:#fbf4e2;
  --ink:#344936;
  --ink-2:#5e6e5a;
  --ink-3:#68765f;
  --line:#e5dcc5;
  --line-2:#cfc4a7;
  --brand:#4d694e;
  --brand-2:#3e5841;
  --brand-soft:#e7eddf;
  --hero:#4d694e;
  --hero-ink:#fff3d5;
  --ok:#36764d;
  --ok-soft:#e6f0e1;
  --ok-line:#a9c4a1;
  --bad:#a44e45;
  --bad-soft:#faeee5;
  --bad-line:#dfb8aa;
  --warn:#8c5b25;
  --serif:"MenuGeometric","Noto Sans Devanagari","Nirmala UI","Mangal","Kohinoor Devanagari",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --sans:"MenuGeometric","Paathshala","Noto Sans Devanagari","Nirmala UI","Mangal","Kohinoor Devanagari",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:28px;
  --sh-1:0 1px 2px rgba(52,73,54,.05), 0 3px 10px -6px rgba(52,73,54,.13);
  --sh-2:0 2px 8px rgba(52,73,54,.05), 0 20px 44px -22px rgba(52,73,54,.21);
  --sh-3:0 40px 90px -40px rgba(31,49,34,.38);
  --nav-h:66px;
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  --bg:#202d23;
  --bg-2:#26362a;
  --panel:#2c3d30;
  --panel-2:#26372b;
  --ink:#fff3d5;
  --ink-2:#d8dbc2;
  --ink-3:#c3cdb0;
  --line:#405340;
  --line-2:#5a7059;
  --brand:#d8e2bd;
  --brand-2:#edf0d6;
  --brand-soft:#394a38;
  --hero:#344b37;
  --hero-ink:#fff3d5;
  --ok:#a8ca91;
  --ok-soft:#304732;
  --ok-line:#5d7955;
  --bad:#f0a18a;
  --bad-soft:#4b3730;
  --bad-line:#815a4d;
  --warn:#e0c27e;
  --sh-1:0 1px 2px rgba(0,0,0,.28),0 3px 10px -6px rgba(0,0,0,.3);
  --sh-2:0 20px 44px -22px rgba(0,0,0,.62);
  --sh-3:0 40px 90px -40px rgba(0,0,0,.82);
}
/* ---------- WINE RED + LIGHT SAND  (#7F011F / #F5EBD0) ---------- */
[data-theme="wine"]{
  --bg:#f5ebd0;
  --bg-2:#eee1c1;
  --panel:#fdf7e8;
  --panel-2:#f8efdb;
  --ink:#3a0e18;
  --ink-2:#6b4550;
  --ink-3:#7c5a5f;
  --line:#e4d3ac;
  --line-2:#ccb88a;
  --brand:#7f011f;
  --brand-2:#650018;
  --brand-soft:#f4dfd7;
  --hero:#7f011f;
  --hero-ink:#f5ebd0;
  --ok:#2f6b50;
  --ok-soft:#e2eee0;
  --ok-line:#a6c4a0;
  --bad:#a83a1c;
  --bad-soft:#f9e3d6;
  --bad-line:#e0b79f;
  --warn:#8a5a18;
  --sh-1:0 1px 2px rgba(58,14,24,.05),0 3px 10px -6px rgba(58,14,24,.14);
  --sh-2:0 2px 8px rgba(58,14,24,.05),0 20px 44px -22px rgba(58,14,24,.24);
  --sh-3:0 40px 90px -40px rgba(58,14,24,.44);
}
[data-theme="wine"] ::selection{background:rgba(127,1,31,.18)}
[data-theme="wine"] .btn.primary{color:#f5ebd0}
[data-theme="wine"] .hero .btn.primary{color:var(--hero)}
[data-theme="wine"] .btn.soft:hover{background:color-mix(in srgb,var(--brand) 14%,transparent)}
/* ---------- PLUM + MILK  (#371931 / #FFF3E5) ---------- */
[data-theme="plum"]{
  --bg:#fff3e5;
  --bg-2:#f7e8d6;
  --panel:#fffaf1;
  --panel-2:#fbf1e1;
  --ink:#2b1226;
  --ink-2:#6a4a5e;
  --ink-3:#7d5f70;
  --line:#e9d8c4;
  --line-2:#d3bda8;
  --brand:#371931;
  --brand-2:#26101f;
  --brand-soft:#f0dfe3;
  --hero:#371931;
  --hero-ink:#fff3e5;
  --ok:#2f6b50;
  --ok-soft:#e2eee0;
  --ok-line:#a6c4a0;
  --bad:#a83a1c;
  --bad-soft:#f9e3d6;
  --bad-line:#e0b79f;
  --warn:#8a5a18;
  --sh-1:0 1px 2px rgba(43,18,38,.05),0 3px 10px -6px rgba(43,18,38,.14);
  --sh-2:0 2px 8px rgba(43,18,38,.05),0 20px 44px -22px rgba(43,18,38,.24);
  --sh-3:0 40px 90px -40px rgba(43,18,38,.44);
}
[data-theme="plum"] ::selection{background:rgba(55,25,49,.18)}
[data-theme="plum"] .btn.primary{color:#fff3e5}
[data-theme="plum"] .hero .btn.primary{color:var(--hero)}
[data-theme="plum"] .btn.soft:hover{background:color-mix(in srgb,var(--brand) 14%,transparent)}

html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit;color:inherit}
img,svg{display:block}
::selection{background:rgba(77,105,78,.24)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* ============================================================
   NAV
============================================================ */
.nav{position:sticky;top:0;z-index:80;background:var(--bg);
  border-bottom:1px solid var(--line)}
.nav-in{max-width:1160px;margin:0 auto;height:var(--nav-h);padding:0 24px;display:flex;align-items:center;gap:26px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.2px;flex:0 0 auto}
.brand .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  background:var(--brand);color:var(--hero-ink);box-shadow:0 6px 16px -8px rgba(42,66,44,.45)}
.brand b{font-weight:800}
.brand span{color:var(--ink-3);font-weight:600}
.brand{position:relative;padding:4px 2px;border-radius:10px;isolation:isolate;-webkit-tap-highlight-color:transparent}
.brand .brand-name{position:relative;display:inline-flex;align-items:baseline;gap:0;
  font-family:'AyushMark',"Paathshala",Georgia,'Times New Roman',serif;
  font-weight:900;font-size:23px;line-height:1.02;
  font-variation-settings:'SOFT' 62,'WONK' 1,'opsz' 120;
  letter-spacing:.005em;text-transform:uppercase;color:var(--ink);
  -webkit-font-smoothing:antialiased;transition:filter .3s var(--ease);
  padding-bottom:2px}
.brand .brand-name .w{display:inline-flex;align-items:baseline;color:var(--ink)}
.brand .brand-name .w.alt{color:var(--wm2)}
[data-theme="dark"] .brand .brand-name{color:var(--ink)}
[data-theme="dark"] .brand .brand-name .w.alt{color:var(--brand)}
.brand .brand-name .l{font-style:normal;display:inline-block;
  transform-origin:50% 90%}
.brand .brand-name .til{margin:0 .02em;font-weight:900;color:var(--brand);font-size:.9em;transform:translateY(.02em)}
/* wordmark ka doosra rang (theme ke hisaab se) */
:root{--wm2:#6f9a63}
[data-theme="wine"]{--wm2:#bd2f4e}
[data-theme="plum"]{--wm2:#8d4a7e}
[data-theme="dark"]{--wm2:#a9c98d}

/* underline swoosh */
.brand::before{content:'';position:absolute;left:2px;right:2px;bottom:-1px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--brand),color-mix(in srgb,var(--brand) 22%,transparent));
  transform:scaleX(0);transform-origin:left;opacity:0;
  transition:transform .42s var(--ease),opacity .3s}
.brand.is-live::before{transform:scaleX(1);opacity:.9}
/* gloss sweep */
.brand::after{content:'';position:absolute;top:1px;bottom:3px;left:0;width:34%;pointer-events:none;border-radius:6px;
  background:linear-gradient(100deg,transparent,color-mix(in srgb,var(--brand) 22%,transparent) 48%,transparent);
  opacity:0;transform:translateX(-140%) skewX(-16deg)}
.brand.is-live::after{animation:brandSweep .78s var(--ease) both}
@keyframes brandSweep{
  0%{opacity:0;transform:translateX(-140%) skewX(-16deg)}
  18%{opacity:.75}
  78%{opacity:.5}
  100%{opacity:0;transform:translateX(400%) skewX(-16deg)}}

/* hover: letters ek-ek karke uchhalte hain */
.brand.is-live .w .l{animation:lpop .62s cubic-bezier(.2,1.5,.35,1) both;
  animation-delay:calc(var(--i) * 34ms)}
@keyframes lpop{
  0%{transform:translateY(0) rotate(0) scale(1)}
  38%{transform:translateY(-7px) rotate(-7deg) scale(1.11)}
  68%{transform:translateY(2px) rotate(3deg) scale(.98)}
  100%{transform:translateY(0) rotate(0) scale(1)}
}
/* tilde: spin + bounce
   Lag ki wajah: rotation 3 alag speeds wale segments me + har segment me bouncy
   easing thi → hiccup lagta tha. Ab rotation ek hi continuous curve me chalta hai
   (from→to, single segment) aur pop/bounce alag transform properties me hota hai,
   taaki dono ek-dusre ki timing ko tok na karen. */
.brand .brand-name .til{transform-origin:50% 50%;will-change:transform,rotate,scale,translate}
.brand.is-live .til{animation:tilspin .8s cubic-bezier(.3,1.4,.4,1) both;animation-delay:170ms}
@keyframes tilspin{
  0%{transform:rotate(0) scale(1) translateY(0)}
  30%{transform:rotate(180deg) scale(1.34) translateY(-4px)}
  60%{transform:rotate(320deg) scale(1.12) translateY(1px)}
  100%{transform:rotate(360deg) scale(1) translateY(0)}
}
/* modern browsers: buttery-smooth path */
@supports (rotate:1deg){
  .brand.is-live .til{
    animation:tilspin-smooth .95s cubic-bezier(.42,.05,.26,1) both,
              tilpop .95s cubic-bezier(.33,1.4,.5,1) both;
    animation-delay:170ms;
  }
  /* sirf do keyframes → poori 360° ek hi easing me, koi beech ka hiccup nahi */
  @keyframes tilspin-smooth{from{rotate:0deg}to{rotate:360deg}}
  /* bounce/pop alag properties me — spin ki speed ko affect nahi karta */
  @keyframes tilpop{
    0%{scale:1;translate:0 0}
    38%{scale:1.3;translate:0 -4px}
    72%{scale:1.06;translate:0 1px}
    100%{scale:1;translate:0 0}
  }
}
.brand:active .brand-name{filter:brightness(1.06)}
/* ---------- 3D tilt + intro reveal + confetti ---------- */
.brand{transform-style:preserve-3d;transition:transform .18s var(--ease);will-change:auto}
.brand.tilting{transition:transform .06s linear}
.brand .brand-name{transform-origin:50% 60%}
/* load par ek baar reveal */
@keyframes introWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes introRise{from{opacity:0;transform:translateY(11px) rotate(-6deg)}to{opacity:1;transform:none}}
.brand.intro .brand-name{animation:introWipe .72s var(--ease) both}
.brand.intro .w .l{animation:introRise .55s cubic-bezier(.2,1.4,.35,1) both;
  animation-delay:calc(90ms + var(--i) * 46ms)}
.brand.intro .til{animation:introRise .55s cubic-bezier(.2,1.4,.35,1) .36s both}

/* confetti */
.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.cf{position:absolute;width:9px;height:13px;border-radius:2px;
  animation:cfFall var(--dur,1.5s) cubic-bezier(.22,.6,.3,1) forwards}
@keyframes cfFall{
  0%{opacity:0;transform:translate(0,0) rotate(0deg) scale(.7)}
  12%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx,0px),var(--dy,320px)) rotate(var(--rot,540deg)) scale(1)}
}
/* logo party ring */
.brand.party .brand-name{animation:partyPop .62s cubic-bezier(.2,1.6,.4,1) both}
@keyframes partyPop{
  0%{transform:scale(1)}30%{transform:scale(1.14) rotate(-2.5deg)}
  60%{transform:scale(.97) rotate(1.5deg)}100%{transform:scale(1)}
}
.brand.party::before{transform:scaleX(1);opacity:1}
@media (prefers-reduced-motion:reduce){
  .brand.intro .brand-name,.brand.intro .w .l,.brand.intro .til,.brand.party .brand-name{animation:none}
  .cf{display:none}
}

/* ---------- logo ke chhote "maja" elements ---------- */
.brand .spark{position:absolute;pointer-events:none;opacity:0;z-index:2;
  background:var(--wm2);border-radius:1px;
  width:7px;height:7px;
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%);
  opacity:.45}
.brand .spark.s1{left:-9px;top:1px;animation-delay:.2s}
.brand .spark.s2{right:-11px;bottom:5px;width:9px;height:9px;animation-delay:1.3s}
.brand .spark.s3{right:26px;top:-7px;width:5px;height:5px;animation-delay:2.4s}

/* dheemi sheen jo har ~6.5s me apne aap guzarti hai (idle magic) */
.brand .sheen{position:absolute;top:1px;bottom:3px;left:0;width:30%;pointer-events:none;border-radius:6px;z-index:1;
  background:linear-gradient(100deg,transparent,color-mix(in srgb,var(--brand) 16%,transparent) 50%,transparent);
  opacity:0;transform:translateX(-140%) skewX(-16deg);
  opacity:0}

/* tap par sparkle particles */
.brand .fx{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:3;
  background:var(--wm2);box-shadow:0 0 7px color-mix(in srgb,var(--wm2) 70%,transparent);
  animation:fxPop .72s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes fxPop{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}
  70%{opacity:.9}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.15)}
}
@media (prefers-reduced-motion:reduce){
  .brand .spark,.brand .sheen{animation:none;opacity:0}
  .brand .fx{display:none}
}

@media (prefers-reduced-motion:reduce){
  .brand.is-live .w .l,.brand.is-live .til,.brand.is-live::after{animation:none}
  .brand.is-live::before{transform:scaleX(1);opacity:.9}
}
.nav-links{display:flex;align-items:center;gap:2px;flex:1}
.nav-links a{position:relative;padding:8px 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2);transition:.16s}
.nav-links a:hover{color:var(--ink);background:var(--panel-2)}
.nav-links a.active{color:var(--brand);background:var(--brand-soft)}
.nav-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:15px;
  border:1px solid var(--line);background:var(--panel);transition:.18s;box-shadow:var(--sh-1)}
.icon-btn:hover{background:var(--panel-2);transform:translateY(-1px)}
.nav-burger{display:grid;flex:0 0 auto}
/* ============ LEFT DRAWER ============ */
.drawer-scrim{position:fixed;inset:0;z-index:210;background:color-mix(in srgb,var(--ink) 44%,transparent);
  opacity:0;pointer-events:none;transition:opacity .28s var(--ease)}
.drawer-scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;z-index:220;width:330px;max-width:88vw;background:var(--panel);
  border-right:1px solid var(--line);box-shadow:var(--sh-3);display:flex;flex-direction:column;
  transform:translateX(-104%);transition:transform .24s var(--ease)}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.drawer-body{flex:1;overflow-y:auto;padding:14px 12px 22px;overscroll-behavior:contain}
.d-sec{font-size:11.5px;font-weight:800;letter-spacing:0;color:var(--ink-3);padding:6px 10px;margin-top:6px}
.d-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 11px;border-radius:11px;
  font-family:var(--sans);
  font-size:16px;font-weight:600;letter-spacing:0;line-height:1.35;color:var(--ink);transition:background .15s,color .15s,transform .15s}
.d-item .cnt{font-family:var(--sans);font-size:11.5px;letter-spacing:0}
.nav-links a{font-family:var(--sans);font-weight:600}
.d-foot .d-theme button{font-family:var(--sans)}
.d-item:hover{background:var(--panel-2);transform:translateX(2px)}
.d-item.active{background:var(--brand-soft);color:var(--brand)}
.d-item .dico{width:17px;height:17px;color:var(--ink-3);flex:0 0 auto}
.d-item.active .dico{color:var(--brand)}
.d-item .cnt{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--ink-3);font-variant-numeric:tabular-nums}
.d-dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--brand));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--brand)) 16%,transparent);flex:0 0 auto;margin:0 5px}
.d-sep{height:1px;background:var(--line);margin:10px 8px}
/* ---------- drawer tree: subject > topic > subtopic ---------- */
.d-item .d-caret{width:16px;height:16px;flex:0 0 auto;color:var(--ink-3);transition:transform .2s var(--ease)}
.d-item.d-open .d-caret{transform:rotate(90deg);color:var(--brand)}
.d-item .d-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.d-item .d-tw{flex:0 0 auto;display:grid;place-items:center;width:22px;height:22px;margin:-4px -2px -4px -4px;
  border:0;background:transparent;border-radius:7px;cursor:pointer;color:var(--ink-3);padding:0}
.d-item .d-tw:hover{background:var(--panel-2);color:var(--brand)}
.d-item .d-tw svg{width:16px;height:16px;stroke-width:2.4;fill:none;stroke:currentColor}
.d-item .d-main{display:flex;align-items:center;gap:11px;flex:1;min-width:0;color:inherit;text-decoration:none}
.d-item .d-main:hover{color:var(--brand)}
.d-tree{list-style:none;margin:2px 0 6px;padding:0 0 0 15px;border-left:1px dashed var(--line)}
.d-tree li{position:relative}
.d-tree>li::before{content:'';position:absolute;left:-1px;top:0;bottom:0;border-left:1px dashed var(--line)}
.d-item.d-sub{padding:8px 10px;font-size:14px;gap:8px;border-radius:9px}
.d-item.d-sub .d-main{gap:8px}
.d-item.d-sub .d-dot{width:6px;height:6px;margin:0}
.d-item.d-sub .d-caret{width:14px;height:14px}
.d-item.d-leaf{padding:8px 10px;font-size:13.5px;gap:8px;border-radius:9px;color:var(--ink-2)}
.d-item.d-leaf:hover{color:var(--ink)}
.d-item.d-leaf .d-dot{width:5px;height:5px;margin:0}
.d-item.d-leaf .cnt{font-size:11px}
.d-item.d-sub .cnt{font-size:11px}
.d-none{padding:7px 12px;font-size:12px;color:var(--ink-3);font-family:var(--sans);font-weight:600}
.d-subject-row{width:100%}
.d-foot{flex:0 0 auto;border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;flex-direction:column;gap:9px}
.d-credit{margin:3px 0 0;padding-top:12px;border-top:1px solid var(--line);text-align:center;font-size:12px;font-weight:500;line-height:1.6;color:var(--ink-2)}
.d-credit strong{font-weight:800;color:var(--ink)}
.d-theme{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.d-theme button{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel-2);font-size:12.5px;font-weight:700;color:var(--ink)}
.d-theme button:hover{background:var(--brand-soft);color:var(--brand);border-color:color-mix(in srgb,var(--brand) 26%,transparent)}

/* ============================================================
   BUTTONS
============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;
  font-size:14px;font-weight:650;letter-spacing:-.1px;border:1px solid transparent;white-space:nowrap;
  transition:transform .16s var(--ease),box-shadow .2s,background .18s,border-color .18s,color .18s;user-select:none}
.btn:active{transform:scale(.975)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.lg{padding:13px 22px;font-size:15px;border-radius:13px}
.btn.primary{background:var(--brand);color:var(--hero-ink);box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 10px 24px -12px rgba(42,66,44,.44)}
.btn.primary:hover{background:var(--brand-2);transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 16px 30px -14px rgba(42,66,44,.5)}
[data-theme="dark"] .btn.primary{color:#26372b}
[data-theme="dark"] .brand .mark{color:#26372b}
.btn.ghost{background:var(--panel);border-color:var(--line);color:var(--ink);box-shadow:var(--sh-1)}
.btn.ghost:hover{background:var(--panel-2);border-color:var(--line-2);transform:translateY(-1px)}
.btn.soft{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.btn.soft:hover{background:color-mix(in srgb,var(--brand) 18%,transparent);transform:translateY(-1px)}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 16%,transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn svg{width:15px;height:15px}

/* ============================================================
   LAYOUT
============================================================ */
main{flex:1}
.wrap{max-width:1160px;margin:0 auto;padding:36px 24px 80px}
.wrap.narrow{max-width:780px}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-3);margin-bottom:20px;flex-wrap:wrap}
.crumbs a{color:var(--ink-2);transition:.15s}
.crumbs a:hover{color:var(--brand)}
.crumbs .sep{opacity:.5}
.backbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:99px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-2);font-size:12px;font-weight:800;cursor:pointer;transition:.16s;box-shadow:var(--sh-1)}
.backbtn:hover{color:var(--ink);border-color:var(--line-2);transform:translateX(-2px)}
.backbtn:active{transform:translateX(-2px) scale(.97)}
.crumbs b{color:var(--ink);font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:0;color:var(--brand)}
.h-sec{font-family:var(--serif);font-size:clamp(22px,2.6vw,29px);font-weight:600;letter-spacing:-.45px;margin-bottom:6px}
.p-sec{font-size:14px;color:var(--ink-2);max-width:560px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 0 20px;flex-wrap:wrap}
.page-in.enter{animation:fade .15s ease-out both}
.no-anim,.no-anim *{animation:none!important}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* ============================================================
   HERO
============================================================ */
.hero{position:relative;overflow:hidden;border-bottom:1px solid color-mix(in srgb,var(--hero-ink) 18%,transparent);background:var(--hero);color:var(--hero-ink)}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.34;
  background:radial-gradient(ellipse 70% 90% at 50% -25%,rgba(255,243,213,.14),transparent 68%),
    radial-gradient(ellipse 42% 65% at 100% 100%,rgba(255,243,213,.08),transparent 75%)}
.hero-in{position:relative;z-index:2;max-width:1160px;margin:0 auto;padding:64px 24px 60px;text-align:center}
.hero h1{font-family:var(--serif);font-size:clamp(34px,5.4vw,60px);line-height:1.05;letter-spacing:-1.7px;font-weight:600;margin:18px 0 17px;
  }
.hero h1 em{font-style:normal;font-weight:700;color:var(--hero-ink);position:relative;white-space:nowrap;
  text-decoration:none}
.hero h1 em::after{display:none;
  border-radius:3px;z-index:-1}
.hero-info summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:50%}.hero-info summary::-webkit-details-marker{display:none}.hero-info summary:focus-visible{outline:2px solid currentColor;outline-offset:3px}.hero-info[open] summary{transform:rotate(90deg)}
.hero p.lead{font-size:clamp(15px,1.6vw,17.5px);color:color-mix(in srgb,var(--hero-ink) 86%,transparent);max-width:590px;margin:0 auto;line-height:1.7;
  }
.hero-cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
.hero-note{margin-top:16px;font-size:12.5px;color:color-mix(in srgb,var(--hero-ink) 72%,transparent);}
.hero .badge{color:var(--hero);background:var(--hero-ink);border-color:rgba(255,243,213,.5);box-shadow:0 5px 18px rgba(25,43,27,.13)}
.hero .btn.primary{background:var(--hero-ink);color:var(--hero);border-color:transparent;box-shadow:0 12px 26px -14px rgba(15,32,17,.65)}
.hero .btn.primary:hover{background:#fff9e8}
.hero .btn.ghost{background:transparent;color:var(--hero-ink);border-color:rgba(255,243,213,.52);box-shadow:none}
.hero .btn.ghost:hover{background:rgba(255,243,213,.12);border-color:rgba(255,243,213,.8)}
.hero .stat{background:var(--hero-ink);border-color:rgba(255,243,213,.6);box-shadow:0 16px 34px -22px rgba(10,24,12,.75)}
.hero .stat b{font-family:var(--serif);font-size:27px;font-weight:700;letter-spacing:-.8px;color:var(--hero)}
.hero .stat span{color:color-mix(in srgb,var(--hero) 62%,transparent)}
[data-theme="dark"] .hero .stat{background:color-mix(in srgb,#fff3d5 9%,transparent);border-color:rgba(255,243,213,.28);box-shadow:none}
[data-theme="dark"] .hero .stat b{color:var(--hero-ink)}
[data-theme="dark"] .hero .stat span{color:color-mix(in srgb,var(--hero-ink) 62%,transparent)}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;font-size:12px;font-weight:700;
  color:var(--brand);background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh-1);
  }
.badge .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.dico{display:inline-block;width:1.02em;height:1.02em;vertical-align:-.14em;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.dico.fill{fill:currentColor;stroke:none}
.btn .dico,.tag .dico{width:14px;height:14px;vertical-align:-.12em}
.mini .dico{width:13px;height:13px}
.empty .dico{width:30px;height:30px;stroke-width:1.6}
.mono{font-weight:700;letter-spacing:0;font-size:16px;line-height:1}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:34px;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:left;box-shadow:var(--sh-1)}
.stat b{display:block;font-size:24px;font-weight:850;letter-spacing:-1px;line-height:1.1}
.stat span{font-size:11.5px;font-weight:600;letter-spacing:0;color:var(--ink-3)}

/* ============================================================
   SUBJECT CARD
============================================================ */
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:14px}
.subj{position:relative;display:flex;flex-direction:column;gap:0;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:20px;min-height:172px;box-shadow:var(--sh-1);overflow:hidden;text-align:left;
  transition:transform .26s var(--ease),box-shadow .26s,border-color .2s;
  }
.subj::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 0% 0%,var(--tint),transparent 58%),
    radial-gradient(80% 70% at 100% 100%,color-mix(in srgb,var(--c) 8%,transparent),transparent 70%)}
/* upar ka punchy accent bar */
.subj::after{content:'';position:absolute;left:0;right:0;top:0;height:5px;pointer-events:none;
  background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff) 62%,color-mix(in srgb,var(--c) 30%,transparent));
  opacity:.95;transition:opacity .2s}
.subj:hover{transform:translateY(-5px) scale(1.012);border-color:var(--tint-line);
  box-shadow:0 22px 46px -24px color-mix(in srgb,var(--c) 62%,transparent),0 3px 10px -6px color-mix(in srgb,var(--c) 30%,transparent)}
.subj:hover::after{opacity:1}
.subj:hover .go{transform:translate(2px,-2px);color:var(--c);background:var(--tint-strong)}
.subj .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative}
.tile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;
  background:var(--tint-strong);color:var(--c);border:1px solid var(--tint-line)}
/* subject ka monogram tile — solid gradient, white letter */
.subj .tile{background:linear-gradient(145deg,var(--c),var(--tint-deep));color:#fff;border-color:transparent;
  box-shadow:0 10px 22px -12px color-mix(in srgb,var(--c) 85%,transparent),0 1px 0 rgba(255,255,255,.28) inset;
  transition:transform .26s var(--ease),box-shadow .26s}
.subj:hover .tile{transform:translateY(-2px) rotate(-3deg);box-shadow:0 14px 28px -12px color-mix(in srgb,var(--c) 90%,transparent)}
.subj .tile .mono{color:#fff;font-weight:900}
.go{font-size:15px;color:var(--ink-3);transition:.22s;width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.subj h3{position:relative;font-size:17.5px;font-weight:750;letter-spacing:-.4px;margin-top:16px;color:var(--ink)}
.subj .meta{position:relative;font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:3px}
.subj .track{position:relative;height:6px;border-radius:99px;background:color-mix(in srgb,var(--c) 13%,var(--line));overflow:hidden;margin-top:14px}
.subj .track i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 58%,#fff));transition:width .7s var(--ease)}
.subj .pct{position:relative;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  color:color-mix(in srgb,var(--c) 78%,var(--ink));margin-top:9px}
/* dark theme: thoda lighten taaki cream bg par punchy rahe */
[data-theme="dark"] .subj .tile{box-shadow:0 10px 22px -12px color-mix(in srgb,var(--c) 90%,#000),0 1px 0 rgba(255,255,255,.18) inset}
[data-theme="dark"] .subj .pct{color:color-mix(in srgb,var(--c) 46%,var(--ink))}
[data-theme="dark"] .subj::after{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 70%,transparent)}


/* Home subject buttons: glossy, raised arcade-style surfaces. */
.drag-ghost{position:fixed!important;z-index:10000!important;pointer-events:none!important;opacity:.96!important;margin:0!important;transform:translate3d(var(--drag-x,0px),var(--drag-y,0px),0) scale(1.04)!important;will-change:transform;animation:none!important;box-shadow:0 18px 30px rgba(20,15,35,.3)!important}.drag-source{opacity:.3!important}.drop-target{outline:3px dashed var(--subject-color,var(--brand))!important;outline-offset:3px}
.subject-section,.chapter-square,.sortable-sub{touch-action:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.hold-ready{outline:3px dashed var(--subject-color,var(--brand));outline-offset:3px;filter:brightness(1.05)}
.chapter-squares{display:grid;grid-template-columns:repeat(2,minmax(0,190px));gap:clamp(10px,4vw,20px);margin-top:18px;padding-bottom:10px;max-width:400px}.chapter-square{min-width:0;overflow-wrap:anywhere;font-size:clamp(15px,4vw,19px)}
.chapter-square{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:clamp(12px,4vw,20px);text-decoration:none;font-size:clamp(15px,4vw,19px);font-weight:800;color:#392947;background:linear-gradient(145deg,#e9dcf5,#d1b8e6);border:3px solid #755789;border-radius:18px;box-shadow:0 7px 0 #755789,0 12px 18px rgba(60,39,75,.16),inset 0 3px 0 rgba(255,255,255,.65);transition:transform .2s,box-shadow .2s}
.type-list{display:grid;grid-template-columns:minmax(0,1fr);max-width:100%;gap:12px}
.type-list .chapter-square[data-parent]{aspect-ratio:auto;min-height:0;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;padding:12px 16px;font-size:clamp(14px,3.8vw,16px);line-height:1.4;border-radius:12px}
.type-list .chapter-square[data-parent] .chapter-name{flex:1;min-width:0}
.type-list .chapter-square[data-parent] .chapter-arrow{margin:0;align-self:center;flex:0 0 auto}
.chapter-square:nth-child(even){background:linear-gradient(145deg,#fbe0d4,#edc4b4);border-color:#9b624f;box-shadow:0 7px 0 #9b624f,0 12px 18px rgba(60,39,75,.16),inset 0 3px 0 rgba(255,255,255,.65);color:#50302b}
.chapter-square:hover{transform:translateY(-3px)}.chapter-square:active{transform:translateY(5px);box-shadow:0 2px 0 #755789}.chapter-square:focus-visible{outline:3px solid var(--ink);outline-offset:5px}.chapter-number{font-size:12px;opacity:.7;letter-spacing:.1em;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.chapter-square .chapter-name{text-shadow:0 1px 0 rgba(255,255,255,.75),0 2px 0 rgba(255,255,255,.35),0 3px 0 rgba(60,30,70,.18),0 4px 2px rgba(60,30,70,.22),0 8px 14px rgba(60,30,70,.28)}
.chapter-help{margin:12px 0}.chapter-help summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:50%}.chapter-help summary::-webkit-details-marker{display:none}.chapter-help summary:focus-visible{outline:2px solid currentColor;outline-offset:3px}.chapter-help[open] summary{transform:rotate(90deg)}.chapter-help .hint{margin:10px 0 0}
.chapter-arrow{align-self:flex-end;font-size:19px;text-shadow:0 1px 0 rgba(255,255,255,.6),0 3px 4px rgba(60,30,70,.3)}
.subject-page{min-height:70vh;background:linear-gradient(180deg,color-mix(in srgb,var(--subject-color) 13%,var(--bg)),var(--bg) 440px)}
.subject-page .banner{border-color:color-mix(in srgb,var(--subject-color) 30%,var(--line));background:color-mix(in srgb,var(--subject-color) 12%,var(--panel))}
.subject-page .btn.primary{color:#fff}
.subject-page .topic{border-color:color-mix(in srgb,var(--subject-color) 25%,var(--line))}
/* Subject ke buttons aur section cards par soft, full colour. */
.subject-page .btn{background:color-mix(in srgb,var(--subject-color) 25%,var(--panel));border-color:color-mix(in srgb,var(--subject-color) 45%,var(--line));color:var(--ink);box-shadow:0 3px 0 color-mix(in srgb,var(--subject-color) 52%,var(--panel));}
.subject-page .btn:hover{background:color-mix(in srgb,var(--subject-color) 36%,var(--panel));border-color:var(--subject-color)}
.subject-page .btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--subject-color) 52%,var(--panel))}
.subject-page .topic-grid>.topic{background:color-mix(in srgb,var(--subject-color) 26%,var(--panel));border:2px solid color-mix(in srgb,var(--subject-color) 48%,var(--line));box-shadow:0 5px 0 color-mix(in srgb,var(--subject-color) 60%,var(--panel));}
.subject-page .topic-grid>.topic:hover{background:color-mix(in srgb,var(--subject-color) 36%,var(--panel));border-color:var(--subject-color)}

.home-subjects{gap:18px;padding-bottom:8px}
.home-subjects .subj,.home-subjects .subj h3,.home-subjects .subj .meta,.home-subjects .subj .pct,.home-subjects .subj .mono{font-family:var(--sans)}
.home-subjects .subj h3{font-weight:600;letter-spacing:-.25px}

.home-subjects .subj{--face:#d9c8ef;--edge:#755789;--base:#a385bb;
  background:var(--face);border:3px solid var(--edge);border-radius:16px;
  box-shadow:0 6px 0 var(--edge),0 11px 15px rgba(22,40,25,.18),inset 0 3px 0 rgba(255,255,255,.46);
  padding:20px 18px 25px;min-height:180px;color:#142c1f;
  transition:transform .2s ease,box-shadow .2s ease}
.home-subjects .subj:nth-child(5n+2){--face:#f4c9b7;--edge:#9b624f;--base:#c58972}
.home-subjects .subj:nth-child(5n+3){--face:#c3d8f1;--edge:#55729b;--base:#819ec3}
.home-subjects .subj:nth-child(5n+4){--face:#ecc6d2;--edge:#955d70;--base:#bb899b}
.home-subjects .subj:nth-child(5n+5){--face:#f1dcac;--edge:#927443;--base:#bea16e}
.home-subjects .subj::before{inset:3px 3px 13px;border-radius:10px;background:linear-gradient(160deg,rgba(255,255,255,.24),transparent 55%);border:1px solid rgba(255,255,255,.25)}
.home-subjects .subj::after{left:3px;right:3px;top:auto;bottom:3px;height:10px;border-radius:0 0 9px 9px;background:var(--base);border-top:1px solid rgba(255,255,255,.55);opacity:1}
.home-subjects .subj:hover{transform:translateY(-3px);border-color:var(--edge);box-shadow:0 9px 0 var(--edge),0 15px 20px rgba(22,40,25,.2),inset 0 3px 0 rgba(255,255,255,.46)}
.home-subjects .subj:active{transform:translateY(5px);box-shadow:0 1px 0 var(--edge),0 3px 5px rgba(22,40,25,.18),inset 0 2px 0 rgba(255,255,255,.35)}
.home-subjects .subj:focus-visible{outline:3px solid var(--ink);outline-offset:5px}
.home-subjects .subj h3{color:#302838}.home-subjects .subj .meta,.home-subjects .subj .pct{color:#493b48}
.home-subjects .subj .tile{background:var(--edge);color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.23);border:0}
.home-subjects .subj .go{color:#493b48}.home-subjects .subj:hover .go{color:#302838;background:rgba(255,255,255,.35)}
.home-subjects .subj .track{background:rgba(20,45,28,.2)}.home-subjects .subj .track i{background:var(--edge)}
.subj .top{align-items:center}
.subj .top-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.subj .top-left .tile{flex:0 0 auto}
.subj .subj-qtotal{position:relative;display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:2px 5px;font-size:clamp(13px,3.2vw,15px);font-weight:750;color:var(--ink);line-height:1.15;min-width:0}
.subj .subj-qtotal b{font-family:var(--serif);font-size:clamp(18px,4.2vw,21px);font-weight:850;letter-spacing:-.4px;color:var(--c)}
.home-subjects .subj .subj-qtotal{font-family:var(--sans);font-size:clamp(13.5px,3.3vw,15.5px);font-weight:750;color:#3b2e42}
.home-subjects .subj .subj-qtotal b{font-family:var(--sans);font-size:clamp(19px,4.4vw,22px);font-weight:850;color:#241c2c}

/* ============================================================
   SUBTOPICS
============================================================ */
.substrip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.subchip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:99px;font-size:12.5px;font-weight:700;
  background:var(--panel);border:1px solid var(--tint-line);color:color-mix(in srgb,var(--c) 62%,var(--ink));
  box-shadow:var(--sh-1);transition:.18s}
.subchip:hover{transform:translateY(-2px);background:var(--tint-strong);box-shadow:0 12px 24px -16px color-mix(in srgb,var(--c) 70%,transparent)}
.subchip .sd{width:7px;height:7px;border-radius:50%;background:var(--c)}
.subchip .sc{font-size:11px;font-weight:800;color:#fff;background:var(--c);border-radius:99px;padding:1px 7px}

.subempty{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px 18px;border-radius:var(--r-lg);
  border:1px dashed var(--line-2);background:var(--panel-2);margin-bottom:8px}
.subempty .em{font-size:24px;line-height:1}
.subempty b{font-size:14px}
.subempty p{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin-top:3px;max-width:560px}
.subempty .btn{margin-left:auto}

.subsec{position:relative;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--panel);
  padding:16px 16px 14px;margin-bottom:16px;box-shadow:var(--sh-1);overflow:hidden}
.subsec::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 30%,transparent))}
.subhead{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px;padding-left:6px}
.subhead .sdot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:7px;
  box-shadow:0 0 0 4px var(--tint-strong);flex:0 0 auto}
.subhead h3{font-size:16.5px;font-weight:750;letter-spacing:-.3px}
.subhead .smeta{font-size:12px;font-weight:700;color:color-mix(in srgb,var(--c) 55%,var(--ink-2));margin-top:2px}
.subacts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
.subnone{font-size:13px;color:var(--ink-2);font-weight:600;padding:10px 12px;border-radius:10px;
  background:var(--panel-2);border:1px dashed var(--line);margin-left:6px}
.subnone .lnk{color:var(--brand);font-weight:800;text-decoration:underline;text-underline-offset:2px}

/* ============================================================
   TOPIC CARD
============================================================ */
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.topic{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-1);
  transition:transform .24s var(--ease),box-shadow .24s,border-color .2s;
  }
.topic:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--line-2)}
.topic-main{width:100%;text-align:left;padding:18px 18px 14px;display:block;position:relative}
.topic-main::before{content:'';position:absolute;left:0;top:0;width:100%;height:3px;background:linear-gradient(90deg,var(--c),transparent)}
.topic .tname{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:750;letter-spacing:-.3px}
.topic .tname .bulb{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px var(--tint-strong)}
.topic .tmeta{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:8px}
.topic .tmeta .qcount{color:var(--c);font-weight:800}
.topic-foot{display:flex;gap:6px;align-items:center;padding:0 14px 14px;flex-wrap:wrap}
.topic-foot .spacer{flex:1}
.t-subs{border-top:1px dashed var(--line);padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg-2)}
.t-sub{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--ink-2);
  font-size:13.5px;font-weight:650;border:1px solid transparent;transition:background .15s,color .15s,border-color .15s}
.t-sub:hover{background:var(--panel);color:var(--ink);border-color:var(--tint-line)}
.t-sub .d-dot{width:6px;height:6px;margin:0;background:var(--c,var(--brand));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--brand)) 16%,transparent)}
.t-sub .d-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-sub .cnt{font-size:11px;font-weight:800;color:var(--ink-3);font-variant-numeric:tabular-nums}
.t-non{font-size:12px;color:var(--ink-3);font-weight:600;padding:4px 10px}
.mini{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--ink-2);transition:.16s}
.mini:hover{background:var(--panel);color:var(--ink);border-color:var(--line-2);transform:translateY(-1px)}
.mini.danger:hover{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}

/* ============================================================
   PANEL / BANNER
============================================================ */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-1)}
.banner{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:28px;border:1px solid var(--tint-line);
  background:linear-gradient(135deg,var(--tint) 0%,transparent 58%),var(--panel);
  box-shadow:0 18px 40px -30px color-mix(in srgb,var(--c) 70%,transparent),var(--sh-1);margin-bottom:26px}
.banner::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;
  background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 45%,transparent))}
.banner::after{content:'';position:absolute;right:-70px;top:-80px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);pointer-events:none}
.banner .brow{position:relative;z-index:1;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.banner .tile{width:48px;height:48px;font-size:22px;background:linear-gradient(145deg,var(--c),var(--tint-deep));color:#fff;
  border-color:transparent;box-shadow:0 12px 24px -12px color-mix(in srgb,var(--c) 85%,transparent),0 1px 0 rgba(255,255,255,.3) inset}
.banner .tile .mono{color:#fff;font-weight:900}
.banner .actions{position:relative;z-index:1}
.banner h1{color:color-mix(in srgb,var(--c) 42%,var(--ink))}
.banner h1{font-family:var(--serif);font-size:clamp(24px,3vw,32px);font-weight:600;letter-spacing:-.55px;line-height:1.15}
.banner .sub{font-size:13.5px;color:var(--ink-2);font-weight:600;margin-top:5px}
.banner .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.banner .growwrap{flex:1;min-width:200px}

/* ============================================================
   QUESTION CARD
============================================================ */
.qlist{display:flex;flex-direction:column;gap:12px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-1);
  }
.qhead{display:flex;gap:11px;align-items:flex-start;margin-bottom:14px}
.qnum{flex:0 0 27px;width:27px;height:27px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:850;
  background:var(--tint-strong);color:var(--c);border:1px solid var(--tint-line)}
.qtext{flex:1;font-size:15px;line-height:1.55;font-weight:600;padding-top:2px;white-space:pre-wrap;word-break:break-word}
.qbtns{display:flex;gap:5px;flex:0 0 auto}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel-2);width:100%;text-align:left;font-size:14.5px;line-height:1.42;color:var(--ink);
  transition:background .16s,border-color .16s,transform .16s var(--ease),box-shadow .2s}
.opt .key{flex:0 0 24px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:850;
  background:var(--bg-2);color:var(--ink-2);border:1px solid var(--line);transition:.16s}
.opt .lbl{flex:1;word-break:break-word}
.opt .mark{flex:0 0 auto;font-size:13px;font-weight:800;opacity:0;transform:scale(.6);transition:.22s}
button.opt{cursor:pointer}
button.opt:hover{background:var(--panel);border-color:var(--line-2);transform:translateX(3px)}
button.opt:hover .key{color:var(--ink)}
.see-ans{display:inline-flex;align-items:center;gap:4px;margin-top:9px;padding:4px 10px;font-size:11.5px;font-weight:700;line-height:1;border-radius:999px;border:1px solid var(--line);background:var(--card,transparent);color:var(--ink-2);cursor:pointer;-webkit-tap-highlight-color:transparent}
.see-ans:hover{border-color:var(--ok-line);color:var(--ok)}
.see-ans .sa-hide{display:none}
.qcard.revealed .see-ans .sa-show{display:none}
.qcard.revealed .see-ans .sa-hide{display:inline}
.qcard.revealed .see-ans{border-color:var(--ok-line);color:var(--ok);background:var(--ok-soft)}
.ans-hidden .opt[data-c] .mark{opacity:0}
.ans-hidden .explain.ans-only{display:none}
.ans-hidden.revealed .opt[data-c]{border-color:var(--ok-line);background:var(--ok-soft);box-shadow:0 0 0 1px var(--ok-line) inset}
.ans-hidden.revealed .opt[data-c] .key{background:var(--ok);border-color:var(--ok);color:#fff}
.ans-hidden.revealed .opt[data-c] .mark{opacity:1;transform:none;color:var(--ok)}
.ans-hidden.revealed .explain.ans-only{display:block}
.opt.correct{border-color:var(--ok-line);background:var(--ok-soft);box-shadow:0 0 0 1px var(--ok-line) inset}
.opt.correct .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.correct .mark{opacity:1;transform:none;color:var(--ok)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft);animation:shake .4s var(--ease)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.wrong .mark{opacity:1;transform:none;color:var(--bad)}
.opt.dim{opacity:.45}
.opt.picked{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand) inset}
.opt.picked .key{background:var(--brand);border-color:var(--brand);color:#fff}
[data-theme="dark"] .opt.picked .key,[data-theme="dark"] .opt.correct .key,[data-theme="dark"] .opt.wrong .key{color:#26372b}
@keyframes shake{12%,88%{transform:translateX(-2px)}25%,75%{transform:translateX(4px)}40%,60%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.explain{margin-top:11px;padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.6;color:var(--ink-2);
  background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 22%,transparent);animation:pageIn .3s var(--ease) both}
.explain b{color:var(--brand);font-weight:750}

.type-questions{margin-top:26px}.type-questions summary{cursor:pointer;list-style:none}.type-questions summary::-webkit-details-marker{display:none}.type-questions summary::after{content:" ▾"}.type-questions[open] summary::after{content:" ▴"}
.exam-details{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap;max-width:100%;margin:10px 0 14px;padding:5px 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel-2);color:var(--ink-2);font-size:12px;font-weight:700;line-height:1.4}.exam-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:420px){.exam-fields{grid-template-columns:1fr}}
/* ============================================================
   RUNNER (practice / quiz)
============================================================ */
.runner{max-width:760px;margin:0 auto}
.rbar{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.rbar .track{flex:1;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.rbar .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .4s var(--ease)}
.rbar .tt{font-size:12.5px;font-weight:800;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.rbar .tt.marks{color:var(--brand);background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 26%,transparent);
  padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800}
/* marking scheme chip */
.mkchip{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;
  color:var(--ink-2);background:var(--bg-2);border:1px solid var(--line);letter-spacing:0;vertical-align:1px}
/* result: marks breakdown */
.mkrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 2px}
.mkbadge{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:11px;font-size:12.5px;font-weight:700;
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2)}
.mkbadge b{font-variant-numeric:tabular-nums}
.mkbadge.total{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 30%,transparent);color:var(--brand);font-size:13.5px}
.mkbadge.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.mkbadge.no{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.mkbadge.skip{background:var(--bg-2);color:var(--ink-2)}
/* per-question marks badge in review */
.rev .pm{flex:0 0 auto;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:8px;margin-top:1px}
.rev .pm.plus{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
.rev .pm.minus{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line)}
.rev .pm.zero{background:var(--bg-2);color:var(--ink-3);border:1px solid var(--line)}
.rev.skip .bg{background:var(--bg-2);color:var(--ink-3);border:1px solid var(--line)}
/* marking note strip */
.mknote{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 15px;border-radius:12px;margin-bottom:18px;
  background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 22%,transparent);font-size:12.5px;font-weight:700;color:var(--brand)}
.mknote span.n{background:var(--panel);border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);padding:3px 9px;border-radius:99px}
.qbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);padding:26px;box-shadow:var(--sh-2)}
.qbox .qtag{font-size:12px;font-weight:700;letter-spacing:0;color:var(--brand);margin-bottom:9px}
.qbox .qtitle{font-size:clamp(17px,2.4vw,20px);line-height:1.5;font-weight:700;letter-spacing:-.2px;margin-bottom:20px;
  white-space:pre-wrap;word-break:break-word}
.qbox .opts{gap:9px}
.qbox .opt{padding:13px 15px;font-size:14.5px}
.rfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.practice-hint{margin-top:14px}.practice-hint .explain{margin-top:10px}
.hint{font-size:12px;color:var(--ink-3);font-weight:600}

/* result */
.result{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);padding:34px 26px;text-align:center;box-shadow:var(--sh-2)}
.ring{position:relative;width:142px;height:142px;margin:0 auto 16px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--brand);stroke-dasharray:396;stroke-dashoffset:var(--off)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:850;letter-spacing:-1.5px}
.ring .val small{display:block;font-size:10.5px;font-weight:800;letter-spacing:1.3px;color:var(--ink-3);margin-top:1px}
.result h2{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:-.25px;margin-bottom:7px}
.result .sub{color:var(--ink-2);font-size:14px;margin-bottom:22px}
.row-c{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.review{margin-top:26px;text-align:left;display:flex;flex-direction:column;gap:9px}
.rev{border-radius:11px;padding:12px 14px;border:1px solid var(--line);background:var(--panel-2);font-size:13.5px;line-height:1.55}
.rev .t{display:flex;gap:9px;align-items:flex-start}
.rev .bg{flex:0 0 auto;width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:850;margin-top:1px}
.rev.ok .bg{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
.rev.no .bg{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line)}
.rev .ans{margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.rev .ans b{color:var(--ok);font-weight:750}
.rev .ans s{color:var(--bad);text-decoration-thickness:1.5px}

/* ============================================================
   FORMS / MODAL
============================================================ */
.overlay{position:fixed;inset:0;z-index:200;background:color-mix(in srgb,var(--ink) 46%,transparent);
  display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;
  animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:540px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);
  box-shadow:var(--sh-3);animation:modalIn .36s var(--ease) both;margin:auto}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.975)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}
.mhead h3{font-size:16.5px;font-weight:800;letter-spacing:-.3px}
.mbody{padding:20px 22px;display:flex;flex-direction:column;gap:15px}
.mfoot{display:flex;gap:9px;justify-content:flex-end;padding:15px 22px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;letter-spacing:0;color:var(--ink-2)}
.inp{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);
  font-size:14.5px;line-height:1.5;color:var(--ink);outline:none;transition:.16s;resize:vertical}
.inp:focus{border-color:var(--brand);background:var(--panel);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 16%,transparent)}
.inp::placeholder{color:var(--ink-3)}
.optrow{display:flex;align-items:center;gap:8px}
.optrow .pick{flex:0 0 32px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:11.5px;font-weight:850;
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);transition:.16s}
.optrow .pick.sel{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 6px 16px -8px rgba(54,118,77,.55)}
[data-theme="dark"] .optrow .pick.sel{color:#26372b}
.optrow .inp{flex:1}
.optrow .rm{flex:0 0 28px;width:28px;height:28px;border-radius:8px;color:var(--ink-3);font-size:12px;display:grid;place-items:center;transition:.16s}
.optrow .rm:hover{background:var(--bad-soft);color:var(--bad)}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.6;padding:12px 14px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line)}
.note b{color:var(--brand)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;padding:1.5px 5px;border-radius:5px;
  background:var(--brand-soft);color:var(--brand)}
.pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.65;white-space:pre;overflow-x:auto;
  padding:13px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);color:var(--ink-2)}
.filebtn{display:flex;align-items:center;justify-content:center;gap:9px;padding:18px;border-radius:12px;
  border:1.5px dashed var(--line-2);background:var(--panel-2);font-size:13.5px;font-weight:700;transition:.18s;cursor:pointer;text-align:center}
.filebtn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}

/* toast + confetti */
.toast-root{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:700;background:var(--ink);color:var(--panel);
  box-shadow:var(--sh-3);opacity:0;transform:translateY(14px);transition:.34s var(--ease);max-width:90vw;text-align:center}
[data-theme="dark"] .toast{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.toast.show{opacity:1;transform:none}
.toast.err{background:var(--bad);color:#fff}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:500;overflow:hidden}
.confetti i{position:absolute;top:-20px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(106vh) rotate(680deg);opacity:.2}}
.banner-warn{padding:11px 15px;border-radius:11px;font-size:12.5px;line-height:1.55;background:color-mix(in srgb,var(--warn) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 42%,transparent);color:var(--warn);margin-bottom:20px}

/* empty */
.empty{text-align:center;padding:44px 24px;border:1.5px dashed var(--line-2);border-radius:var(--r-xl);background:var(--panel-2)}
.empty .em{font-size:30px;margin-bottom:12px;display:block;opacity:.8}
.empty h3{font-size:16.5px;font-weight:750;margin-bottom:6px}
.empty p{font-size:13.5px;color:var(--ink-2);max-width:400px;margin:0 auto 18px;line-height:1.6}

/* how it works */
.how-toggle{margin:56px 0 0}.how-toggle summary{list-style:none;cursor:pointer}.how-toggle summary::-webkit-details-marker{display:none}.how-toggle summary::after{content:" ▾"}.how-toggle[open] summary::after{content:" ▴"}.how-toggle .steps{margin-top:18px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--sh-1);position:relative}
.step .n{font-size:11.5px;font-weight:700;letter-spacing:0;color:var(--brand);margin-bottom:10px}
.step h4{font-size:15.5px;font-weight:750;letter-spacing:-.3px;margin-bottom:7px}
.step p{font-size:13px;color:var(--ink-2);line-height:1.6}

/* cta band */
.ctaband{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:38px 30px;text-align:center;margin-top:54px;
  background:var(--hero);color:var(--hero-ink);box-shadow:0 24px 58px -34px rgba(42,66,44,.72)}
.ctaband::after{content:'';position:absolute;width:380px;height:380px;border-radius:50%;background:rgba(255,243,213,.1);
  background:radial-gradient(circle,rgba(255,243,213,.12),transparent 69%);right:-90px;top:-140px}
.ctaband h3{position:relative;font-family:var(--serif);font-size:clamp(23px,3vw,31px);font-weight:600;letter-spacing:-.35px;margin-bottom:9px}
.ctaband p{position:relative;font-size:14px;opacity:.9;margin-bottom:22px;max-width:460px;margin-left:auto;margin-right:auto}
.ctaband .btn{position:relative;background:var(--hero-ink);color:var(--hero);box-shadow:0 14px 30px -14px rgba(0,0,0,.38)}
.ctaband .btn:hover{background:#fff9e8;transform:translateY(-2px)}
.ctaband .btn.outline{background:rgba(255,243,213,.1);color:var(--hero-ink);border:1px solid rgba(255,243,213,.52)}
.ctaband .btn.outline:hover{background:rgba(255,243,213,.2)}

/* search */
.searchbar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:0 14px;box-shadow:var(--sh-1);max-width:420px;flex:1;min-width:200px}
.searchbar input{flex:1;border:none;background:none;outline:none;padding:11px 0;font-size:14px;color:var(--ink)}
.searchbar .si{color:var(--ink-3);font-size:14px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:700;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-2);transition:.16s}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
[data-theme="dark"] .chip.on{background:var(--brand);color:#26372b;border-color:var(--brand)}

/* ============================================================
   RESPONSIVE
============================================================ */
@media (max-width:900px){
  .f-in{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .nav-in{padding:0 16px;gap:10px}
  .nav-links{display:none}   /* मोबाइल पर सिर्फ़ left drawer */
  .nav-actions .btn.primary{display:none}
  .wrap{padding:24px 16px 64px}
  .hero-in{padding:44px 16px 42px}
  .qbox{padding:19px}
  .banner{padding:20px}
  .modal{border-radius:18px}
  .f-in{grid-template-columns:1fr;gap:26px;padding:34px 16px 20px}
  .f-bot{padding:14px 16px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

/* ============================================================
   THEORY (notes) — har topic aur subtopic ke liye
============================================================ */
.tabbar{display:inline-flex;gap:4px;padding:5px;border-radius:999px;background:var(--panel-2);
  border:1px solid var(--line);box-shadow:var(--sh-1);margin-bottom:20px;flex-wrap:wrap}
.tabbar a{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;
  font-size:13.5px;font-weight:750;color:var(--ink-2);transition:.18s;white-space:nowrap}
.tabbar a:hover{color:var(--ink);background:var(--panel)}
.tabbar a.on{background:var(--ink);color:var(--panel);box-shadow:var(--sh-1)}
[data-theme="dark"] .tabbar a.on{background:var(--brand);color:#26372b}
.tabbar .tc{font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;
  background:color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink-2)}
.tabbar a.on .tc{background:rgba(255,255,255,.22);color:inherit}
[data-theme="dark"] .tabbar a.on .tc{background:rgba(0,0,0,.2)}

.tbox{border-radius:var(--r-xl);border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--sh-1);padding:18px;margin-bottom:16px;position:relative;overflow:hidden}
.tbox::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--c,var(--brand)),color-mix(in srgb,var(--c,var(--brand)) 28%,transparent))}
.tbox-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px;padding-left:8px}
.tbox-head .tico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:0 0 auto;
  background:var(--tint-strong,color-mix(in srgb,var(--brand) 14%,transparent));
  color:var(--c,var(--brand));border:1px solid var(--tint-line,color-mix(in srgb,var(--brand) 30%,transparent))}
.tbox-head h2{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:-.2px}
.tbox-head .tmeta2{font-size:12px;font-weight:700;color:var(--ink-3);margin-top:3px}
.tbox-head .growwrap{flex:1;min-width:180px}
.tacts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}

.tlist{display:flex;flex-direction:column;gap:10px;padding-left:8px}
.tsec{border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);overflow:hidden;
  }
.tsec>summary{display:flex;gap:11px;align-items:center;padding:13px 15px;cursor:pointer;list-style:none;
  font-size:14.5px;font-weight:750;color:var(--ink);transition:background .16s;user-select:none}
.tsec>summary::-webkit-details-marker{display:none}
.tsec>summary:hover{background:color-mix(in srgb,var(--c,var(--brand)) 7%,transparent)}
.tsec[open]>summary{border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--c,var(--brand)) 9%,transparent)}
.tsec .num{font-size:11px;font-weight:800;color:var(--c,var(--brand));background:var(--panel);
  border:1px solid var(--tint-line,var(--line));border-radius:7px;padding:2px 7px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.tsec .tt2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tsec .wc{font-size:11px;font-weight:700;color:var(--ink-3);flex:0 0 auto}
.tsec .caret{flex:0 0 auto;color:var(--ink-3);font-size:11px;transition:transform .22s var(--ease)}
.tsec[open] .caret{transform:rotate(90deg)}
.tsec .tbody{padding:4px 18px 16px;background:var(--panel)}
.tsec .tsec-acts{display:flex;gap:6px;flex:0 0 auto}
.tsec .tsec-acts .mini{width:26px;height:26px;font-size:12px;border-radius:7px}
.trick-list{display:flex;flex-direction:column;gap:12px}
.trick-sec{background:var(--panel);box-shadow:var(--sh-1);border-radius:var(--r-lg)}
.trick-sec>summary{padding:15px 17px;font-size:15px}
.trick-sec .tbody{padding:12px 18px 18px}
.trick-meta{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:10px}
.trick-golden{margin:0 0 14px;padding:12px 15px;border-radius:var(--r);border:1px solid var(--tint-line,var(--line));border-left:4px solid var(--c,var(--brand));background:var(--tint,color-mix(in srgb,var(--brand) 9%,transparent))}
.trick-sublist{display:flex;flex-direction:column;gap:10px}
.trick-subcard{padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel-2)}
.trick-subhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.trick-subttl{flex:1;font-size:14.5px;line-height:1.5;font-weight:750;color:var(--ink);padding-top:2px;word-break:break-word}
.trick-subacts{display:flex;gap:6px;flex:0 0 auto;align-items:center}
.trick-subacts .mini{width:28px;height:28px;font-size:12.5px;border-radius:8px}
.trick-sec-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end;margin:0 0 12px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.trick-search-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:-4px 0 14px;padding:8px 12px;border-radius:var(--r);background:var(--panel-2);border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.quiz-subchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.quiz-subchip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);cursor:pointer;transition:border-color .15s,background .15s,color .15s}
.quiz-subchip:hover{border-color:var(--c,var(--brand));color:var(--ink);background:var(--tint,color-mix(in srgb,var(--brand) 12%,var(--panel)))}
/* ===== Study Suite: Revision Hub, Streak, Bookmarks, Mistakes, Flashcards ===== */
.study-strip{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 26px;padding:12px 14px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--panel);box-shadow:var(--sh-1)}
.study-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:750;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);text-decoration:none;transition:transform .16s var(--ease),border-color .16s,background .16s}
.study-pill:hover{transform:translateY(-1px);border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--panel))}
.study-pill.streak{border-color:color-mix(in srgb,#d97706 42%,var(--line));background:color-mix(in srgb,#f59e0b 12%,var(--panel));color:var(--ink)}
.study-pill.bad{border-color:color-mix(in srgb,var(--bad) 38%,var(--line));background:color-mix(in srgb,var(--bad) 9%,var(--panel))}
.study-pill.star{border-color:color-mix(in srgb,#eab308 45%,var(--line));background:color-mix(in srgb,#eab308 11%,var(--panel))}
.study-pill b{font-variant-numeric:tabular-nums}
.star-btn{transition:transform .15s var(--ease),color .15s,border-color .15s,background .15s}
.star-btn.on{color:#d97706;border-color:color-mix(in srgb,#eab308 55%,var(--line));background:color-mix(in srgb,#eab308 16%,var(--panel))}
.star-btn:active{transform:scale(.9)}
.rev-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}
.rev-tab{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:11px;font-size:13.5px;font-weight:750;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);text-decoration:none;transition:all .16s var(--ease)}
.rev-tab:hover{border-color:var(--brand);color:var(--ink)}
.rev-tab.on{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:var(--sh-1)}
.rev-tab .cnt{font-size:11.5px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,currentColor 16%,transparent);font-variant-numeric:tabular-nums}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi-card{padding:16px 18px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--panel);box-shadow:var(--sh-1)}
.kpi-card .k-lbl{font-size:12px;font-weight:750;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px}
.kpi-card .k-val{font-family:var(--serif);font-size:28px;font-weight:800;color:var(--ink);margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi-card .k-sub{font-size:12px;color:var(--ink-2)}
.week-bar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px}
.day-col{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2)}
.day-col.active{border-color:color-mix(in srgb,var(--brand) 48%,var(--line));background:color-mix(in srgb,var(--brand) 12%,var(--panel))}
.day-col .d-cnt{font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.day-col .d-lbl{font-size:11px;font-weight:700;color:var(--ink-3)}
.acc-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.acc-row{display:flex;flex-direction:column;gap:5px}
.acc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;font-weight:750}
.acc-track{height:8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.acc-track i{display:block;height:100%;border-radius:999px;background:var(--brand);transition:width .35s var(--ease)}
.acc-track.low i{background:var(--bad)}
.acc-track.mid i{background:#d97706}
.weak-item{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--bad) 32%,var(--line));background:color-mix(in srgb,var(--bad) 6%,var(--panel))}
.hist-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.hist-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel-2)}
.hist-pct{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--brand) 16%,var(--panel));color:var(--ink)}
.hist-pct.low{background:color-mix(in srgb,var(--bad) 16%,var(--panel));color:var(--bad)}
.mistake-badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--bad) 13%,var(--panel));color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.meta-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:750;padding:2px 8px;border-radius:999px;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line)}
.fc-wrap{max-width:620px;margin:0 auto}
.fc-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:14px 0 18px}
.fc-scene{perspective:1200px;-webkit-perspective:1200px}
.fc-card3d{position:relative;width:100%;min-height:280px;display:grid;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .42s cubic-bezier(.22,1,.36,1)}
.fc-card3d.flipped{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;position:relative;min-height:280px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:56px 26px 46px;border-radius:var(--r-xl);border:1.5px solid var(--line);background:var(--panel);box-shadow:var(--sh-2);backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:border-color .22s,box-shadow .22s}
.fc-front{transform:rotateY(0deg)}
.fc-back{transform:rotateY(180deg);border-color:var(--brand);background:color-mix(in srgb,var(--brand) 6%,var(--panel))}
.fc-card3d:not(.flipped) .fc-back{pointer-events:none}
.fc-card3d.flipped .fc-front{pointer-events:none}
.fc-card3d:not(.flipped):hover .fc-front{border-color:color-mix(in srgb,var(--brand) 55%,var(--line));box-shadow:0 14px 30px rgba(0,0,0,.09)}
.fc-top-tools{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}
.fc-side-tag{font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line)}
.fc-back .fc-side-tag{background:color-mix(in srgb,var(--brand) 16%,var(--panel));color:var(--brand);border-color:color-mix(in srgb,var(--brand) 35%,transparent)}
.fc-word{font-family:var(--serif);font-size:clamp(26px,5vw,38px);font-weight:800;line-height:1.25;color:var(--ink);margin:10px 0 8px;word-break:break-word}
.fc-sub{font-size:15px;color:var(--ink-2);margin-top:4px;line-height:1.5}
.fc-hint{position:absolute;bottom:14px;left:16px;right:16px;font-size:12px;color:var(--ink-3);font-weight:650}
@keyframes fcEnter{from{opacity:.45;transform:translateX(14px) scale(.985)}to{opacity:1;transform:none}}
.fc-stage-enter{animation:fcEnter .24s cubic-bezier(.22,1,.36,1)}
@keyframes fcCtrlFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.fc-ctrl-show{animation:fcCtrlFade .22s ease}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.fc-actions .btn{justify-content:center;padding:13px 16px;font-size:14.5px}
.fc-btn-repeat{background:color-mix(in srgb,#f59e0b 14%,var(--panel));border:1px solid color-mix(in srgb,#d97706 42%,var(--line));color:var(--ink)}
.fc-btn-repeat:hover{background:color-mix(in srgb,#f59e0b 24%,var(--panel))}
.fc-btn-know{background:var(--brand);color:#fff;border:1px solid var(--brand)}
.fc-btn-know:hover{filter:brightness(1.06)}
.audio-btn{font-size:13px}

/* rendered notes */
.md{font-size:14.5px;line-height:1.85;color:var(--ink)}
.md>*+*{margin-top:10px}
.md h4,.md h5,.md h6{font-family:var(--serif);font-weight:700;letter-spacing:-.2px;line-height:1.4;margin-top:20px}
.md h4{font-size:17px;color:color-mix(in srgb,var(--c,var(--brand)) 46%,var(--ink))}
.md h5{font-size:15px}
.md h6{font-size:13px;text-transform:none;color:var(--ink-2);font-weight:800}
.md p{margin:0}
.md ul,.md ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:5px}
.md ul ul,.md ol ol,.md ul ol,.md ol ul{margin-top:5px}
.md li::marker{color:var(--c,var(--brand));font-weight:800}
.md pre{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;
  overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,"Paathshala","Noto Sans Devanagari","Nirmala UI",monospace;font-size:12.5px;line-height:1.65;white-space:pre}
.md code{background:color-mix(in srgb,var(--c,var(--brand)) 11%,transparent);color:color-mix(in srgb,var(--c,var(--brand)) 62%,var(--ink));
  border-radius:6px;padding:1.5px 6px;font-family:ui-monospace,SFMono-Regular,Menlo,"Paathshala","Noto Sans Devanagari","Nirmala UI",monospace;font-size:12.5px;font-weight:600}
.md pre code{background:none;padding:0;color:var(--ink);font-size:12.5px}
.md blockquote{border-left:3px solid var(--c,var(--brand));padding:9px 14px;border-radius:0 10px 10px 0;
  background:color-mix(in srgb,var(--c,var(--brand)) 8%,transparent);color:var(--ink-2);font-size:13.5px}
.md blockquote p+p{margin-top:7px}
.md table{width:100%;border-collapse:collapse;font-size:13px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.md th{background:var(--panel-2);font-weight:800;color:var(--ink)}
.md tr:nth-child(even) td{background:color-mix(in srgb,var(--panel-2) 55%,transparent)}
.md hr{border:0;border-top:1px dashed var(--line-2);margin:16px 0}
.md a{color:var(--brand);font-weight:700;text-underline-offset:2px}
.md strong{font-weight:800;color:color-mix(in srgb,var(--c,var(--brand)) 34%,var(--ink))}
.md em{font-style:italic}

.tnone{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:18px;border-radius:var(--r-lg);
  border:1px dashed var(--line-2);background:var(--panel-2);margin-left:8px}
.tnone .em{font-size:26px;line-height:1}
.tnone b{font-size:14.5px}
.tnone p{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-top:4px;max-width:600px}
.tnone .row-c{margin-left:auto}

/* svg icons theory UI ke andar */
.tico .dico{width:19px;height:19px}
.tabbar .dico{width:14px;height:14px}
.tnone .em .dico{width:26px;height:26px;stroke-width:1.6}
.tsec .num~.tt2 .dico{width:13px;height:13px}
.topic .tmeta .dico{width:12px;height:12px;vertical-align:-1.5px}
.subchip .sc .dico{width:10px;height:10px;margin-right:3px;vertical-align:-1px}
.smeta .dico,.tmeta2 .dico{width:12px;height:12px;vertical-align:-1.5px}
.d-item .cnt .dico{width:11px;height:11px;vertical-align:-1px;margin-right:2px}

/* import modal bits */
.tprev{border:1px dashed var(--line-2);border-radius:11px;padding:11px 13px;background:var(--panel-2);
  font-size:12.5px;color:var(--ink-2);line-height:1.65;max-height:170px;overflow-y:auto}
.tprev b{color:var(--brand)}
.tprev .tpi{display:flex;gap:8px;align-items:baseline;padding:3px 0}
.tprev .tpi span:first-child{font-weight:800;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tprev .tpi span:last-child{font-size:11px;color:var(--ink-3);font-weight:700;flex:0 0 auto}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line)}
.seg button{padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:750;color:var(--ink-2);transition:.16s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel);color:var(--brand);box-shadow:var(--sh-1);border:1px solid var(--line)}
.tedit-sec{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:12px;display:flex;flex-direction:column;gap:9px}
.tedit-sec .teh{display:flex;gap:8px;align-items:center}
.tedit-sec .teh .inp{flex:1}
.tedit-sec textarea{font-family:ui-monospace,SFMono-Regular,Menlo,"Paathshala","Noto Sans Devanagari","Nirmala UI",monospace;font-size:12.5px;line-height:1.7}
@media (max-width:760px){
  .tabbar{width:100%}
  .tabbar a{flex:1;justify-content:center;padding:9px 12px}
  .tbox{padding:15px 13px}
  .tacts{margin-left:0;width:100%}
  .tnone .row-c{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){.tsec .caret{transition:none}}

/* ============================================================
   DEVANAGARI TYPOGRAPHY TUNING
============================================================ */
/* matra clipping / tracking: Devanagari me negative letter-spacing hatao */
h1,h2,h3,h4,h5,.hero h1,.h-sec,.banner h1,.result h2,.ctaband h3,.brand,.step h4,.subj h3,.qbox .qtitle,.stat b{
  letter-spacing:-.15px;
}
.hero h1{line-height:1.16;font-weight:700;letter-spacing:-.4px}
.h-sec{line-height:1.28;font-weight:700}
.banner h1{line-height:1.24;font-weight:700}
.result h2,.ctaband h3{font-weight:700}
/* reference-jaisa heavy display look */
.hero h1,.h-sec,.banner h1,.result h2,.ctaband h3,.brand{
  -webkit-text-stroke:.35px currentColor;
  text-rendering:optimizeLegibility;
}
.brand{font-weight:700;letter-spacing:0}
.brand b{font-weight:700}
/* Devanagari ke liye thoda zyada line-height */
body{line-height:1.62}
.hero p.lead,.step p,.p-sec,.note,.explain,.rev{line-height:1.75}
.qtext,.qbox .qtitle,.opt .lbl{line-height:1.6}
/* uppercase labels Devanagari me mat use karo — chhota tracking */
.eyebrow,.field label,.f-col h5,.stat span,.step .n,.qtag,.crumbs{letter-spacing:0;text-transform:none}
.eyebrow,.step .n{font-weight:700}
/* numbers Latin me clean rahen */
.stat b,.ring .val{font-family:var(--sans);-webkit-text-stroke:0}
/* language-aware */
html[lang="hi"] .mono{font-family:var(--sans)}
